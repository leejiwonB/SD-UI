{cat:'text', ko:'텍스트 스크램블', en:'Text Scramble', alias:'디코드(Decode) 효과, 해킹 텍스트, 랜덤 문자',
 desc:'무작위 문자들이 섞이다가 원래 글자로 하나씩 맞춰져요. 테크·IT·게임 느낌을 줄 때 써요.',
 dev:'GSAP ScrambleTextPlugin', hint:'자동 재생',
 html:`<div class="d-scr">DECODE TEXT</div>`,
 init(st,c){const el=st.querySelector('.d-scr'),fin='DECODE TEXT',cs='!<>-_/[]{}=+*^?#01ABCDEF';const run=()=>{let f=0;c.raf(()=>{f++;el.textContent=[...fin].map((ch,i)=>ch===' '?' ':(f>i*2.4+10?ch:cs[Math.random()*cs.length|0])).join('');return f<48;});};run();c.every(run,3200);}},
{cat:'text', ko:'마퀴', en:'Marquee', alias:'흐르는 텍스트, 티커(Ticker), 무한 롤링 배너, 띠 배너',
 desc:'텍스트가 한 방향으로 끊임없이 흘러가요. 마우스를 올리면 멈추게(Pause on hover) 하거나 속도·방향을 지정할 수 있어요.',
 dev:'translateX(-50%) linear infinite', hint:'호버 시 정지',

{cat:'text', ko:'카운트 업', en:'Count Up', alias:'숫자 카운팅, 넘버 롤링, 넘버 티커',
 desc:'숫자가 0부터 목표값까지 빠르게 올라가요. 성과·통계 섹션에서 화면에 보일 때 시작하도록 많이 써요.',
 dev:'CountUp.js · requestAnimationFrame', hint:'↻ 재생',
 html:`<div class="d-count"><div class="num">0</div><p>함께하는 디자이너</p></div>`,
 init(st,c){const el=st.querySelector('.num'),to=12840,d=1700;let t0;c.raf(t=>{if(t0===undefined)t0=t;const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,4);el.textContent=Math.round(to*e).toLocaleString();return p<1;});}},
{cat:'text', ko:'쉬머 텍스트', en:'Shimmer Text', alias:'샤인(Shine) 효과, 반짝이는 텍스트, 그라디언트 텍스트',
 desc:'빛이 글자 위를 지나가듯 그라디언트가 흘러가요. 로딩 문구나 강조하고 싶은 짧은 문구에 써요.',

{cat:'text', ko:'마스크 리빌', en:'Mask Reveal', alias:'라인 리빌, 슬라이드 업 텍스트, 텍스트 리빌',
 desc:'보이지 않는 틀(마스크) 안에서 글자가 아래부터 밀려 올라와요. 줄 단위로 시차를 주면 고급스럽고 또렷한 등장이 돼요.',
 dev:'overflow: hidden + translateY(100%→0)', hint:'↻ 재생',
 html:`<div class="d-mask"><span class="ln"><span>Design is</span></span><span class="ln"><span>how it</span></span><span class="ln"><span style="color:var(--accent)">works.</span></span></div>`},
{cat:'text', ko:'단어 로테이트', en:'Word Rotate', alias:'텍스트 로테이터, 롤링 텍스트, 플립 워드',
 desc:'문장 속 한 단어만 위아래로 바뀌며 순환해요. 헤드카피에서 여러 가치를 한 문장으로 보여줄 때 좋아요.',
 dev:'interval + slide out / slide in', hint:'자동 재생',
 html:`<div class="d-rot">우리는 <span class="rw">빠르게</span><br>만듭니다</div>`,
 init(st,c){const el=st.querySelector('.rw'),ws=['빠르게','정확하게','아름답게','함께'];let i=0;c.every(()=>{const a=el.animate([{transform:'none',opacity:1},{transform:'translateY(-60%)',opacity:0}],{duration:250,easing:'ease-in',fill:'forwards'});a.onfinish=()=>{i=(i+1)%ws.length;el.textContent=ws[i];a.cancel();el.animate([{transform:'translateY(60%)',opacity:0},{transform:'none',opacity:1}],{duration:380,easing:'cubic-bezier(.2,1.3,.4,1)'});};},1900);}},
{cat:'text', ko:'하이라이트 드로우', en:'Highlight Draw', alias:'형광펜 효과, 마커 효과, 밑줄 그리기',
 desc:'형광펜으로 칠하듯 배경색이 왼쪽에서 오른쪽으로 채워져요. 핵심 단어에 시선을 모아줘요.',
 dev:'background-size: 0% → 100%', hint:'↻ 재생',
 html:`<p class="d-hl">디자이너와 개발자가<br><mark>같은 단어</mark>로 말하면<br><mark class="m2">소통이 빨라져요</mark></p>`},
{cat:'text', ko:'블러 인', en:'Blur In', alias:'포커스 인, 블러 리빌, 디포커스',
 desc:'흐릿하던 글자가 선명해지며 나타나요. 페이드보다 부드럽고 감성적인 느낌이에요.',
 dev:'filter: blur(12px) → blur(0)', hint:'↻ 재생',
 html:`<div class="d-blur">흐릿함에서 또렷함으로<br>천천히 드러나는 문장</div>`,
 init(st){const el=st.querySelector('.d-blur');const lines=el.innerHTML.split('<br>');el.innerHTML='';let k=0;lines.forEach((ln,li)=>{const d=document.createElement('div');d.textContent=ln;split(d,'w');d.querySelectorAll('.ch').forEach(s=>s.style.setProperty('--i',k++));el.appendChild(d);});}},
{cat:'text', ko:'웨이브 텍스트', en:'Wave Text', alias:'물결 효과, 바운싱 레터',
 desc:'글자가 시차를 두고 위아래로 출렁여요. 로딩 문구나 귀엽고 장난스러운 톤에 어울려요.',
 dev:'translateY keyframes + delay', hint:'자동 재생',
 html:`<div class="d-wave">Loading...</div>`,
 init(st){split(st.querySelector('.d-wave'));}},
{cat:'text', ko:'글리치', en:'Glitch', alias:'노이즈 효과, 깨짐 효과, RGB 분리(RGB Split)',
 desc:'화면이 깨진 듯 색이 어긋나고 잘려 보여요. 사이버·게임·스트리트 무드에 써요.',
 dev:'::before / ::after + clip-path', hint:'자동 재생',
 html:`<div class="d-glitch"><span data-t="GLITCH">GLITCH</span></div>`},
{cat:'text', ko:'텍스트 채우기', en:'Text Fill', alias:'아웃라인 텍스트, 스트로크 텍스트, 텍스트 와이프',
 desc:'외곽선만 있는 글자에 호버하면 색이 채워져요. 큰 타이포 위주의 브랜드 사이트에서 자주 써요.',
 dev:'-webkit-text-stroke · clip-path', hint:'호버',
 html:`<div class="d-fill" data-t="HOVER ME">HOVER ME</div>`},

/* ---------- INTERACTION ---------- */
{cat:'interaction', ko:'호버 리프트', en:'Hover Lift', alias:'떠오르기, 카드 호버, 엘리베이션(Elevation)',
 desc:'마우스를 올리면 카드가 살짝 떠오르며 그림자가 커져요. "누를 수 있다"는 신호(어포던스)를 줘요.',
 dev:'translateY(-8px) + box-shadow', hint:'호버',
 html:`<div class="d-lift"><div class="th"></div><b>여름 컬렉션</b><small>24개 상품</small></div>`},
{cat:'interaction', ko:'리플 효과', en:'Ripple Effect', alias:'물결 효과, 잉크(Ink) 효과, 터치 피드백',
 desc:'누른 위치에서 원이 퍼져 나가요. 머티리얼 디자인의 대표적인 터치 피드백이에요.',
 dev:'MUI ButtonBase · scale(0→1)', hint:'클릭',
 html:`<div class="d-col"><button class="d-btn p d-ripple" style="padding:13px 28px">눌러보세요</button><div class="d-rcard d-ripple">리스트 항목도 눌러보세요</div></div>`,
 init(st){st.querySelectorAll('.d-ripple').forEach(b=>b.addEventListener('pointerdown',e=>{const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height)*2.2;s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);s.addEventListener('animationend',()=>s.remove());}));}},
{cat:'interaction', ko:'마그네틱 버튼', en:'Magnetic Button', alias:'자석 효과, 커서 끌림',
 desc:'커서가 가까이 가면 버튼이 커서 쪽으로 끌려와요. 포트폴리오·에이전시 사이트에서 자주 보여요.',
 dev:'pointermove · translate(dx * 0.35)', hint:'근처로 호버',
 html:`<button class="d-mag"><span>Hover me</span></button>`,
 init(st){const b=st.querySelector('.d-mag'),t=b.querySelector('span');const reset=()=>{b.style.transform='';t.style.transform='';};st.addEventListener('pointermove',e=>{const pr=st.getBoundingClientRect(),cx=pr.left+b.offsetLeft+b.offsetWidth/2,cy=pr.top+b.offsetTop+b.offsetHeight/2,x=e.clientX-cx,y=e.clientY-cy;if(Math.hypot(x,y)<120){b.style.transform=`translate(${x*.35}px,${y*.35}px)`;t.style.transform=`translate(${x*.15}px,${y*.15}px)`;}else reset();});st.addEventListener('pointerleave',reset);}},
{cat:'interaction', ko:'언더라인 애니메이션', en:'Underline Animation', alias:'밑줄 슬라이드, 링크 호버',
 desc:'호버하면 밑줄이 그려져요. 왼쪽에서(from left) / 가운데서(from center) 등 시작 방향을 함께 전달하세요.',
 dev:'::after scaleX(0→1) · transform-origin', hint:'호버',
 html:`<div class="d-ul"><a class="l">왼쪽에서 그려지는 밑줄</a><a class="c">가운데서 퍼지는 밑줄</a></div>`},
{cat:'interaction', ko:'3D 틸트', en:'Tilt Effect', alias:'틸트 카드, 홀로그램 카드, 3D 호버',
 desc:'커서 위치에 따라 카드가 입체적으로 기울어지고, 빛 반사(Glare)가 따라 움직여요.',
 dev:'perspective + rotateX/Y · vanilla-tilt.js', hint:'카드 위 호버',
 html:`<div class="d-tilt"><small>MEMBERSHIP</small><b>PREMIUM</b><div class="gl"></div></div>`,
 init(st){const card=st.querySelector('.d-tilt'),g=card.querySelector('.gl');card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;card.style.transform=`perspective(600px) rotateY(${(px-.5)*22}deg) rotateX(${(.5-py)*22}deg) scale(1.04)`;g.style.background=`radial-gradient(circle at ${px*100}% ${py*100}%,rgba(255,255,255,.5),transparent 55%)`;});card.addEventListener('pointerleave',()=>{card.style.transform='';g.style.background='transparent';});}},
{cat:'interaction', ko:'좋아요 버스트', en:'Like Burst', alias:'하트 팝, 파티클 버스트, 컨페티',
 desc:'하트를 누르면 쪼그라들었다 커지며 작은 파티클이 터져요. 작은 행동에 즐거움을 주는 대표적인 마이크로 인터랙션이에요.',
 dev:'scale keyframes + particles · Lottie', hint:'♡ 클릭',
 html:`<div class="d-likew"><button class="d-like" aria-label="좋아요"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2.1 0 3.6 1.2 4.4 2.5h2C13.8 6.2 15.3 5 17.4 5 21 5 23 8.6 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg></button><span class="cnt">128</span></div>`,
 init(st){const b=st.querySelector('.d-like'),n=st.querySelector('.cnt');let on=false,cnt=128;const cols=['#ff5a36','#3d5afe','#ffb547','#14b87a'];b.onclick=()=>{on=!on;cnt+=on?1:-1;n.textContent=cnt;b.classList.toggle('on',on);if(!on)return;b.querySelector('svg').animate([{transform:'scale(1)'},{transform:'scale(.6)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:480,easing:'ease-out'});for(let i=0;i<10;i++){const p=document.createElement('i');p.className='pt';p.style.background=cols[i%4];const a=i/10*Math.PI*2;b.appendChild(p);p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*36}px),calc(-50% + ${Math.sin(a)*36}px)) scale(0)`,opacity:.6}],{duration:600,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();}};}},
{cat:'interaction', ko:'셰이크', en:'Shake', alias:'흔들기, 에러 흔들림, 진동 효과',
 desc:'입력이 잘못됐을 때 좌우로 흔들어 오류를 알려요. 빨간 테두리·안내 문구와 함께 써요. (정답: 1234)',
 dev:'translateX keyframes · 400ms', hint:'확인 클릭',
 html:`<div class="d-shake"><div class="r"><input type="password" placeholder="비밀번호"><button class="d-btn p">확인</button></div><div class="err"></div></div>`,
 init(st){const f=st.querySelector('.d-shake'),inp=f.querySelector('input'),m=f.querySelector('.err');f.querySelector('button').onclick=()=>{if(inp.value==='1234'){f.classList.remove('bad');m.textContent='✓ 로그인 성공';m.style.color='#16a34a';return;}f.classList.add('bad');m.style.color='';m.textContent='비밀번호가 올바르지 않아요';f.animate([{transform:'translateX(0)'},{transform:'translateX(-9px)'},{transform:'translateX(9px)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(-3px)'},{transform:'translateX(0)'}],{duration:420});};}},
{cat:'interaction', ko:'펄스', en:'Pulse', alias:'핑(Ping), 맥박 효과, 라이브 표시',
 desc:'원이 퍼지며 반복적으로 주목을 끌어요. 실시간(LIVE) 상태, 새 기능 안내, 눌러야 할 위치를 표시할 때 써요.',
 dev:'scale + opacity · infinite', hint:'자동 재생',
 html:`<div class="d-pulse"><span class="d-live"><span class="d-dot"></span>LIVE</span><span class="d-pbtn" style="z-index:0">+</span></div>`},
{cat:'interaction', ko:'스포트라이트', en:'Spotlight', alias:'마우스 팔로우 글로우, 커서 조명, 보더 글로우',
 desc:'커서를 따라 빛이 비추듯 밝은 원이 움직여요. 다크 테마의 카드·기능 소개 섹션에서 많이 써요.',
 dev:'radial-gradient(at var(--x) var(--y))', hint:'카드 위 호버',
 html:`<div class="d-spot"><b>Spotlight</b><p>마우스를 움직여 보세요.<br>빛이 커서를 따라와요.</p></div>`,
 init(st){const s=st.querySelector('.d-spot');s.addEventListener('pointermove',e=>{const r=s.getBoundingClientRect();s.style.setProperty('--x',(e.clientX-r.left)+'px');s.style.setProperty('--y',(e.clientY-r.top)+'px');});}},
{cat:'interaction', ko:'플립 카드', en:'Flip Card', alias:'카드 뒤집기, 3D 플립',
 desc:'카드가 뒤집히며 뒷면 정보를 보여줘요. 앞면엔 이미지, 뒷면엔 설명을 두는 식으로 써요.',
 dev:'rotateY(180deg) · backface-visibility', hint:'호버',
 html:`<div class="d-flip"><div class="in"><div class="f"><small>FRONT</small><b>앞면</b></div><div class="b">뒷면에는 상세 설명이나 가격, 버튼을 넣을 수 있어요.</div></div></div>`},
{cat:'interaction', ko:'커스텀 커서', en:'Custom Cursor', alias:'커서 팔로워, 마우스 커서 효과',
 desc:'기본 화살표 대신 디자인된 커서를 써요. 바깥 원이 살짝 늦게(lerp) 따라오고, 링크 위에서는 커져요.',
 dev:'cursor: none · lerp follow', hint:'영역 안 호버',
 html:`<div class="d-cur"><span class="lk">WORK</span><span class="lk">ABOUT</span><i class="ring"></i><i class="cur"></i></div>`,
 init(st,c){const a=st.querySelector('.d-cur'),dot=a.querySelector('.cur'),ring=a.querySelector('.ring');let mx=-100,my=-100,rx=-100,ry=-100;a.addEventListener('pointermove',e=>{const r=a.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;dot.style.transform=`translate(${mx}px,${my}px)`;a.classList.toggle('big',!!e.target.closest('.lk'));});a.addEventListener('pointerleave',()=>{mx=my=-100;dot.style.transform='translate(-100px,-100px)';});c.raf(()=>{rx+=(mx-rx)*.16;ry+=(my-ry)*.16;ring.style.transform=`translate(${rx}px,${ry}px)`;});}},
{cat:'interaction', ko:'프레스 효과', en:'Press Feedback', alias:'탭 피드백, 눌림 효과, 스케일 다운',
 desc:'누르는 동안 살짝 작아졌다가, 손을 떼면 통통 튀며 돌아와요. 앱 버튼의 "손맛"을 만들어요.',
 dev:':active { transform: scale(.92) }', hint:'꾹 누르기',
 html:`<button class="d-press">꾹 눌러보세요</button>`},

{cat:'interaction', ko:'드래그 앤 드롭 정렬', en:'Drag & Drop Sort', alias:'소터블 리스트, 순서 변경, 재정렬',
 desc:'항목을 잡고 끌어서 순서를 바꿔요. 끄는 동안 원래 자리는 점선으로 비워두고, 다른 항목들이 부드럽게 자리를 비켜줘요.',
 dev:'dnd-kit · SortableJS · draggable', hint:'항목 드래그',
 html:`<ul class="d-sort">${['리서치','와이어프레임','디자인 시안','개발 전달'].map((t,i)=>`<li draggable="true"><em>⋮⋮</em><b>${i+1}</b>${t}</li>`).join('')}</ul>`,
 init(st){const L=st.querySelector('.d-sort');let drag=null;const num=()=>L.querySelectorAll('li b').forEach((b,i)=>b.textContent=i+1);L.querySelectorAll('li').forEach(li=>{li.addEventListener('dragstart',e=>{drag=li;li.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','');}catch(_){}});li.addEventListener('dragend',()=>{li.classList.remove('dragging');drag=null;num();});});L.addEventListener('dragover',e=>{e.preventDefault();if(!drag)return;const after=[...L.querySelectorAll('li:not(.dragging)')].find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2;});const first=new Map([...L.children].map(x=>[x,x.getBoundingClientRect().top]));if(after){if(after.previousElementSibling!==drag)L.insertBefore(drag,after);}else if(L.lastElementChild!==drag)L.appendChild(drag);[...L.children].forEach(x=>{if(x===drag)return;const d=first.get(x)-x.getBoundingClientRect().top;if(d)x.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:180,easing:'ease-out'});});});}},
{cat:'interaction', ko:'이미지 비교 슬라이더', en:'Before / After Slider', alias:'비포 애프터, 이미지 비교, 컴페어 슬라이더',
 desc:'가운데 손잡이를 좌우로 끌어 두 이미지를 겹쳐 비교해요. 보정 전후, 리뉴얼 전후를 보여줄 때 써요.',
 dev:'clip-path: inset() · range input', hint:'좌우로 드래그',
 html:`<div class="d-ba" style="--p:50%"><div class="im bf"><b>BEFORE</b></div><div class="im af"><b>AFTER</b></div><div class="hd"><i>⟷</i></div><input type="range" min="0" max="100" value="50" aria-label="비교"></div>`,
 init(st,c){const w=st.querySelector('.d-ba'),r=w.querySelector('input');let user=false;const set=v=>{w.style.setProperty('--p',v+'%');};r.oninput=()=>{user=true;set(r.value);};let t0;c.raf(t=>{if(user)return false;if(t0===undefined)t0=t;const p=(t-t0)/1800;if(p>=1){set(50);r.value=50;return false;}const v=50+Math.sin(p*Math.PI*2)*28;set(v);r.value=v;});}},
{cat:'interaction', ko:'호버 줌', en:'Hover Zoom', alias:'이미지 확대 호버, 썸네일 줌, 캡션 슬라이드',
 desc:'마우스를 올리면 프레임은 그대로 두고 안의 이미지만 살짝 확대돼요. 아래에서 캡션이 함께 올라오기도 해요.',
 dev:'overflow: hidden + scale(1.1)', hint:'호버',
 html:`<div class="d-zoom"><div class="img"></div><div class="cap"><b>Summer Collection</b><small>자세히 보기 →</small></div></div>`},
{cat:'interaction', ko:'복사 버튼 피드백', en:'Copy Feedback', alias:'클립보드 복사, 복사 완료 표시',
 desc:'복사 아이콘을 누르면 체크 표시로 바뀌고 "복사됨!"이 잠깐 떠요. 누른 결과를 그 자리에서 바로 확인시켜 줘요.',
 dev:'navigator.clipboard.writeText()', hint:'복사 아이콘 클릭',
 html:`<div class="d-copyw"><code>npm install motion</code><button class="d-cp" aria-label="복사"><span class="a"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg></span><span class="b"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5 9-10"/></svg></span></button><em class="tipc">복사됨!</em></div>`,
 init(st,c){const b=st.querySelector('.d-cp'),t=st.querySelector('.tipc');b.onclick=async()=>{try{await navigator.clipboard.writeText('npm install motion');}catch(e){}b.classList.add('ok');t.classList.add('show');clearTimeout(b._h);b._h=setTimeout(()=>{b.classList.remove('ok');t.classList.remove('show');},1500);};}},

/* ---------- PAGE ---------- */
{cat:'page', ko:'페이드', en:'Fade', alias:'크로스 페이드(Cross-fade), 디졸브(Dissolve)',
 desc:'이전 화면이 사라지고 새 화면이 겹치며 나타나요. 가장 기본적이고 무난한 전환이에요.',
 dev:'opacity · View Transitions API', hint:'자동 재생 · 버튼 클릭', html:PHONE, init:pageInit('fade')},
{cat:'page', ko:'슬라이드', en:'Slide (Push)', alias:'푸시 전환, 수평 슬라이드',
 desc:'새 화면이 옆에서 들어오며 이전 화면을 밀어내요. 두 화면이 함께 움직이는 게 특징이에요.',
 dev:'translateX(100% → 0)', hint:'자동 재생 · 버튼 클릭', html:PHONE, init:pageInit('slide')},
{cat:'page', ko:'커버', en:'Cover', alias:'스택 전환, iOS 푸시, 오버레이 슬라이드',
 desc:'새 화면이 이전 화면 위를 덮으며 들어오고, 뒤 화면은 조금만 밀리며 어두워져요. iOS 앱의 기본 화면 이동 방식이에요.',
 dev:'z-index + translateX(-30%) + dim', hint:'자동 재생 · 버튼 클릭', html:PHONE, init:pageInit('cover')},
{cat:'page', ko:'줌', en:'Zoom (Scale)', alias:'스케일 전환, 확대 전환',
 desc:'이전 화면은 커지며 사라지고, 새 화면은 작게 시작해 제 크기가 돼요. 안쪽으로 들어가는 듯한 깊이감을 줘요.',
 dev:'scale(.82 → 1) + opacity', hint:'자동 재생 · 버튼 클릭', html:PHONE, init:pageInit('zoom')},
{cat:'page', ko:'플립', en:'Flip', alias:'3D 회전 전환, 카드 플립 전환',
 desc:'화면이 카드처럼 세로축(Y축)을 중심으로 뒤집혀요. 앞/뒷면 개념이 있는 화면에 어울려요.',
 dev:'rotateY · perspective', hint:'자동 재생 · 버튼 클릭', html:PHONE, init:pageInit('flip')},
{cat:'page', ko:'와이프', en:'Wipe', alias:'닦아내기, 클립 리빌(Clip Reveal)',
 desc:'새 화면이 한쪽 끝부터 걷히듯 드러나요. 이전 화면은 움직이지 않아요.',
 dev:'clip-path: inset()', hint:'자동 재생 · 버튼 클릭', html:PHONE, init:pageInit('wipe')},
{cat:'page', ko:'서클 리빌', en:'Circle Reveal', alias:'원형 확장, 아이리스(Iris) 전환, 리플 전환',
 desc:'누른 버튼 위치에서 원이 퍼지며 새 화면이 드러나요. 누른 곳과 결과를 자연스럽게 이어줘요.',
 dev:'clip-path: circle()', hint:'자동 재생 · 버튼 클릭', html:PHONE, init:pageInit('circle')},
{cat:'page', ko:'블러 전환', en:'Blur Transition', alias:'블러 크로스페이드, 포커스 전환',
 desc:'이전 화면은 흐려지며 사라지고, 새 화면은 흐릿하게 나타났다 또렷해져요.',
 dev:'filter: blur() + opacity', hint:'자동 재생 · 버튼 클릭', html:PHONE, init:pageInit('blur')},
{cat:'page', ko:'커튼 전환', en:'Curtain Transition', alias:'오버레이 전환, 패널 와이프, 셔터 전환',
 desc:'색 패널이 화면을 덮었다가 걷히는 사이에 페이지가 바뀌어요. 브랜드·포트폴리오 사이트의 페이지 이동에 자주 써요.',
 dev:'Barba.js · GSAP timeline', hint:'자동 재생 · 버튼 클릭', html:PHONE, init:pageInit('curtain')},
{cat:'page', ko:'공유 요소 전환', en:'Shared Element Transition', alias:'히어로(Hero) 애니메이션, 모핑 전환, 매직 무브',
 desc:'목록의 썸네일이 그대로 커지며 상세 화면이 돼요. 두 화면이 같은 요소로 연결돼 맥락이 끊기지 않아요.',
 dev:'View Transitions API · FLIP · layoutId', hint:'자동 재생 · 카드 클릭',
 html:`<div class="d-browser">${BBAR}<div class="d-phone pcvp"><div class="pg a">${NAVL}<div class="se-grid pc4"><div class="se-card" style="background:#ff8a65"></div><div class="se-card" style="background:#7c9cff"></div><div class="se-card" style="background:#5fd3a8"></div><div class="se-card" style="background:#ffd166"></div></div><i></i><i style="width:60%"></i></div></div></div>`,
 init(st,c){const ph=st.querySelector('.d-phone'),cards=[...ph.querySelectorAll('.se-card')];let open=null,busy=false;const E='cubic-bezier(.6,0,.2,1)';
  const openCard=card=>{if(open||busy)return;busy=true;const pr=ph.getBoundingClientRect(),r=card.getBoundingClientRect(),bl=ph.clientLeft,bt=ph.clientTop;const d=document.createElement('div');d.className='se-detail';d.innerHTML='<div class="se-hero"></div><div class="se-body"><b>상세 화면</b><i></i><i style="width:80%"></i><i style="width:55%"></i><button class="pg-go">← 닫기</button></div>';const h=d.querySelector('.se-hero'),body=d.querySelector('.se-body');h.style.background=card.style.background;ph.appendChild(d);const W=ph.clientWidth,H=ph.clientHeight;const from={left:(r.left-pr.left-bl)+'px',top:(r.top-pr.top-bt)+'px',width:r.width+'px',height:r.height+'px',borderRadius:'10px'},to={left:'0px',top:'0px',width:W+'px',height:H*.48+'px',borderRadius:'0px'};card.style.visibility='hidden';h.animate([from,to],{duration:520,easing:E,fill:'forwards'}).onfinish=()=>{busy=false;};d.animate([{background:'rgba(255,255,255,0)'},{background:'rgba(255,255,255,1)'}],{duration:300,fill:'forwards'});body.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:320,delay:320,fill:'both'});open={d,h,card,from,to,body};d.querySelector('.pg-go').onclick=close;};
  const close=()=>{if(!open||busy)return;busy=true;const {d,h,card,from,to,body}=open;open=null;body.animate([{opacity:1},{opacity:0}],{duration:150,fill:'forwards'});d.animate([{background:'rgba(255,255,255,1)'},{background:'rgba(255,255,255,0)'}],{duration:380,delay:120,fill:'forwards'});h.animate([to,from],{duration:480,delay:80,easing:E,fill:'forwards'}).onfinish=()=>{card.style.visibility='';d.remove();busy=false;};};
  cards.forEach(cd=>cd.onclick=()=>openCard(cd));c.after(()=>openCard(cards[1]),800);c.after(close,2700);}},

/* ---------- SCROLL ---------- */
{cat:'scroll', ko:'스크롤 리빌', en:'Scroll Reveal', alias:'스크롤 등장 효과, 인뷰(In-view) 애니메이션, 스크롤 트리거',
 desc:'요소가 화면에 들어올 때 나타나요. 몇 % 보였을 때 시작할지(threshold), 한 번만 재생할지(once) 함께 정해 주세요.',
 dev:'IntersectionObserver · AOS · ScrollTrigger', hint:'스크롤', full:true,
 html:`<div class="sc">${filler(10,'카드').replace(/sc-blk/g,'sc-blk rv')}</div>${SC_HINT}`,
 init(st){const sc=st.querySelector('.sc');const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('in',e.isIntersecting)),{root:sc,threshold:.3});sc.querySelectorAll('.rv').forEach(x=>io.observe(x));}},
{cat:'scroll', ko:'패럴랙스', en:'Parallax', alias:'시차 스크롤, 패럴랙스 스크롤링',
 desc:'레이어마다 스크롤 속도가 달라서 깊이감이 생겨요. 멀리 있는 배경일수록 느리게, 가까운 요소일수록 빠르게 움직여요.',
 dev:'translateY(scrollY × speed)', hint:'스크롤', full:true,
 html:`<div class="sc"><div class="px"><div class="sky" data-sp=".75"><i class="sun"></i></div><h4 data-sp=".9">PARALLAX</h4><svg class="h1" data-sp=".45" viewBox="0 0 300 100" preserveAspectRatio="none"><path d="M0 55 Q60 5 130 45 T300 30 V100 H0Z" fill="#8aa6f0"/></svg><svg class="h2" data-sp=".15" viewBox="0 0 300 100" preserveAspectRatio="none"><path d="M0 50 Q90 0 170 50 T300 45 V100 H0Z" fill="#3d5afe"/></svg></div>${filler(6)}</div>${SC_HINT}`,
 init(st){const sc=st.querySelector('.sc'),L=[...sc.querySelectorAll('[data-sp]')];sc.addEventListener('scroll',()=>{const y=sc.scrollTop;L.forEach(l=>l.style.transform=`translateY(${y*l.dataset.sp}px)`);},{passive:true});}},
{cat:'scroll', ko:'스티키 헤더', en:'Sticky Header', alias:'고정 헤더, 축소 헤더(Shrink Header), 플로팅 헤더',
 desc:'스크롤해도 상단에 붙어 있어요. 스크롤을 시작하면 높이가 줄고 그림자가 생기는 형태가 흔해요.',
 dev:'position: sticky; top: 0', hint:'스크롤', full:true,
 html:`<div class="sc"><div class="sh">LOGO<span><i></i><i></i><i></i></span></div>${filler(8)}</div>${SC_HINT}`,
 init(st){const sc=st.querySelector('.sc'),h=sc.querySelector('.sh');sc.addEventListener('scroll',()=>h.classList.toggle('small',sc.scrollTop>16),{passive:true});}},
{cat:'scroll', ko:'스크롤 진행 바', en:'Scroll Progress Bar', alias:'읽기 진행률, 리딩 프로그레스(Reading Progress)',
 desc:'글을 얼마나 읽었는지 상단 막대로 보여줘요. 긴 아티클·블로그·약관 페이지에 써요.',
 dev:'scrollTop / (scrollHeight − clientHeight)', hint:'스크롤', full:true,
 html:`<div class="pbar"><i></i></div><div class="sc"><div class="art"><h4>긴 아티클 제목</h4>${'<i></i><i style="width:92%"></i><i style="width:80%"></i><i></i><i style="width:60%"></i><br>'.repeat(5)}</div></div>${SC_HINT}`,
 init(st){const sc=st.querySelector('.sc'),b=st.querySelector('.pbar i');sc.addEventListener('scroll',()=>{b.style.width=(sc.scrollTop/(sc.scrollHeight-sc.clientHeight)*100)+'%';},{passive:true});}},
{cat:'scroll', ko:'스크롤 스냅', en:'Scroll Snap', alias:'풀페이지 스크롤, 섹션 스냅, 원페이지 스크롤',
 desc:'스크롤을 멈추면 섹션 단위로 딱 맞춰 정렬돼요. 풀스크린 섹션으로 구성된 원페이지 사이트에 써요.',
 dev:'scroll-snap-type: y mandatory · fullPage.js', hint:'스크롤', full:true,
 html:`<div class="sc snap"><section style="background:#3d5afe">01</section><section style="background:#ff5a36">02</section><section style="background:#16161a">03</section><section style="background:#14b87a">04</section></div>${SC_HINT}`},
{cat:'scroll', ko:'가로 스크롤', en:'Horizontal Scroll', alias:'수평 스크롤, 카드 리스트 스와이프',
 desc:'목록을 옆으로 넘겨 봐요. 다음 카드가 살짝 보이게(Peek) 하면 더 넘길 수 있다는 걸 알려줄 수 있어요.',
 dev:'overflow-x: auto · scroll-snap-type: x', hint:'휠 / 드래그 / 스와이프', full:true,
 html:`<div class="hsc"><div style="background:#3d5afe">추천 01</div><div style="background:#ff5a36">추천 02</div><div style="background:#16161a">추천 03</div><div style="background:#14b87a">추천 04</div><div style="background:#9b5cff">추천 05</div><div style="background:#ffb547">추천 06</div></div>`,
 init(st){const h=st.querySelector('.hsc');h.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){h.scrollLeft+=e.deltaY;e.preventDefault();}},{passive:false});}},
{cat:'scroll', ko:'스마트 헤더', en:'Hide on Scroll', alias:'숨김 헤더, 오토 하이드 헤더, 헤드룸(Headroom)',
 desc:'아래로 스크롤하면 헤더가 숨고, 조금이라도 위로 올리면 다시 나타나요. 읽는 영역을 넓게 쓸 수 있어요.',
 dev:'Headroom.js · scroll direction', hint:'아래 ↓ 위 ↑ 스크롤', full:true,
 html:`<div class="sc"><div class="sh smart">LOGO<span><i></i><i></i><i></i></span></div>${filler(10)}</div>${SC_HINT}`,
 init(st){const sc=st.querySelector('.sc'),h=sc.querySelector('.sh');let last=0;sc.addEventListener('scroll',()=>{const y=sc.scrollTop;if(Math.abs(y-last)<3)return;h.classList.toggle('hide',y>last&&y>50);last=y;},{passive:true});}},
{cat:'scroll', ko:'무한 스크롤', en:'Infinite Scroll', alias:'자동 더보기, 레이지 로딩(Lazy Loading), 피드 로딩',
 desc:'목록 끝에 닿으면 다음 콘텐츠를 자동으로 불러와요. SNS 피드처럼 끝없이 둘러보는 서비스에 써요.',
 dev:'IntersectionObserver · fetchNextPage', hint:'끝까지 스크롤', full:true,
 html:`<div class="sc"><div class="ilist"></div><div class="ild"><div class="d-spin" style="width:22px;height:22px;border-width:3px"></div></div></div>${SC_HINT}`,
 init(st,c){const sc=st.querySelector('.sc'),list=sc.querySelector('.ilist'),ld=sc.querySelector('.ild');let n=0,busy=false;const add=k=>{for(let i=0;i<k;i++){n++;const d=document.createElement('div');d.className='irow';d.innerHTML=`<i></i><span>게시물 #${n}</span>`;list.appendChild(d);d.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:300,delay:i*40,fill:'both'});}};add(6);sc.addEventListener('scroll',()=>{if(busy||n>=60)return;if(sc.scrollTop+sc.clientHeight>sc.scrollHeight-24){busy=true;ld.classList.add('on');c.after(()=>{add(6);ld.classList.remove('on');busy=false;},800);}},{passive:true});}},
{cat:'scroll', ko:'맨 위로 버튼', en:'Back to Top', alias:'탑 버튼, 스크롤 투 탑(Scroll to Top)',
 desc:'어느 정도 스크롤하면 나타나고, 누르면 부드럽게 맨 위로 올라가요.',
 dev:'scrollTo({ top: 0, behavior: "smooth" })', hint:'스크롤 후 ↑ 클릭', full:true,
 html:`<div class="sc">${filler(10)}</div><button class="btt" aria-label="맨 위로">↑</button>${SC_HINT}`,
 init(st){const sc=st.querySelector('.sc'),b=st.querySelector('.btt');sc.addEventListener('scroll',()=>b.classList.toggle('show',sc.scrollTop>90),{passive:true});b.onclick=()=>sc.scrollTo({top:0,behavior:'smooth'});}},

/* ---------- LOADING ---------- */
{cat:'loading', ko:'스켈레톤 UI', en:'Skeleton', alias:'스켈레톤 로딩, 플레이스홀더, 고스트 UI, 쉬머(Shimmer)',
 desc:'실제 콘텐츠가 올 자리에 회색 뼈대를 먼저 보여줘요. 그 위를 지나가는 빛은 쉬머(Shimmer)라고 불러요. 스피너보다 체감 대기 시간이 짧아요.',
 dev:'Skeleton · shimmer gradient', hint:'자동 반복',
 html:`<div class="d-skel"><div class="ly sk"><div class="av"></div><div class="tx"><i style="width:60%"></i><i></i><i style="width:80%"></i></div></div><div class="ly real"><div class="av"></div><div class="tx"><b>김디자인</b><small>스켈레톤이 끝나면 실제 콘텐츠가 같은 자리에 나타나요.</small></div></div></div>`,
 init(st,c){const k=st.querySelector('.d-skel');c.every(()=>k.classList.toggle('loaded'),2200);}},
{cat:'loading', ko:'스피너', en:'Spinner', alias:'로딩 인디케이터, 로더(Loader), 뺑뺑이',
 desc:'끝을 알 수 없는 짧은 대기에 써요. 왼쪽은 링(Ring) 스피너, 오른쪽은 iOS 스타일 스포크(Spokes) 스피너예요.',
 dev:'border-top-color + rotate infinite', hint:'자동 재생',
 html:`<div class="d-row" style="gap:40px"><div class="d-spin"></div><div class="d-spokes"></div></div>`,
 init(st){const s=st.querySelector('.d-spokes');for(let i=0;i<12;i++){const x=document.createElement('i');x.style.transform=`rotate(${i*30}deg)`;x.style.animationDelay=(-1+i/12)+'s';s.appendChild(x);}}},
{cat:'loading', ko:'프로그레스 바', en:'Progress Bar', alias:'진행 막대, 로딩 바, 로딩 게이지',
 desc:'진행률을 알 때는 확정형(Determinate), 모를 때는 계속 흐르는 비확정형(Indeterminate)을 써요.',
 dev:'<progress> · determinate / indeterminate', hint:'자동 재생',
 html:`<div class="d-pb"><div class="lb"><span>Determinate</span><span class="pb-t">0%</span></div><div class="bar pb-det"><i></i></div><div class="lb" style="margin-top:14px"><span>Indeterminate</span><span>…</span></div><div class="bar pb-ind"><i></i></div></div>`,
 init(st,c){const b=st.querySelector('.pb-det i'),t=st.querySelector('.pb-t');let p=0,hold=0;c.every(()=>{if(p>=100){if(++hold<5)return;p=0;hold=0;}else p=Math.min(100,p+Math.random()*12);b.style.width=p+'%';t.textContent=Math.round(p)+'%';},250);}},
{cat:'loading', ko:'도트 로더', en:'Dot Loader', alias:'점 로딩, 타이핑 인디케이터(Typing Indicator)',
 desc:'점 세 개가 차례로 튀어요. 채팅에서 "상대방이 입력 중…"을 나타낼 때도 써요.',
 dev:'stagger bounce · 150ms delay', hint:'자동 재생',
 html:`<div class="d-dots"><i></i><i></i><i></i></div>`},
{cat:'loading', ko:'원형 프로그레스', en:'Circular Progress', alias:'프로그레스 링, 도넛 게이지',
 desc:'원 둘레를 따라 진행률을 보여줘요. 업로드 진행, 목표 달성률 등에 써요.',
 dev:'SVG stroke-dashoffset', hint:'↻ 재생',
 html:`<div class="d-ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="40"/><circle class="fg" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="251.3"/></svg><b>0%</b></div>`,
 init(st,c){const fg=st.querySelector('.fg'),b=st.querySelector('b'),to=72,d=1500;let t0;c.raf(t=>{if(t0===undefined)t0=t;const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3),v=to*e;fg.setAttribute('stroke-dashoffset',251.3*(1-v/100));b.textContent=Math.round(v)+'%';return p<1;});}},
{cat:'loading', ko:'성공 체크', en:'Success Checkmark', alias:'완료 애니메이션, 체크 드로우, 라인 드로잉',
 desc:'원과 체크 표시가 선으로 그려지며 완료를 알려요. 선이 그려지는 기법을 라인 드로잉(Line Drawing)이라고 해요.',
 dev:'stroke-dasharray / dashoffset · Lottie', hint:'↻ 재생',
 html:`<div class="d-ok"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34"/><path d="M25 41 l10 10 l20 -22"/></svg><b>결제가 완료됐어요</b></div>`},
{cat:'loading', ko:'엠티 스테이트', en:'Empty State', alias:'빈 화면, 데이터 없음, 제로 스테이트(Zero State)',
 desc:'보여줄 데이터가 없을 때의 화면이에요. 왜 비었는지와 다음에 할 행동(CTA)을 함께 알려주세요. 검색 결과 없음, 첫 사용 상태 등.',
 dev:'EmptyState · illustration + CTA',

const MODE='PC';
const ALL_DESC='웹사이트(PC)에서 쓰는 UI·모션·레이아웃 명칭을 한 번에 모았어요. 왼쪽 메뉴에서 카테고리를 골라 좁혀 보세요.';
const STAGE=it=>`<div class="stage-inner ${it.full?'full':''}"></div>`;
function MOUNT(a,it){const st=a.querySelector('.stage-inner');const c=ctx(st);st.innerHTML=it.html;try{it.init&&it.init(st,c);}catch(e){console.error(it.en,e);}}
/* ===== rendering (shared PC/MO shell) ===== */
const $=s=>document.querySelector(s);
const nav=$('#nav'),grid=$('#grid'),q=$('#q');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let current=CATS[0].id;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('show'),1600);}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){}try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok;}catch(e){return false;}}
function makeCard(it,showCat){
  const a=document.createElement('article');a.className='card';const cat=CATS.find(c=>c.id===it.cat);
  a.innerHTML=`<div class="stage">${STAGE(it)}${it.hint?`<span class="hint">${it.hint}</span>`:''}<button class="replay" title="다시 재생" aria-label="다시 재생">↻</button></div>
  <div class="meta">${showCat?`<span class="cattag">${cat.ko}</span>`:''}<div class="names"><h3>${it.ko}</h3><span class="en">${it.en}</span></div>${it.alias?`<p class="alias">= ${it.alias}</p>`:''}<p class="desc">${it.desc}</p>
  <div class="foot">${it.dev?`<code class="dev" title="${esc(it.dev)}">${esc(it.dev)}</code>`:'<span style="flex:1"></span>'}<button class="copy">명칭 복사</button></div></div>`;
  const mount=()=>MOUNT(a,it);
  a.querySelector('.replay').onclick=mount;
  a.querySelector('.copy').onclick=async()=>{const t=`${it.ko} (${it.en})`;const ok=await copyText(t);toast(ok?`복사했어요 · ${t}`:t);};
  a._mount=mount;return a;
}
let io=null;
function renderCards(list,showCat){
  if(io)io.disconnect();grid.innerHTML='';
  if(!list.length){grid.innerHTML='<p class="empty-res">찾는 명칭이 없어요. 다른 단어(영문/한글)로 검색해 보세요.</p>';return;}
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target._done){e.target._done=true;e.target._mount();}}),{rootMargin:'400px 0px'});
  list.forEach(it=>{const c=makeCard(it,showCat);grid.appendChild(c);io.observe(c);});
}
function head(eb,t,d){$('#eyebrow').textContent=eb;$('#title').textContent=t;$('#desc').textContent=d;}
function setNav(id){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));const on=nav.querySelector('button.on');if(on&&getComputedStyle(nav).flexDirection==='row')nav.scrollTo({left:on.offsetLeft-12,behavior:'smooth'});}
function show(id){
  if(id==='all'){current='all';setNav('all');head(`${MODE} · 00 · All · ${ITEMS.length}개`,'전체 보기',ALL_DESC);renderCards(ITEMS,true);window.scrollTo(0,0);return;}
  const cat=CATS.find(c=>c.id===id)||CATS[0];current=cat.id;setNav(cat.id);
  const list=ITEMS.filter(x=>x.cat===cat.id);
  head(`${MODE} · ${String(CATS.indexOf(cat)+1).padStart(2,'0')} · ${cat.en} · ${list.length}개`,cat.ko,cat.desc);
  renderCards(list,false);window.scrollTo(0,0);
}
function search(v){
  const k=v.trim().toLowerCase();if(!k){show(current);return;}
  const list=ITEMS.filter(it=>[it.ko,it.en,it.alias||'',it.desc,it.dev||''].join(' ').toLowerCase().includes(k));
  setNav('__none');head(`${MODE} · Search · ${list.length}개`,`“${v.trim()}” 검색 결과`,'모든 카테고리에서 한글명 · 영문명 · 별칭 · 설명을 함께 찾았어요.');
  renderCards(list,true);
}
nav.innerHTML=`<button data-id="all"><span class="n">00</span><span class="k">전체<small>All</small></span><span class="c">${ITEMS.length}</span></button>`+CATS.map((c,i)=>`<button data-id="${c.id}"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="k">${c.ko}<small>${c.en}</small></span><span class="c">${ITEMS.filter(x=>x.cat===c.id).length}</span></button>`).join('');
const valid=id=>id==='all'||CATS.some(c=>c.id===id);
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;q.value='';if(location.hash==='#'+b.dataset.id)show(b.dataset.id);else location.hash=b.dataset.id;});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(valid(id)){q.value='';show(id);}});
let qt;q.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>search(q.value),180);});
const md=$('.mode');md.addEventListener('click',()=>{md.classList.add('go');setTimeout(()=>md.classList.remove('go'),900);});
const sid=location.hash.slice(1);show(valid(sid)?sid:CATS[0].id);
</script>
</body>
</html>
