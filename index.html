<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[SD] 사이트 용어정리 · PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#131313;--panel:#1b1b1b;--card:#1d1d1d;--ink:#ededed;--on-ink:#131313;--muted:#9a9a9a;--line:#2a2a2a;--soft:#242424;--accent:#8e93ff;--accent-d:#7a80f5;--accent-2:#ff8a65;--ios:#3d8bff;--mono:'JetBrains Mono',ui-monospace,monospace}
/* ================= shell v4 (simple · rounded) ================= */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

button{font-family:inherit}
.side{position:sticky;top:12px;height:calc(100vh - 24px);background:var(--panel);border-radius:28px;padding:22px 16px 16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.brand{font-size:17px;font-weight:800;letter-spacing:-.02em;padding:2px 8px 4px;color:#fff;white-space:nowrap}
.mode{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:99px;padding:4px}
.mode::before{content:'';position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:#ededed;transition:transform .35s cubic-bezier(.3,1.2,.5,1)}
.mode.mo::before{transform:translateX(100%)}
.mode.go.pc::before{transform:translateX(100%)}.mode.go.mo::before{transform:none}
.mode a{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:99px;text-decoration:none;font-size:12.5px;font-weight:700;color:#9a9a9a;transition:color .2s}
.mode a svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.mode a:hover{color:#fff}
.mode a.on{color:#131313;cursor:default}
.mode.go a.on{color:#9a9a9a}.mode.go a:not(.on){color:#131313}
.search input{width:100%;height:42px;border-radius:99px;border:0;background:var(--soft);color:#fff;padding:0 18px;font:inherit;font-size:13px;outline:none;transition:box-shadow .2s}
.search input::placeholder{color:#777}
.search input:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
#nav{display:flex;flex-direction:column;gap:4px;overflow:auto;margin:0 -4px;padding:0 4px;scrollbar-width:none;flex:1}
#nav::-webkit-scrollbar{display:none}
#nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;color:#b8b8b8;font-size:13.5px;font-weight:500;padding:10px 10px 10px 14px;border-radius:99px;cursor:pointer;text-align:left;transition:background .15s,color .15s;white-space:nowrap}
#nav button:hover{background:var(--soft);color:#fff}
#nav button .c{font-size:11px;font-weight:700;background:var(--soft);color:#9a9a9a;border-radius:99px;padding:3px 9px;min-width:30px;text-align:center}
#nav button.on{background:#ededed;color:#131313;font-weight:700}
#nav button.on .c{background:#131313;color:#fff}
.side-foot{margin:0;font-size:11px;line-height:1.6;color:#777;padding:0 8px}
main{min-width:0;padding:10px 6px 40px}
.top{padding:14px 10px 22px}
.top .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;color:#fff}
.top .cnt{font-size:12px;font-weight:700;background:var(--soft);color:#bdbdbd;border-radius:99px;padding:5px 12px}
.top .d{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.65;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border-radius:30px;padding:8px;display:flex;flex-direction:column;min-width:0}
.stage{position:relative;height:280px;border-radius:24px;overflow:hidden;isolation:isolate}
.stage .hint{position:absolute;left:12px;top:12px;z-index:50;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:99px;pointer-events:none;backdrop-filter:blur(6px)}
.stage .replay{position:absolute;right:12px;top:12px;z-index:50;width:34px;height:34px;border-radius:50%;border:0;font-size:15px;cursor:pointer;opacity:0;transform:scale(.9);transition:opacity .2s,transform .2s;display:grid;place-items:center}
.card:hover .replay,.replay:focus-visible{opacity:1;transform:none}
@media (hover:none){.stage .replay{opacity:1;transform:none}}
.meta{padding:14px 12px 8px;display:flex;flex-direction:column;gap:8px;flex:1}
.names{display:flex;align-items:center;justify-content:space-between;gap:10px}
.names h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names .en{flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600;color:#c9c9c9;background:var(--soft);border-radius:99px;padding:4px 10px}
.cattag{align-self:flex-start;font-size:10.5px;font-weight:700;color:var(--accent);background:rgba(142,147,255,.12);border-radius:99px;padding:3px 9px}
.desc{margin:0;font-size:13px;line-height:1.6;color:#a8a8a8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .desc{-webkit-line-clamp:unset}
.more{display:none;flex-direction:column;gap:6px}
.card.open .more{display:flex}
.more .box{background:var(--soft);border-radius:16px;padding:10px 12px;font-size:12px;line-height:1.55;color:#cfcfcf}
.more .box b{display:block;font-size:10.5px;color:#8a8a8a;font-weight:600;margin-bottom:2px}
.more .box code{font-family:var(--mono);font-size:11.5px;color:#d6d8ff;word-break:break-all}
.foot{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.btn{height:38px;border-radius:99px;border:0;padding:0 16px;font-size:12.5px;font-weight:700;cursor:pointer;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--soft);color:#e5e5e5}.btn.sec:hover{background:#2e2e2e}
.btn.pri{background:#ededed;color:#131313;margin-left:auto}.btn.pri:hover{background:#fff}
.empty-res{color:var(--muted);padding:40px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#ededed;color:#131313;font-size:13px;font-weight:600;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){
 body{grid-template-columns:1fr!important;padding:8px}
 .side{position:static;height:auto;padding:16px 12px 12px;border-radius:24px}
 #nav{flex-direction:row;overflow-x:auto;flex:none}
 #nav button{flex:none}
 .side-foot{display:none}
 .grid{grid-template-columns:1fr}
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;display:grid;grid-template-columns:264px 1fr;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ---------- Demo common ---------- */
.d-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.d-col{display:flex;flex-direction:column;gap:12px;align-items:center}
.d-btn{font:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:9px;border:1px solid transparent;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;line-height:1.2}
.d-btn.p{background:var(--accent);color:#fff}
.d-btn.p:hover{background:var(--accent-d);box-shadow:0 6px 16px -6px var(--accent)}
.d-btn.s{background:#e1e6ff;color:var(--accent)}
.d-btn.s:hover{background:#d3daff}
.d-btn.o{background:#fff;border-color:#cbc9c1;color:var(--ink)}
.d-btn.o:hover{border-color:var(--ink)}
.d-btn.t{background:none;color:var(--accent);padding:9px 6px}
.d-btn.t:hover{text-decoration:underline}
.d-btn:disabled{background:#dcdad4;color:#9a9890;cursor:not-allowed}
.d-btn:active:not(:disabled){transform:scale(.96)}
.d-cap{font-size:10.5px;font-family:var(--mono);color:var(--muted)}

/* switch */
.d-switch{position:relative;display:inline-block;width:52px;height:30px;cursor:pointer}
.d-switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.d-switch span{position:absolute;inset:0;background:#cfcdc6;border-radius:99px;transition:background .25s}
.d-switch span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.4,.6,1)}
.d-switch input:checked+span{background:var(--accent)}
.d-switch input:checked+span::after{transform:translateX(22px)}
.d-setrow{display:flex;align-items:center;justify-content:space-between;width:210px;background:#fff;padding:10px 12px;border-radius:12px;font-size:13px}

/* check radio */
.d-check,.d-radio{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin:7px 0;position:relative}
.d-check input,.d-radio input{position:absolute;opacity:0;pointer-events:none}
.d-check i,.d-radio i{width:20px;height:20px;border:2px solid #b9b7af;border-radius:6px;display:grid;place-items:center;transition:.2s;background:#fff;flex:none}
.d-radio i{border-radius:50%}
.d-check input:checked+i{background:var(--accent);border-color:var(--accent)}
.d-check i::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.d-check input:checked+i::after{transform:rotate(45deg) scale(1)}
.d-radio i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);transform:scale(0);transition:.2s cubic-bezier(.3,1.6,.5,1)}
.d-radio input:checked+i{border-color:var(--accent)}
.d-radio input:checked+i::after{transform:scale(1)}

/* segmented */
.d-seg{position:relative;display:inline-flex;background:#dedcd5;border-radius:11px;padding:3px}
.d-seg button{position:relative;z-index:1;width:66px;padding:8px 0;border:0;background:none;font:inherit;font-size:13px;color:#6a6970;cursor:pointer;transition:color .2s}
.d-seg button.on{color:var(--ink);font-weight:600}
.d-seg .pill{position:absolute;top:3px;bottom:3px;left:3px;width:66px;background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.12);transition:transform .35s cubic-bezier(.3,1.25,.5,1)}

/* tabs */
.d-tabs{width:250px;background:#fff;border-radius:12px;overflow:hidden}
.d-tablist{position:relative;display:flex;border-bottom:1px solid var(--line)}
.d-tablist button{flex:1;border:0;background:none;padding:11px 0;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.d-tablist button.on{color:var(--ink);font-weight:700}
.d-tablist .ind{position:absolute;bottom:-1px;height:2px;background:var(--ink);transition:left .3s cubic-bezier(.4,0,.2,1),width .3s}
.d-tabpanel{padding:18px 14px;font-size:12.5px;color:#4a4a52;min-height:64px}

/* accordion */
.d-acc{width:250px;background:#fff;border-radius:12px;overflow:hidden}
.d-acc .it+.it{border-top:1px solid var(--line)}
.d-acc button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;box-sizing:border-box;padding:12px 14px;font-size:13px;font-weight:600}
.d-acc b{font-weight:400;font-size:18px;transition:transform .3s;color:var(--muted)}
.d-acc .open b{transform:rotate(45deg)}
.d-acc .bd{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.4,0,.2,1)}
.d-acc .open .bd{grid-template-rows:1fr}
.d-acc .bd>div{overflow:hidden}
.d-acc .bd p{margin:0;padding:0 14px 12px;font-size:12px;color:var(--muted)}

/* overlay family */
.d-overlay{position:absolute;inset:0;background:rgba(20,20,25,.45);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.d-overlay.show{opacity:1;pointer-events:auto}
.d-modal{background:#fff;border-radius:14px;padding:18px;width:80%;max-width:250px;transform:scale(.9) translateY(10px);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.d-overlay.show .d-modal{transform:none}
.d-modal h4{margin:0 0 4px;font-size:15px}
.d-modal p{margin:0 0 14px;font-size:12px;color:var(--muted)}
.d-row.end{justify-content:flex-end}
.d-sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:8px 16px 16px;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.9,.3,1);z-index:6}
.d-sheet.show{transform:none}
.d-sheet .grab{width:36px;height:4px;border-radius:9px;background:#d4d2cb;margin:0 auto 10px}
.d-sheet .op{padding:9px 0;font-size:13px;border-bottom:1px solid #f0efea;cursor:pointer}
.d-sheet .op:last-child{border:0;color:var(--accent-2)}
.d-app{position:absolute;inset:0;background:#fff}
.d-appbar{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.d-burger{width:30px;height:30px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:6px}
.d-burger i{display:block;height:2px;background:var(--ink);border-radius:2px}
.d-appbody{padding:12px;display:flex;flex-direction:column;gap:7px}
.d-appbody i{display:block;height:9px;border-radius:5px;background:#eceae4}
.d-drawer{position:absolute;left:0;top:0;bottom:0;width:62%;background:#fff;z-index:6;padding:16px 14px;transform:translateX(-100%);transition:transform .38s cubic-bezier(.2,.9,.3,1);box-shadow:8px 0 24px -12px rgba(0,0,0,.3)}
.d-drawer.show{transform:none}
.d-drawer b{display:block;font-size:13px;margin-bottom:10px}
.d-drawer a{display:block;font-size:12.5px;padding:8px 0;color:#3a3a40;border-bottom:1px solid #f0efea}
.d-toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,140%);background:var(--ink);color:#fff;font-size:12.5px;padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;white-space:nowrap;transition:transform .4s cubic-bezier(.3,1.3,.5,1),opacity .3s;opacity:0}
.d-toast.show{transform:translate(-50%,0);opacity:1}
.d-toast u{color:#9fb0ff;text-decoration:none;font-weight:600}

/* tooltip */
.d-tip{position:relative;display:inline-block}
.d-tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translate(-50%,6px);background:var(--ink);color:#fff;font-size:11.5px;padding:6px 9px;border-radius:7px;white-space:nowrap;opacity:0;transition:.2s;pointer-events:none}
.d-tip::before{content:"";position:absolute;left:50%;bottom:calc(100% + 4px);transform:translate(-50%,6px);border:6px solid transparent;border-top-color:var(--ink);border-bottom:0;opacity:0;transition:.2s}
.d-tip:hover::after,.d-tip:hover::before{opacity:1;transform:translate(-50%,0)}

/* dropdown */
.d-dd{position:relative;align-self:flex-start;margin-top:22px}
.d-ddbtn{display:flex;gap:16px;justify-content:space-between;align-items:center;width:180px;padding:10px 12px;border:1px solid #cbc9c1;border-radius:10px;background:#fff;font:inherit;font-size:13px;cursor:pointer}
.d-ddbtn em{font-style:normal;transition:transform .25s;color:var(--muted)}
.d-dd.open .d-ddbtn{border-color:var(--ink)}
.d-dd.open .d-ddbtn em{transform:rotate(180deg)}
.d-dd ul{position:absolute;left:0;right:0;top:calc(100% + 6px);margin:0;padding:5px;list-style:none;background:#fff;border-radius:10px;box-shadow:0 12px 30px -10px rgba(0,0,0,.25);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top;pointer-events:none;transition:.2s}
.d-dd.open ul{opacity:1;transform:none;pointer-events:auto}
.d-dd li{padding:8px 9px;font-size:13px;border-radius:7px;cursor:pointer}
.d-dd li:hover{background:#f2f1ed}
.d-dd li.sel{color:var(--accent);font-weight:600}

/* badge chip */
.d-bell{position:relative;width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center}
.d-bell em{position:absolute;top:-5px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--accent-2);color:#fff;font-size:10.5px;font-style:normal;font-weight:700;display:grid;place-items:center;border:2px solid var(--stage)}
.d-badge{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:5px;background:var(--accent);color:#fff;letter-spacing:.03em}
.d-badge.g{background:#d9f5e6;color:#15803d}
.d-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 10px;border-radius:99px;background:#fff;border:1px solid #d6d4cd}
.d-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.d-chip x{cursor:pointer;color:var(--muted);font-size:13px;line-height:1}

/* breadcrumb / pagination */
.d-bc{display:flex;align-items:center;gap:8px;font-size:13px;background:#fff;padding:10px 14px;border-radius:10px}
.d-bc a{color:var(--muted);cursor:pointer}
.d-bc a:hover{color:var(--ink);text-decoration:underline}
.d-bc i{font-style:normal;color:#bdbbb3}
.d-pg{display:flex;gap:4px;align-items:center}
.d-pg button{min-width:30px;height:30px;border-radius:8px;border:0;background:none;font:inherit;font-size:13px;cursor:pointer;color:#4a4a52}
.d-pg button:hover{background:#e2e0da}
.d-pg button.on{background:var(--ink);color:#fff;font-weight:700}
.d-pg span{color:var(--muted);padding:0 2px}

/* carousel */
.d-car{position:relative;width:230px}
.d-car .vp{overflow:hidden;border-radius:12px}
.d-car .trk{display:flex;transition:transform .5s cubic-bezier(.6,0,.2,1)}
.d-car .sl{flex:0 0 100%;height:120px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px}
.d-car .arr{position:absolute;top:50%;margin-top:-26px;width:26px;height:26px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer;font-size:12px}
.d-car .prev{left:-10px}.d-car .next{right:-10px}
.d-car .dots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.d-car .dots i{width:6px;height:6px;border-radius:9px;background:#c9c7bf;cursor:pointer;transition:width .3s,background .3s}
.d-car .dots i.on{width:18px;background:var(--ink)}

/* stepper */
.d-step{position:relative;display:flex;justify-content:space-between;width:250px}
.d-step .line{position:absolute;left:14px;right:14px;top:13px;height:2px;background:#d6d4cd}
.d-step .fill{display:block;height:100%;background:var(--accent);width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}
.stp{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.stp i{font-style:normal;width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #d6d4cd;display:grid;place-items:center;font-size:12px;font-weight:700;transition:.3s}
.stp.cur i{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px rgba(61,90,254,.15)}
.stp.done i{background:var(--accent);border-color:var(--accent);color:#fff}
.stp.cur span{color:var(--ink);font-weight:700}

/* range */
.d-range{position:relative;width:220px;padding-top:34px}
.d-range .v{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;font-family:var(--mono)}
.d-range input{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--accent) var(--p),#d6d4cd var(--p));outline:none;margin:0}
.d-range input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:grab}
.d-range input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--accent);cursor:grab}
.d-range .lb{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:8px}

/* field */
.d-field{position:relative;display:block;width:230px}
.d-field input{width:100%;padding:20px 12px 8px;border:1.5px solid #cbc9c1;border-radius:10px;font:inherit;font-size:14px;outline:none;background:#fff;transition:border-color .2s}
.d-field span{position:absolute;left:13px;top:15px;font-size:14px;color:var(--muted);pointer-events:none;transition:.2s cubic-bezier(.4,0,.2,1);transform-origin:left}
.d-field input:focus{border-color:var(--accent)}
.d-field input:focus+span,.d-field input:not(:placeholder-shown)+span{top:7px;transform:scale(.75);color:var(--accent)}

/* hamburger */
.d-ham{width:56px;height:56px;border-radius:14px;border:0;background:#fff;cursor:pointer;position:relative}
.d-ham i{position:absolute;left:16px;right:16px;height:2.5px;background:var(--ink);border-radius:3px;transition:transform .35s cubic-bezier(.6,0,.2,1),opacity .2s,top .35s}
.d-ham i:nth-child(1){top:20px}.d-ham i:nth-child(2){top:27px}.d-ham i:nth-child(3){top:34px}
.d-ham.on i:nth-child(1){top:27px;transform:rotate(45deg)}
.d-ham.on i:nth-child(2){opacity:0;transform:scaleX(0)}
.d-ham.on i:nth-child(3){top:27px;transform:rotate(-45deg)}

/* fab */
.d-fabw{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column-reverse;align-items:center;gap:10px}
.d-fab{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 8px 18px -6px var(--accent);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.d-fabw.on .d-fab{transform:rotate(45deg)}
.d-mini{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;box-shadow:0 4px 10px -4px rgba(0,0,0,.3);opacity:0;transform:translateY(16px) scale(.6);transition:.3s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.d-fabw.on .d-mini{opacity:1;transform:none;pointer-events:auto}
.d-fabw.on .d-mini:nth-child(3){transition-delay:.05s}.d-fabw.on .d-mini:nth-child(4){transition-delay:.1s}

/* avatar */
.d-av{display:flex}
.d-av span{width:44px;height:44px;border-radius:50%;border:3px solid var(--stage);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;margin-left:-12px;transition:margin .3s cubic-bezier(.3,1.3,.5,1),transform .2s}
.d-av span:first-child{margin-left:0}
.d-av:hover span{margin-left:-2px}
.d-av span:hover{transform:translateY(-4px)}
.d-av .more{background:#d9d7d0;color:#4a4a52}

/* search */
.d-srch{display:flex;align-items:center;height:44px;width:44px;background:#fff;border-radius:99px;overflow:hidden;transition:width .45s cubic-bezier(.6,0,.2,1);box-shadow:0 2px 8px -4px rgba(0,0,0,.2)}
.d-srch.on{width:230px}
.d-srch button{flex:none;width:44px;height:44px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.d-srch input{border:0;outline:none;font:inherit;font-size:13px;width:100%;padding-right:14px;background:none}

/* ---------- Text ---------- */
.d-type{font-size:24px;font-weight:900;letter-spacing:-.03em}
.d-type .caret{display:inline-block;width:2px;height:1.05em;background:var(--accent);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.d-fu{text-align:center}
.d-fu>*{opacity:0;animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) forwards}
.d-fu h4{margin:0 0 6px;font-size:26px;font-weight:900;letter-spacing:-.03em}
.d-fu p{margin:2px 0;font-size:14px;color:#4a4a52}
.d-fu>*:nth-child(2){animation-delay:.15s}.d-fu>*:nth-child(3){animation-delay:.3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.ch{display:inline-block;white-space:pre}
.d-stg{font-size:28px;font-weight:900;letter-spacing:-.02em}
.d-stg .ch{opacity:0;animation:stg .5s cubic-bezier(.3,1.4,.5,1) forwards;animation-delay:calc(var(--i) * 45ms)}
@keyframes stg{from{opacity:0;transform:translateY(24px) rotate(8deg)}to{opacity:1;transform:none}}
.d-scr{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink);letter-spacing:.04em;background:#16161a;color:#7dffb0;padding:14px 18px;border-radius:10px;min-width:220px;text-align:center}
.d-mq{width:100%;overflow:hidden;background:var(--ink);color:#fff;padding:14px 0;transform:rotate(-3deg);margin:0 -20px}
.d-mq .trk{display:flex;width:max-content;animation:mq 9s linear infinite}
.d-mq:hover .trk{animation-play-state:paused}
.d-mq span{font-size:20px;font-weight:900;letter-spacing:.02em;padding-right:24px;white-space:nowrap}
.d-mq span b{color:var(--accent-2)}
@keyframes mq{to{transform:translateX(-50%)}}
.d-count{text-align:center}
.d-count .num{font-size:44px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.d-count .num::after{content:"+";color:var(--accent)}
.d-count p{margin:0;font-size:12.5px;color:var(--muted)}
.d-shim{font-size:34px;font-weight:900;letter-spacing:-.03em;background:linear-gradient(100deg,#16161a 35%,#9fb0ff 50%,#16161a 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.4s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-20% 0}}
.d-mask{font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.d-mask .ln{display:block;overflow:hidden}
.d-mask .ln>span{display:block;transform:translateY(110%);animation:maskUp .9s cubic-bezier(.7,0,.2,1) forwards}
.d-mask .ln:nth-child(2)>span{animation-delay:.12s}.d-mask .ln:nth-child(3)>span{animation-delay:.24s}
@keyframes maskUp{to{transform:none}}
.d-rot{font-size:22px;font-weight:900;letter-spacing:-.03em;text-align:center;line-height:1.4}
.d-rot .rw{display:inline-block;color:var(--accent);min-width:3.2em}
.d-hl{font-size:19px;line-height:1.7;font-weight:700;letter-spacing:-.02em;text-align:center;margin:0}
.d-hl mark{background:linear-gradient(transparent 58%,#ffe066 58%) no-repeat;background-size:0% 100%;color:inherit;animation:hl .8s cubic-bezier(.6,0,.3,1) forwards .3s}
.d-hl mark+mark,.d-hl mark.m2{animation-delay:1.1s}
@keyframes hl{to{background-size:100% 100%}}
.d-blur{font-size:24px;font-weight:900;letter-spacing:-.03em;text-align:center;line-height:1.35}
.d-blur .ch{opacity:0;filter:blur(12px);animation:blurIn .9s ease-out forwards;animation-delay:calc(var(--i) * 110ms)}
@keyframes blurIn{to{opacity:1;filter:blur(0)}}
.d-wave{font-size:30px;font-weight:900;color:var(--accent)}
.d-wave .ch{animation:wave 1.3s ease-in-out infinite;animation-delay:calc(var(--i) * 80ms)}
@keyframes wave{0%,60%,100%{transform:none}30%{transform:translateY(-14px)}}
.d-glitch{position:relative;font-size:40px;font-weight:900;letter-spacing:.02em;color:#fff;background:#16161a;padding:10px 20px;border-radius:8px}
.d-glitch span{position:relative;display:inline-block}
.d-glitch span::before,.d-glitch span::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%}
.d-glitch span::before{color:#ff3d7f;animation:g1 2s infinite steps(1);mix-blend-mode:screen}
.d-glitch span::after{color:#2de2ff;animation:g2 2s infinite steps(1);mix-blend-mode:screen}
@keyframes g1{0%,100%{clip-path:inset(0 0 100% 0);transform:none}10%{clip-path:inset(10% 0 60% 0);transform:translate(-4px,0)}14%{clip-path:inset(60% 0 10% 0);transform:translate(4px,0)}18%{clip-path:inset(0 0 100% 0)}62%{clip-path:inset(40% 0 35% 0);transform:translate(-5px,0)}66%{clip-path:inset(0 0 100% 0)}}
@keyframes g2{0%,100%{clip-path:inset(0 0 100% 0);transform:none}11%{clip-path:inset(70% 0 5% 0);transform:translate(4px,0)}15%{clip-path:inset(15% 0 55% 0);transform:translate(-4px,0)}19%{clip-path:inset(0 0 100% 0)}63%{clip-path:inset(5% 0 70% 0);transform:translate(5px,0)}67%{clip-path:inset(0 0 100% 0)}}
.d-fill{position:relative;font-size:42px;font-weight:900;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.5px var(--ink);cursor:pointer}
.d-fill::after{content:attr(data-t);position:absolute;left:0;top:0;color:var(--accent);-webkit-text-stroke:1.5px var(--accent);clip-path:inset(0 100% 0 0);transition:clip-path .6s cubic-bezier(.7,0,.2,1)}
.d-fill:hover::after{clip-path:inset(0 0 0 0)}

/* ---------- Interaction ---------- */
.d-lift{width:180px;background:#fff;border-radius:14px;padding:12px;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;box-shadow:0 2px 6px -2px rgba(0,0,0,.12);cursor:pointer}
.d-lift:hover{transform:translateY(-8px);box-shadow:0 20px 30px -14px rgba(20,20,40,.35)}
.d-lift .th{height:80px;border-radius:9px;background:linear-gradient(135deg,#ffb199,#ff5a36)}
.d-lift b{display:block;font-size:13px;margin-top:9px}
.d-lift small{font-size:11px;color:var(--muted)}
.d-ripple{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .65s ease-out forwards;pointer-events:none}
.d-btn.o .rp,.d-rcard .rp{background:rgba(61,90,254,.22)}
@keyframes rp{to{transform:scale(1);opacity:0}}
.d-rcard{width:200px;height:56px;border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 16px;font-size:13px;cursor:pointer;user-select:none}
.d-mag{width:112px;height:112px;border-radius:50%;background:var(--ink);color:#fff;border:0;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.d-mag span{display:inline-block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.d-ul{display:flex;flex-direction:column;gap:18px;align-items:center}
.d-ul a{position:relative;font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
.d-ul a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .35s cubic-bezier(.6,0,.2,1)}
.d-ul a.l::after{transform-origin:right}.d-ul a.l:hover::after{transform-origin:left}
.d-ul a:hover::after{transform:scaleX(1)}
.d-ul a.c::after{transform-origin:center}
.d-tilt{position:relative;width:170px;height:200px;border-radius:16px;background:linear-gradient(145deg,#3d5afe,#9b5cff 60%,#ff5a9e);color:#fff;padding:16px;transition:transform .2s ease-out;transform-style:preserve-3d;box-shadow:0 18px 30px -16px rgba(60,40,160,.6);overflow:hidden}
.d-tilt b{font-size:22px;font-weight:900;display:block;margin-top:96px}
.d-tilt small{font-size:11px;opacity:.8}
.d-tilt .gl{position:absolute;inset:0;pointer-events:none}
.d-likew{display:flex;align-items:center;gap:10px;background:#fff;padding:10px 16px 10px 12px;border-radius:99px}
.d-like{position:relative;width:40px;height:40px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.d-like svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:2;transition:fill .2s,stroke .2s}
.d-like.on svg{fill:var(--accent-2);stroke:var(--accent-2)}
.d-like .pt{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;pointer-events:none}
.d-likew .cnt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;min-width:28px}
.d-shake{width:230px;display:flex;flex-direction:column;gap:8px}
.d-shake .r{display:flex;gap:6px}
.d-shake input{flex:1;min-width:0;border:1.5px solid #cbc9c1;border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;outline:none;background:#fff}
.d-shake.bad input{border-color:#e5484d;background:#fff5f5}
.d-shake .err{font-size:11.5px;color:#e5484d;min-height:16px}
.d-pulse{display:flex;gap:34px;align-items:center}
.d-live{display:flex;align-items:center;gap:8px;background:#fff;padding:8px 14px;border-radius:99px;font-size:12px;font-weight:800;letter-spacing:.06em}
.d-dot{position:relative;width:10px;height:10px;border-radius:50%;background:#e5484d}
.d-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 1.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.8);opacity:0}}
.d-pbtn{position:relative;width:54px;height:54px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:22px}
.d-pbtn::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite;z-index:-1}
.d-spot{position:relative;width:220px;height:150px;border-radius:16px;background:#121216;border:1px solid #2a2a31;color:#fff;padding:16px;overflow:hidden;--x:50%;--y:50%}
.d-spot::before{content:"";position:absolute;inset:0;background:radial-gradient(180px circle at var(--x) var(--y),rgba(120,140,255,.35),transparent 60%);opacity:0;transition:opacity .3s}
.d-spot:hover::before{opacity:1}
.d-spot b{position:relative;font-size:18px}
.d-spot p{position:relative;font-size:12px;color:#9a9aa3;margin:6px 0 0}
.d-flip{width:160px;height:190px;perspective:800px;cursor:pointer}
.d-flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.d-flip:hover .in{transform:rotateY(180deg)}
.d-flip .f,.d-flip .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.d-flip .f{background:linear-gradient(160deg,#ffd166,#ff8a3d);color:#16161a}
.d-flip .b{background:var(--ink);color:#fff;transform:rotateY(180deg);justify-content:center;font-size:12px;line-height:1.6}
.d-flip b{font-size:18px}
.d-cur{position:absolute;inset:0;cursor:none;display:flex;align-items:center;justify-content:center;gap:16px}
.d-cur .lk{font-size:16px;font-weight:800;padding:10px;border-bottom:2px solid var(--ink)}
.d-cur .cur,.d-cur .ring{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none}
.d-cur .cur{width:8px;height:8px;margin:-4px 0 0 -4px;background:var(--accent-2)}
.d-cur .ring{width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--ink);transition:width .25s,height .25s,margin .25s,background .25s}
.d-cur.big .ring{width:64px;height:64px;margin:-32px 0 0 -32px;background:rgba(255,90,54,.15);border-color:var(--accent-2)}
.d-press{width:150px;height:56px;border-radius:16px;border:0;background:var(--ink);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.8,.5,1);user-select:none}
.d-press:active{transform:scale(.92);transition-duration:.1s}

/* ---------- Page transition ---------- */
.d-phone{position:relative;width:150px;height:200px;border-radius:20px;border:3px solid #1d1d22;background:#fff;overflow:hidden;box-shadow:0 12px 30px -14px rgba(0,0,0,.45);perspective:700px}
.pg{position:absolute;inset:0;padding:10px;display:flex;flex-direction:column;gap:7px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff}
.pg.b{background:#1d1d22;color:#fff}
.pg-top{font-size:11px;font-weight:800;padding-bottom:2px}
.pg-hero{height:56px;border-radius:8px;background:linear-gradient(135deg,#9fb0ff,#3d5afe);flex:none}
.pg.b .pg-hero{background:linear-gradient(135deg,#ffb199,#ff5a36);height:78px}
.pg i{display:block;height:7px;border-radius:4px;background:#e6e4de;flex:none}
.pg.b i{background:#3a3a42}
.pg-go{position:absolute;right:8px;bottom:8px;font:inherit;font-size:10.5px;font-weight:700;border:0;border-radius:99px;padding:6px 10px;background:var(--accent);color:#fff;cursor:pointer}
.pg.b .pg-go{background:#fff;color:#1d1d22}
.curtain{position:absolute;inset:0;background:var(--accent-2);z-index:5}
.se-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.se-card{height:64px;border-radius:10px;cursor:pointer}
.se-detail{position:absolute;inset:0;z-index:5}
.se-hero{position:absolute}
.se-body{position:absolute;left:0;right:0;top:50%;bottom:0;padding:10px;display:flex;flex-direction:column;gap:7px}
.se-body b{font-size:11px}
.se-body i{display:block;height:7px;border-radius:4px;background:#e6e4de}

/* ---------- Scroll ---------- */
.sc{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;background:#fff;scrollbar-width:thin}
.sc-blk{margin:10px 14px;padding:12px;border-radius:10px;background:#f2f1ec;font-size:12px;color:var(--muted)}
.sc-blk i{display:block;height:7px;border-radius:4px;background:#e0ded7;margin-top:7px}
.sc-hint{position:absolute;right:10px;bottom:10px;z-index:20;font-size:10.5px;background:var(--ink);color:#fff;padding:4px 9px;border-radius:99px;pointer-events:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.rv{opacity:0;transform:translateY(28px);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv:nth-child(even){transition-delay:.05s}
.px{position:relative;height:250px;overflow:hidden;background:linear-gradient(#bcd2ff,#fff1e0)}
.px [data-sp]{position:absolute;left:0;right:0;will-change:transform}
.px .sun{position:absolute;left:60%;top:30px;width:54px;height:54px;border-radius:50%;background:#ffb547;box-shadow:0 0 40px #ffcf7a}
.px .sky{top:0;height:100%}
.px svg{bottom:-2px;width:100%;height:120px}
.px svg.h2{height:90px}
.px h4{top:70px;margin:0;text-align:center;font-size:30px;font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 2px 14px rgba(40,40,90,.35)}
.sh{position:sticky;top:0;z-index:2;height:58px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:900;font-size:16px;transition:height .3s,box-shadow .3s,font-size .3s}
.sh.small{height:40px;font-size:13px;box-shadow:0 4px 14px -8px rgba(0,0,0,.3)}
.sh span{display:flex;gap:4px}.sh span i{width:16px;height:4px;border-radius:2px;background:#d6d4cd}
.sh.hide{transform:translateY(-100%)}
.sh.smart{transition:transform .3s cubic-bezier(.4,0,.2,1)}
.pbar{position:absolute;left:0;right:0;top:0;height:4px;background:#ecebe6;z-index:10}
.pbar i{display:block;height:100%;width:0;background:var(--accent)}
.art{padding:22px 16px}
.art h4{margin:0 0 10px;font-size:16px}
.art i{display:block;height:7px;border-radius:4px;background:#ebe9e3;margin:9px 0}
.snap{scroll-snap-type:y mandatory}
.snap section{height:100%;scroll-snap-align:start;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:900}
.hsc{display:flex;gap:10px;overflow-x:auto;padding:0 18px;scroll-snap-type:x mandatory;scroll-padding:18px;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);scrollbar-width:thin;padding-bottom:6px}
.hsc>div{flex:0 0 130px;height:150px;border-radius:14px;scroll-snap-align:start;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:800;font-size:13px}
.irow{display:flex;align-items:center;gap:10px;margin:8px 14px;padding:10px;border-radius:10px;background:#f4f3ef;font-size:12px}
.irow i{width:28px;height:28px;border-radius:8px;background:#dcdff8;flex:none}
.ild{display:flex;justify-content:center;padding:10px 0 16px;opacity:0;transition:opacity .2s}
.ild.on{opacity:1}
.btt{position:absolute;right:14px;bottom:14px;z-index:10;width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:16px;cursor:pointer;opacity:0;transform:translateY(14px) scale(.8);transition:.3s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.btt.show{opacity:1;transform:none;pointer-events:auto}

/* ---------- Loading ---------- */
.d-skel{position:relative;width:240px;height:110px;background:#fff;border-radius:14px;padding:14px}
.d-skel .ly{position:absolute;inset:14px;display:flex;gap:12px;transition:opacity .4s}
.d-skel .real{opacity:0}
.d-skel.loaded .sk{opacity:0}.d-skel.loaded .real{opacity:1}
.d-skel .av{width:44px;height:44px;border-radius:50%;flex:none}
.d-skel .tx{flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.d-skel .tx i{display:block;height:10px;border-radius:5px}
.sk .av,.sk i{background:linear-gradient(90deg,#ecebe6 25%,#f7f6f2 50%,#ecebe6 75%);background-size:300% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}
.real .av{background:linear-gradient(135deg,#9fb0ff,#3d5afe)}

.d-empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}

/* ---------- Easing ---------- */

<script>
/* ===== helpers ===== */
function ctx(st){
  const gen = st._gen = (st._gen||0)+1;
  const alive = () => st._gen===gen && st.isConnected;
  return {
    alive,
    after(fn,ms){ setTimeout(()=>{ if(alive()) fn(); }, ms); },
    every(fn,ms){ const id=setInterval(()=>{ if(!alive()) return clearInterval(id); fn(); }, ms); },
    raf(fn){ const loop=t=>{ if(!alive()) return; if(fn(t)!==false) requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  };
}
function split(el, by){
  const t = el.textContent; el.textContent='';
  const parts = by==='w' ? t.split(' ') : [...t];
  parts.forEach((p,i)=>{
    const s=document.createElement('span'); s.className='ch'; s.style.setProperty('--i',i);
    s.textContent = p; el.appendChild(s);
    if(by==='w' && i<parts.length-1) el.appendChild(document.createTextNode(' '));
  });
}
const filler = (n,label='콘텐츠') => Array.from({length:n},(_,i)=>`<div class="sc-blk">${label} ${i+1}<i></i><i style="width:70%"></i></div>`).join('');
const SC_HINT = '<span class="sc-hint">↓ 스크롤</span>';

/* ===== categories ===== */
const CATS = [
  {id:'ui', ko:'UI 컴포넌트', en:'Components', desc:'웹 화면을 구성하는 기본 부품들이에요. 기획서와 디자인 시안에서 가장 자주 쓰는 명칭이니, 상태(hover·active·disabled)와 함께 이름으로 전달하면 정확해요.'},
  {id:'text', ko:'텍스트 애니메이션', en:'Text Animation', desc:'글자가 등장하고 움직이는 방식이에요. "글자가 멋지게 나오게"보다 "마스크 리빌, 스태거 40ms"처럼 이름과 수치로 요청해 보세요.'},
  {id:'interaction', ko:'마이크로 인터랙션', en:'Micro Interaction', desc:'마우스·터치에 반응하는 작은 피드백이에요. 대부분 호버(hover)나 클릭으로 확인할 수 있어요.'},
  {id:'page', ko:'페이지 전환', en:'Page Transition', desc:'웹 페이지와 페이지 사이를 넘어가는 방식이에요. 라우트 전환(Route Transition)이라고도 불러요. 브라우저 창 안에서 자동 재생된 뒤, 버튼을 눌러 반복해 볼 수 있어요. 모바일 앱 전환은 MO 버전에서 볼 수 있어요.'},
  {id:'scroll', ko:'스크롤 인터랙션', en:'Scroll Interaction', desc:'스크롤 위치에 따라 일어나는 변화예요. 회색 영역 안을 직접 스크롤해 보세요.'},
  {id:'loading', ko:'로딩 · 상태', en:'Loading & State', desc:'기다림과 결과를 사용자에게 알려주는 표현이에요. 로딩 → 성공/실패 → 빈 화면까지 상태별로 디자인을 전달하세요.'},
  {id:'easing', ko:'이징 · 속도 곡선', en:'Easing', desc:'움직임의 가속·감속 곡선이에요. "부드럽게" 대신 정확한 이징 이름이나 cubic-bezier 값으로 요청하면 의도대로 구현돼요. 파란 점이 해당 이징, 회색 점은 비교용 linear예요.'},
  {id:'layout', ko:'레이아웃 · 영역', en:'Layout', desc:'화면의 뼈대와 영역의 이름이에요. 수정 요청할 때 "위쪽 그거" 대신 정확한 영역 명칭을 써 보세요.'},
];

/* ===== page transition engine ===== */
const BBAR='<div class="bbar"><i></i><i></i><i></i><span>myservice.com</span></div>';
const NAVL='<div class="pc-nav"><b>LOGO</b><span></span><span></span><span></span></div>';
const PHONE = `<div class="d-browser">${BBAR}<div class="d-phone pcvp">
  <div class="pg a">${NAVL}<div class="pg-hero"></div><div class="pc-cards"><i></i><i></i><i></i></div><button class="pg-go">자세히 →</button></div>
  <div class="pg b">${NAVL}<div class="pc-det"><div class="pg-hero"></div><div class="tx"><i></i><i style="width:70%"></i><i style="width:85%"></i><i style="width:50%"></i></div></div><button class="pg-go">← 목록</button></div>
</div></div>`;
const EZ = 'cubic-bezier(.65,0,.35,1)';
const PT = {
  fade:{out:[{opacity:1},{opacity:0}], in:[{opacity:0},{opacity:1}], d:500, e:'ease'},
  slide:{out:[{transform:'translateX(0)'},{transform:'translateX(-100%)'}], in:[{transform:'translateX(100%)'},{transform:'translateX(0)'}]},
  cover:{out:[{transform:'translateX(0)',filter:'brightness(1)'},{transform:'translateX(-30%)',filter:'brightness(.55)'}], in:[{transform:'translateX(100%)',boxShadow:'-10px 0 20px rgba(0,0,0,.2)'},{transform:'translateX(0)',boxShadow:'-10px 0 20px rgba(0,0,0,0)'}], e:'cubic-bezier(.2,.8,.2,1)', d:600},
  zoom:{out:[{transform:'scale(1)',opacity:1},{transform:'scale(1.18)',opacity:0}], in:[{transform:'scale(.82)',opacity:0},{transform:'scale(1)',opacity:1}], e:'cubic-bezier(.2,.8,.2,1)', d:550},
  flip:{out:[{transform:'rotateY(0deg)'},{transform:'rotateY(-90deg)'}], in:[{transform:'rotateY(90deg)'},{transform:'rotateY(0deg)'}], outOpt:{duration:300,easing:'ease-in'}, inOpt:{duration:320,delay:300,easing:'ease-out'}},
  wipe:{out:[{opacity:1},{opacity:1}], in:[{clipPath:'inset(0 0 0 100%)'},{clipPath:'inset(0 0 0 0)'}], d:650, e:'cubic-bezier(.7,0,.2,1)'},
  circle:{out:[{opacity:1},{opacity:1}], in:[{clipPath:'circle(0% at 82% 90%)'},{clipPath:'circle(150% at 82% 90%)'}], d:700, e:'cubic-bezier(.6,0,.4,1)'},
  blur:{out:[{filter:'blur(0px)',opacity:1},{filter:'blur(10px)',opacity:0}], in:[{filter:'blur(10px)',opacity:0},{filter:'blur(0px)',opacity:1}], d:600, e:'ease'},
  sheet:{out:[{transform:'scale(1)',borderRadius:'0px',filter:'brightness(1)'},{transform:'scale(.9)',borderRadius:'12px',filter:'brightness(.6)'}], in:[{transform:'translateY(100%)'},{transform:'translateY(0)'}], e:'cubic-bezier(.2,.9,.3,1)', d:600},
  curtain:{custom(ph,from,to){
    const k=document.createElement('div'); k.className='curtain'; ph.appendChild(k);
    const o={duration:360,easing:'cubic-bezier(.7,0,.3,1)',fill:'forwards'};
    return k.animate([{transform:'translateX(-100%)'},{transform:'translateX(0)'}],o).finished
      .then(()=>{ from.style.visibility='hidden'; to.style.visibility='visible'; return k.animate([{transform:'translateX(0)'},{transform:'translateX(100%)'}],o).finished; })
      .then(()=>k.remove());
  }},
};
function pageInit(type){
  return (st,c)=>{
    const ph=st.querySelector('.d-phone'), pages=[...ph.querySelectorAll('.pg')];
    let cur=0, busy=false; pages[1].style.visibility='hidden';
    const go=()=>{
      if(busy) return; busy=true;
      const from=pages[cur], to=pages[1-cur], T=PT[type];
      const done=()=>{ cur=1-cur; busy=false; };
      if(T.custom){ T.custom(ph,from,to).then(done); return; }
      to.style.visibility='visible'; from.style.zIndex=1; to.style.zIndex=2;
      const o={duration:T.d||560, easing:T.e||EZ, fill:'both'};
      const a1=from.animate(T.out,{...o,...(T.outOpt||{})}), a2=to.animate(T.in,{...o,...(T.inOpt||{})});
      Promise.all([a1.finished,a2.finished]).then(()=>{ from.style.visibility='hidden'; a1.cancel(); a2.cancel(); done(); }).catch(()=>{busy=false});
    };
    ph.querySelectorAll('.pg-go').forEach(b=>b.addEventListener('click',go));
    c.after(go,700);
  };
}

/* ===== easing helpers ===== */
const SUP_LINEAR = (window.CSS && CSS.supports && CSS.supports('animation-timing-function','linear(0, 1)'));
const fnPath = f => 'M'+Array.from({length:81},(_,i)=>{const t=i/80;return (t*100).toFixed(1)+' '+(100-f(t)*100).toFixed(1)}).join(' L');
const fnLinear = (f,n=60) => 'linear('+Array.from({length:n+1},(_,i)=>f(i/n).toFixed(4)).join(', ')+')';
const bounce = t => { const n=7.5625,d=2.75; if(t<1/d) return n*t*t; if(t<2/d) return n*(t-=1.5/d)*t+.75; if(t<2.5/d) return n*(t-=2.25/d)*t+.9375; return n*(t-=2.625/d)*t+.984375; };
const spring = t => 1-Math.exp(-6*t)*Math.cos(14*t);
function easeItem({ko,en,alias,desc,css,bez,fn,label,devOverride}){
  let path, timing=css;
  if(bez){ const [a,b,c2,d]=bez; path=`M0 100 C${a*100} ${100-b*100} ${c2*100} ${100-d*100} 100 0`; }
  else { path=fnPath(fn); if(!css){ timing = SUP_LINEAR ? fnLinear(fn) : 'ease-out'; } }
  return {cat:'easing', ko, en, alias, desc, hint:'자동 재생',
    dev: devOverride || ('transition-timing-function: '+(css || (bez?`cubic-bezier(${bez.join(', ')})`:'linear(…)'))),
    html:`<div class="d-ease"><svg viewBox="-6 -32 112 166"><rect class="box" x="0" y="0" width="100" height="100" rx="3"/><text class="ax" x="0" y="112">시간 →</text><text class="ax" x="-4" y="-6">진행</text><path class="p" d="${path}"/></svg>
      <div class="lanes"><div class="lane"><i class="dot"></i><span>${label||en}</span></div><div class="lane ref"><i class="dot"></i><span>linear</span></div></div></div>`,
    init(st){
      requestAnimationFrame(()=>st.querySelectorAll('.lane').forEach((l,k)=>{
        const d=l.querySelector('.dot'), w=l.clientWidth-d.offsetWidth;
        const kf=[{transform:'translateX(0)',offset:0,easing:k?'linear':timing},{transform:`translateX(${w}px)`,offset:.68},{transform:`translateX(${w}px)`,offset:1}];
        try{ d.animate(kf,{duration:2100,iterations:Infinity}); }catch(e){ kf[0].easing='ease-out'; d.animate(kf,{duration:2100,iterations:Infinity}); }
      }));
    }};
}
