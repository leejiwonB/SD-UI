 html:`<div class="app">${bar('갤러리','','search')}<div class="m-body" style="padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start">${GR.map(g=>`<div class="mc" style="background:${g};height:110px;border-radius:12px;cursor:pointer"></div>`).join('')}</div></div>`,
 init:morph({src:'.mc',ratio:.45,auto:1,body:'<b style="font-size:15px">상세 화면</b><span class="m-ln"></span><span class="m-ln" style="width:80%"></span><span class="m-ln" style="width:55%"></span>'})},
{cat:'trans',ko:'앱 실행 줌',en:'App Launch Zoom',alias:'아이콘 확장, 런치 애니메이션',
 desc:'홈 화면의 앱 아이콘 위치에서 화면이 확대되며 앱이 열려요. 닫으면 다시 아이콘 자리로 줄어들어요.',
 dev:'zoom transition · launch animation',hint:'자동 재생 · 아이콘 클릭',
 html:`<div class="homegrid">${Array.from({length:12},(_,i)=>`<div class="ai"><i class="ap" style="background:${GR[i%6]}"></i>앱 ${i+1}</div>`).join('')}</div>`,
 init:morph({src:'.ap',ratio:1,auto:5,r0:'11px',body:'<b style="font-size:20px;margin-top:30px">앱 화면</b><span class="m-ln" style="background:rgba(255,255,255,.5)"></span><span class="m-ln" style="width:70%;background:rgba(255,255,255,.5)"></span>'})},
{cat:'trans',ko:'시트 확장',en:'Expandable Sheet',alias:'하프 시트 → 풀 시트, 지도 시트',
 desc:'화면 일부를 덮던 바텀 시트가 위로 펼쳐지며 전체 화면이 돼요. 지도 앱의 장소 목록에서 자주 써요.',
 dev:'detents([.medium, .large])',hint:'자동 재생 · 시트 상단 클릭',
 html:`<div class="xs-map"></div><div class="mapsrch">${I('search',14)}주변 맛집</div><div class="xs"><div class="xhd"><div class="grab"></div><b>주변 맛집 12곳</b></div><div class="m-body">${rows(8,{t:'맛집',s:'한식 · 350m'})}</div></div>`,
 init(st,c){const x=st.querySelector('.xs');x.querySelector('.xhd').onclick=()=>x.classList.toggle('full');c.after(()=>x.classList.add('full'),800);c.after(()=>x.classList.remove('full'),2400);}},
{cat:'trans',ko:'탭 전환',en:'Tab Switch',alias:'탭 크로스페이드, 즉시 전환',
 desc:'하단 탭을 바꿀 때는 화면이 미끄러지지 않고 빠르게 교체(크로스페이드)돼요. 탭은 같은 위계라서 방향감이 없어야 해요.',
 dev:'TabView · no slide animation',hint:'탭 클릭',
 html:`<div class="app"><div class="tcf">${['홈','검색','찜','MY'].map((t,i)=>`<section class="${i?'':'on'}"><b>${t}</b>${cards(3,i)}</section>`).join('')}</div>${tabbar(0)}</div>`,
 init(st,c){const bs=[...st.querySelectorAll('.m-tabbar button')],ss=[...st.querySelectorAll('.tcf section')];const go=i=>{bs.forEach((b,j)=>b.classList.toggle('on',j===i));ss.forEach((s,j)=>s.classList.toggle('on',j===i));};bs.forEach((b,i)=>b.onclick=()=>go(i));c.after(()=>go(1),900);c.after(()=>go(2),1700);c.after(()=>go(0),2500);}},
{cat:'trans',ko:'서클 리빌',en:'Circular Reveal',alias:'원형 확장, FAB 전환',
 desc:'누른 버튼(FAB) 위치에서 원이 퍼지며 새 화면이 드러나요. 누른 곳과 결과 화면을 자연스럽게 이어줘요.',
 dev:'ViewAnimationUtils.createCircularReveal',hint:'자동 재생 · + / ← 클릭',
 html:MP(`${bar('노트','menu','search')}<div class="m-body">${rows(7,{t:'노트'})}</div><button class="fabgo" data-go>${I('plus',22)}</button>`,`${bar('새 노트','back','')}<div class="m-body" style="padding:14px"><b style="font-size:16px">제목</b><div style="display:flex;flex-direction:column;gap:7px;margin-top:10px"><span class="m-ln"></span><span class="m-ln" style="width:70%"></span></div></div>`),
 init:mtrans('circle')},

/* ---------- SCROLL ---------- */
{cat:'scroll',ko:'접히는 헤더',en:'Collapsing Toolbar',alias:'축소 헤더, 컬랩싱 앱 바, 확장형 헤더',
 desc:'큰 이미지 헤더가 스크롤하면 작은 상단 바로 접혀요. 제목도 크기와 위치가 함께 바뀌어요.',
 dev:'CollapsingToolbarLayout · LargeTopAppBar',hint:'스크롤',
 html:`<div class="app" style="padding-top:0"><div class="ct-h"><div class="img"></div><span class="bk">${I('back')}</span><b class="tt">제주 여행</b></div><div class="m-body" style="padding-top:170px">${rows(10,{t:'일정',s:'Day 1 · 09:00'})}</div></div>`,
 init(st){const b=st.querySelector('.m-body'),h=st.querySelector('.ct-h'),img=h.querySelector('.img'),t=h.querySelector('.tt');b.addEventListener('scroll',()=>{const y=b.scrollTop,H=Math.max(70,170-y),p=(170-H)/100;h.style.height=H+'px';img.style.opacity=1-p;t.style.transform=`translate(${p*28}px,${-p*1}px) scale(${1-.38*p})`;h.classList.toggle('solid',p>.75);},{passive:true});}},
{cat:'scroll',ko:'스트레치 헤더',en:'Stretchy Header',alias:'늘어나는 헤더, 오버스크롤 확대',
 desc:'맨 위에서 더 아래로 끌면 헤더 이미지가 늘어나며 확대되고, 놓으면 원래대로 돌아와요.',
 dev:'overscroll · scaleEffect',hint:'이미지를 아래로 드래그',
 html:`<div class="app" style="padding-top:0"><div class="m-body sh-body"><div class="sh-img">PROFILE</div><div class="sh-info"><b>김디자인</b><small>Product Designer · 서울</small></div>${rows(6,{t:'포트폴리오'})}</div></div>`,
 init(st){const b=st.querySelector('.sh-body'),im=st.querySelector('.sh-img');let y0=null,dy=0;b.addEventListener('pointerdown',e=>{if(b.scrollTop>0)return;y0=e.clientY;im.classList.add('drag');});b.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);if(dy>4){try{b.setPointerCapture(e.pointerId);}catch(_){}}im.style.height=(170+dy*.6)+'px';});const end=()=>{if(y0===null)return;y0=null;im.classList.remove('drag');im.style.height='';dy=0;};b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);}},
{cat:'scroll',ko:'스티키 탭 (스크롤 스파이)',en:'Sticky Tabs · Scrollspy',alias:'앵커 탭, 섹션 탭, 고정 탭',
 desc:'스크롤하면 탭이 상단에 붙고, 지금 보고 있는 섹션의 탭이 자동으로 선택돼요(Scrollspy). 탭을 누르면 해당 섹션으로 이동해요.',
 dev:'position: sticky · ScrollViewReader',hint:'스크롤 · 탭 클릭',
 html:`<div class="app">${bar('상품 상세','back','share')}<div class="m-body sp-body"><div style="height:120px;background:${GR[3]}"></div><div style="padding:10px 14px"><b>라운지 체어</b><br><small style="color:var(--muted)">129,000원</small></div><div class="sp-tabs"><button class="on">상품정보</button><button>리뷰 128</button><button>문의</button><i class="ind"></i></div>${['상품정보','리뷰','문의'].map(t=>`<div class="spsec"><h4>${t}</h4>${'<span class="m-ln"></span><span class="m-ln" style="width:75%"></span><span class="m-ln" style="width:90%"></span>'.repeat(4)}</div>`).join('')}<div style="height:120px"></div></div></div>`,
 init(st){const b=st.querySelector('.sp-body'),tabs=st.querySelector('.sp-tabs'),bs=[...tabs.querySelectorAll('button')],ind=tabs.querySelector('.ind'),secs=[...st.querySelectorAll('.spsec')];const set=i=>{bs.forEach((x,j)=>x.classList.toggle('on',j===i));ind.style.transform=`translateX(${i*100}%)`;};bs.forEach((x,i)=>x.onclick=()=>b.scrollTo({top:secs[i].offsetTop-tabs.offsetHeight+1,behavior:'smooth'}));b.addEventListener('scroll',()=>{let k=0;secs.forEach((s,i)=>{if(s.offsetTop-tabs.offsetHeight-4<=b.scrollTop)k=i;});set(k);},{passive:true});}},
{cat:'scroll',ko:'탭 바 숨김',en:'Hide Tab Bar on Scroll',alias:'스크롤 시 하단 바 숨김, 몰입 모드',
 desc:'아래로 스크롤하면 탭 바가 내려가 숨고, 위로 살짝 올리면 다시 나타나요. 콘텐츠를 더 넓게 볼 수 있어요.',
 dev:'hideOnScroll · HideBottomViewOnScrollBehavior',hint:'아래↓ 위↑ 스크롤',
 html:`<div class="app">${bar('홈','','bell')}<div class="m-body">${cards(6)}<div style="height:60px"></div></div>${tabbar(0,'abs')}</div>`,
 init(st){const b=st.querySelector('.m-body'),t=st.querySelector('.m-tabbar');let last=0;b.addEventListener('scroll',()=>{const y=b.scrollTop;if(Math.abs(y-last)<3)return;t.classList.toggle('hide',y>last&&y>30);last=y;},{passive:true});}},
{cat:'scroll',ko:'무한 스크롤',en:'Infinite Scroll',alias:'자동 더보기, 레이지 로딩, 페이지네이션(모바일)',
 desc:'목록 끝에 닿으면 다음 콘텐츠를 자동으로 불러와요. 아래쪽에 로딩 표시가 잠깐 나타나요.',
 dev:'LazyColumn · prefetch · onEndReached',hint:'끝까지 스크롤',
 html:`<div class="app">${bar('피드','','')}<div class="m-body"><div class="il"></div><div class="ild"><div class="spin"></div></div></div></div>`,
 init(st,c){const b=st.querySelector('.m-body'),L=st.querySelector('.il'),ld=st.querySelector('.ild');let n=0,busy=false;const add=k=>{for(let i=0;i<k;i++){n++;L.insertAdjacentHTML('beforeend',`<div class="m-row"><span class="av" style="background:${COL[n%6]}"></span><span class="tx"><b>게시물 #${n}</b><small>무한 스크롤</small></span></div>`);L.lastElementChild.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:300,delay:i*40,fill:'both'});}};add(8);b.addEventListener('scroll',()=>{if(busy||n>=60)return;if(b.scrollTop+b.clientHeight>b.scrollHeight-20){busy=true;ld.classList.add('on');c.after(()=>{add(6);ld.classList.remove('on');busy=false;},800);}},{passive:true});}},
{cat:'scroll',ko:'세로 페이징',en:'Vertical Paging',alias:'숏폼 스와이프, 릴스형 스크롤, 풀스크린 스냅',
 desc:'한 번 넘길 때마다 화면 한 장씩 딱 맞춰 넘어가요. 숏폼 영상 서비스의 기본 방식이에요.',
 dev:'scroll-snap · VerticalPager · isPagingEnabled',hint:'위아래 스크롤 · 드래그',dark:true,
 html:`<div class="shorts">${GR.slice(0,5).map((g,i)=>`<section style="background:${g}"><div class="side"><span>${I('heart',22)}${(12-i)}k</span><span>${I('chat',22)}${300+i*40}</span><span>${I('share',22)}공유</span></div><div class="cap"><b>@creator_${i+1}</b><br>숏폼 영상 ${i+1} · 위로 넘겨보세요</div></section>`).join('')}</div>`,
 init(st){const s=st.querySelector('.shorts');dragScroll(s,'y',()=>s.clientHeight);}},
{cat:'scroll',ko:'가로 선반',en:'Horizontal Shelf',alias:'가로 스크롤 리스트, 캐러셀 섹션, 레일(Rail)',
 desc:'세로로 스크롤되는 화면 안에 가로로 넘기는 줄이 여러 개 있어요. 각 줄 오른쪽에 "전체보기"를 둬요. OTT·커머스 홈에서 많이 써요.',
 dev:'LazyRow in LazyColumn · UICollectionViewCompositionalLayout',hint:'가로 · 세로 스크롤',
 html:`<div class="app">${bar('홈','','search')}<div class="m-body">${['지금 뜨는 콘텐츠','최근 본 상품','추천 브랜드'].map((t,k)=>`<div class="shelf"><h4>${t}<small>전체보기 ›</small></h4><div class="row ${k===1?'wide':''}">${Array.from({length:7},(_,i)=>`<div style="background:${GR[(i+k)%6]}"></div>`).join('')}</div></div>`).join('')}<div style="height:30px"></div></div></div>`,
 init(st){st.querySelectorAll('.shelf .row').forEach(r=>dragScroll(r,'x'));}},
{cat:'scroll',ko:'맨 위로 버튼',en:'Scroll to Top',alias:'탑 버튼, 상태 표시줄 탭',
 desc:'어느 정도 스크롤하면 나타나고, 누르면 맨 위로 올라가요. iOS는 상단 상태 표시줄을 탭해도 맨 위로 가요.',
 dev:'scrollTo(top) · scrollsToTop',hint:'스크롤 후 ↑ 클릭',
 html:`<div class="app">${bar('목록','','')}<div class="m-body">${rows(16,{t:'항목'})}</div></div><button class="btt">${I('up',18)}</button>`,
 init(st){const b=st.querySelector('.m-body'),t=st.querySelector('.btt');b.addEventListener('scroll',()=>t.classList.toggle('show',b.scrollTop>120),{passive:true});t.onclick=()=>b.scrollTo({top:0,behavior:'smooth'});}},
{cat:'scroll',ko:'스크롤 리빌',en:'Scroll Reveal',alias:'스크롤 등장, 인뷰 애니메이션',
 desc:'카드가 화면에 들어올 때 아래에서 떠오르며 나타나요. 모바일에서는 짧고 가볍게(200~400ms) 쓰는 게 좋아요.',
 dev:'onAppear · IntersectionObserver',hint:'스크롤',
 html:`<div class="app">${bar('매거진','','')}<div class="m-body">${cards(8).replace(/class="m-card"/g,'class="m-card rv"')}</div></div>`,
 init(st){const b=st.querySelector('.m-body');const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('in',e.isIntersecting)),{root:b,threshold:.2});b.querySelectorAll('.rv').forEach(x=>io.observe(x));}},
{cat:'scroll',ko:'확장형 FAB',en:'Extended FAB',alias:'라벨 FAB, 축소되는 플로팅 버튼',
 desc:'아이콘과 글자가 함께 있는 플로팅 버튼이에요. 아래로 스크롤하면 아이콘만 남도록 줄어들고, 위로 올리면 다시 늘어나요.',
 dev:'ExtendedFloatingActionButton(expanded)',hint:'스크롤',
 html:`<div class="app">${bar('커뮤니티','','search')}<div class="m-body">${rows(14,{t:'글',s:'댓글 12 · 좋아요 40'})}</div></div><button class="efab">${I('pen',17)}<span>글쓰기</span></button>`,
 init(st){const b=st.querySelector('.m-body'),f=st.querySelector('.efab');let last=0;b.addEventListener('scroll',()=>{const y=b.scrollTop;if(Math.abs(y-last)<3)return;f.classList.toggle('mini',y>last&&y>20);last=y;},{passive:true});}},

/* ---------- FEEDBACK ---------- */
{cat:'feedback',ko:'스켈레톤 UI',en:'Skeleton',alias:'스켈레톤 로딩, 고스트 UI, 쉬머(Shimmer)',
 desc:'콘텐츠가 올 자리에 회색 뼈대를 먼저 보여줘요. 위를 지나가는 빛은 쉬머(Shimmer)라고 해요. 스피너보다 덜 기다리는 느낌을 줘요.',
 dev:'redacted(.placeholder) · Shimmer',hint:'자동 반복',
 html:`<div class="app">${bar('피드','','bell')}<div class="skw"><div class="sk">${[0,1].map(()=>`<div class="fc"><div class="hd"><span class="av"></span><span class="t"><span class="m-ln" style="width:50%"></span><span class="m-ln" style="width:30%"></span></span></div><div class="im"></div></div>`).join('')}</div><div class="real">${[0,1].map(i=>`<div class="fc"><div class="hd"><span class="av" style="background:${GR[i]}"></span><span class="t"><b>creator_${i+1}</b><small style="color:var(--muted);font-size:10px">방금 전</small></span></div><div class="im" style="background:${GR[i+2]}"></div></div>`).join('')}</div></div></div>`,
 init(st,c){const w=st.querySelector('.skw');c.every(()=>w.classList.toggle('loaded'),2200);}},
{cat:'feedback',ko:'액티비티 인디케이터',en:'Activity Indicator',alias:'스피너, 로딩 인디케이터, 프로그레스 인디케이터',
 desc:'끝을 알 수 없는 대기를 표시해요. iOS는 회전하는 살(Spokes), Android는 늘었다 줄었다 하는 원형 선이 기본이에요.',
 dev:'ProgressView() · CircularProgressIndicator',hint:'자동 재생',
 html:`<div class="app">${bar('로딩','back','')}<div class="ai-wrap"><div><span class="ios-sp"></span>iOS · Activity Indicator</div><div><svg class="md-sp" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20"/></svg>Android · Circular</div><div><span class="lin"><i></i></span>Linear · Indeterminate</div></div></div>`,
 init(st){const s=st.querySelector('.ios-sp');for(let i=0;i<8;i++){const x=document.createElement('i');x.style.transform=`rotate(${i*45}deg)`;x.style.animationDelay=(-1+i/8)+'s';s.appendChild(x);}}},
{cat:'feedback',ko:'리플 효과',en:'Ripple',alias:'잉크 효과, 터치 피드백(Android)',
 desc:'누른 위치에서 물결이 퍼져 나가요. Android(머티리얼)의 기본 터치 반응이에요.',
 dev:'Modifier.clickable · ripple',hint:'항목 클릭',
 html:`<div class="app">${bar('설정','back','')}<div class="m-body rpl">${rows(8,{t:'메뉴'})}</div></div>`,
 init(st){st.querySelectorAll('.rpl .m-row').forEach(r=>r.addEventListener('pointerdown',e=>ripple(r,e)));}},
{cat:'feedback',ko:'탭 하이라이트',en:'Tap Highlight',alias:'눌림 상태, 셀 하이라이트, Pressed state(iOS)',
 desc:'누르는 동안 행 배경이 회색으로 바뀌었다가 떼면 서서히 돌아와요. iOS 목록의 기본 터치 반응이에요.',

{cat:'feedback',ko:'오프라인 배너',en:'Offline Banner',alias:'네트워크 상태 배너, 연결 끊김 알림',
 desc:'인터넷 연결이 끊기면 상단에 배너가 나타나고, 다시 연결되면 초록색으로 바뀌었다 사라져요.',
 dev:'NWPathMonitor · ConnectivityManager',hint:'버튼 클릭',
 html:`<div class="app">${bar('홈','','bell')}<div class="m-body">${cards(2)}<div class="m-pad"><button class="m-cta dark tg">${I('wifi',15)}연결 끊어보기</button></div></div></div><div class="offb">${I('wifi',13)}<span>오프라인 상태예요</span></div>`,
 init(st,c){const b=st.querySelector('.offb'),t=st.querySelector('.tg'),s=b.querySelector('span');let off=false;t.onclick=()=>{off=!off;if(off){b.classList.remove('ok');s.textContent='오프라인 상태예요';b.classList.add('show');t.innerHTML=I('wifi',15)+'다시 연결하기';}else{b.classList.add('ok');s.textContent='다시 연결됐어요';t.innerHTML=I('wifi',15)+'연결 끊어보기';c.after(()=>{if(!off)b.classList.remove('show');},1500);}};}},
{cat:'feedback',ko:'인라인 검증',en:'Inline Validation',alias:'실시간 유효성 검사, 입력 오류 표시',
 desc:'입력하는 동안 바로 맞는지 알려줘요. 틀리면 빨간 테두리와 문구, 맞으면 초록 표시. 모든 조건을 만족해야 버튼이 활성화돼요.',
 dev:'onChange validation · error state',hint:'입력해 보기',
 html:`<div class="app">${bar('회원가입','back','')}<div class="m-body iv"><div class="f fe"><label>이메일</label><input placeholder="name@mail.com"><div class="msg"></div></div><div class="f fp"><label>비밀번호</label><input type="password" placeholder="8자 이상"><ul class="rules"><li class="r1">✓ 8자 이상</li><li class="r2">✓ 숫자 포함</li><li class="r3">✓ 영문 포함</li></ul></div></div><div class="m-pad" style="padding-bottom:28px"><button class="m-cta go" disabled>가입하기</button></div></div>`,
 init(st){const fe=st.querySelector('.fe'),fp=st.querySelector('.fp'),ei=fe.querySelector('input'),pi=fp.querySelector('input'),m=fe.querySelector('.msg'),go=st.querySelector('.go');const chk=()=>{const ev=ei.value,ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ev);fe.classList.toggle('bad',!!ev&&!ok);fe.classList.toggle('good',ok);m.textContent=!ev?'':ok?'사용할 수 있는 이메일이에요':'이메일 형식이 올바르지 않아요';const p=pi.value,r=[p.length>=8,/\d/.test(p),/[a-zA-Z]/.test(p)];r.forEach((v,i)=>fp.querySelector('.r'+(i+1)).classList.toggle('ok',v));go.disabled=!(ok&&r.every(Boolean));};ei.oninput=chk;pi.oninput=chk;}},
{cat:'feedback',ko:'완료 화면',en:'Success Screen',alias:'결과 화면, 완료 페이지, 성공 피드백',
 desc:'주문·가입처럼 중요한 작업이 끝났을 때 보여주는 화면이에요. 체크 애니메이션과 다음 행동 버튼을 함께 둬요.',
 dev:'Lottie · stroke animation',hint:'↻ 재생',
 html:`<div class="app"><div class="okscr"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34"/><path d="M25 41 l10 10 l20 -22"/></svg><b>주문이 완료됐어요</b><p>내일(화) 도착 예정이에요</p><button class="m-cta">주문 내역 보기</button></div></div>`},
{cat:'feedback',ko:'빈 화면',en:'Empty State',alias:'엠티 스테이트, 데이터 없음, 제로 스테이트',
 desc:'보여줄 내용이 없을 때의 화면이에요. 일러스트, 이유를 알려주는 문구, 다음 행동 버튼(CTA)으로 구성해요.',
 dev:'ContentUnavailableView · EmptyView',
 html:`<div class="app">${bar('찜 목록','','')}<div class="m-body"><div class="emp"><svg viewBox="0 0 64 64" fill="none" stroke="#b6b4ad" stroke-width="2.5" stroke-linejoin="round"><path d="M32 54s-20-12-24-24C5 21 11 12 20 12c5 0 9 3 12 7 3-4 7-7 12-7 9 0 15 9 12 18-4 12-24 24-24 24z"/></svg><b>아직 찜한 상품이 없어요</b><p>마음에 드는 상품의 ♡를 눌러<br>여기에 모아보세요</p><button class="m-cta">상품 둘러보기</button></div></div>${tabbar(2)}</div>`},
{cat:'feedback',ko:'로딩 버튼',en:'Loading Button',alias:'비동기 버튼, 상태 버튼',
 desc:'누르면 버튼 안에 로딩 표시가 나타나고, 끝나면 완료로 바뀌어요. 처리 중에는 다시 눌리지 않게 막아요.',
 dev:'isLoading · disabled',hint:'버튼 클릭',
 html:`<div class="app">${bar('프로필 수정','back','')}<div class="m-body"><div class="tf"><label>이름</label><div class="w"><input value="김디자인"></div></div><div class="tf"><label>소개</label><div class="w"><input value="Product Designer"></div></div></div></div><div class="lbw"><button class="m-cta">저장하기</button></div>`,
 init(st,c){const b=st.querySelector('.lbw .m-cta');let s=0;b.onclick=()=>{if(s)return;s=1;b.classList.add('loading');b.innerHTML='<i class="sp"></i>저장 중…';c.after(()=>{b.classList.remove('loading');b.classList.add('done');b.innerHTML=I('check',15)+'저장 완료';c.after(()=>{b.classList.remove('done');b.textContent='저장하기';s=0;},1500);},1500);};}},
{cat:'feedback',ko:'좋아요 애니메이션',en:'Like Animation',alias:'하트 팝, 파티클 버스트',
 desc:'하트를 누르면 쪼그라들었다 커지며 작은 파티클이 터져요. 숫자도 함께 바뀌어요.',
 dev:'Lottie · scale keyframes',hint:'♡ 클릭',
 html:`<div class="app">${bar('피드','','')}<div class="m-body">${[0,1].map(i=>`<div class="fc"><div class="hd"><span class="av" style="background:${GR[i]}"></span><span class="t"><b>creator_${i+1}</b></span></div><div class="im" style="background:${GR[i+3]}"></div><div style="display:flex;align-items:center;gap:6px;margin-top:8px"><button class="lk-btn">${HEART}</button><span class="n" style="font-size:11px;font-weight:700">${120+i*30}</span></div></div>`).join('')}</div></div>`,
 init(st){st.querySelectorAll('.lk-btn').forEach(b=>{const n=b.nextElementSibling;b.onclick=()=>{const on=b.classList.toggle('on');n.textContent=+n.textContent+(on?1:-1);if(on)burst(b);};});}},
{cat:'feedback',ko:'햅틱 피드백',en:'Haptic Feedback',alias:'진동 피드백, 탭틱, 햅틱 터치',
 desc:'스위치를 켜거나 중요한 행동을 했을 때 짧은 진동으로 손끝에 반응을 줘요. 강도(Light·Medium·Heavy)와 종류(Success·Error)를 지정해요. (화면에서는 흔들림으로 표현)',
 dev:'UIImpactFeedbackGenerator · HapticFeedback',hint:'스위치 클릭',
 html:`<div class="app ios-bg">${bar('설정','back','')}<div class="m-body"><div class="m-sec">햅틱</div><div class="grpl">${[['진동 모드','Light Impact',1],['키보드 햅틱','Selection',0],['결제 완료 알림','Success',0]].map(([t,k,v])=>`<div class="r" data-k="${k}"><span class="l">${t}</span><label class="m-sw"><input type="checkbox" ${v?'checked':''}><span></span></label></div>`).join('')}</div></div></div><span class="hp-tag"></span>`,
 init(st,c){const ph=st.parentElement,tag=st.querySelector('.hp-tag');let h;st.querySelectorAll('.grpl .r').forEach(r=>{r.querySelector('input').addEventListener('change',()=>{ph.classList.remove('buzz');void ph.offsetWidth;ph.classList.add('buzz');const sw=r.querySelector('.m-sw'),sr=st.getBoundingClientRect(),rr=sw.getBoundingClientRect(),ring=document.createElement('span');ring.className='hp-ring';ring.style.left=(rr.left-sr.left+rr.width/2-15)+'px';ring.style.top=(rr.top-sr.top+rr.height/2-15)+'px';st.appendChild(ring);ring.addEventListener('animationend',()=>ring.remove());tag.textContent='Haptic · '+r.dataset.k;tag.classList.add('show');clearTimeout(h);h=setTimeout(()=>tag.classList.remove('show'),1200);});});}},
{cat:'feedback',ko:'업로드 진행',en:'Upload Progress',alias:'전송 진행률, 파일 업로드 상태',
 desc:'파일마다 진행 막대와 퍼센트를 보여주고, 끝나면 체크로 바뀌어요. 여러 개를 동시에 올릴 때 써요.',
 dev:'URLSession progress · WorkManager',hint:'자동 재생',
 html:`<div class="app">${bar('업로드','close','')}<div class="m-body">${['IMG_2041.jpg','IMG_2042.jpg','영상_0312.mp4','문서_최종.pdf'].map((t,i)=>`<div class="up-row"><span class="th" style="background:${GR[i]}"></span><span class="tx"><b>${t}</b><span class="bar"><i></i></span></span><span class="st">0%</span></div>`).join('')}</div></div>`,
 init(st,c){const rs=[...st.querySelectorAll('.up-row')];const sp=[1.4,.9,.45,1.1];let t0;c.raf(t=>{if(t0===undefined)t0=t;let all=true;rs.forEach((r,i)=>{const p=Math.min(100,(t-t0)/1000*35*sp[i]);r.querySelector('.bar i').style.width=p+'%';const s=r.querySelector('.st');if(p>=100){r.classList.add('done');s.textContent='완료';}else{all=false;s.textContent=Math.floor(p)+'%';}});return !all;});}},

{cat:'screen',ko:'스플래시',en:'Splash Screen',alias:'런치 스크린, 시작 화면, 로딩 화면',
 desc:'앱을 켤 때 잠깐 보이는 첫 화면이에요. 보통 로고만 두고, 준비가 끝나면 홈으로 자연스럽게 넘어가요.',
 dev:'LaunchScreen · SplashScreen API',hint:'↻ 재생',
 html:`<div class="app">${bar('홈','','bell')}<div class="m-body">${cards(3)}</div>${tabbar(0)}</div><div class="spl"><b>MyApp</b></div>`,

{cat:'screen',ko:'온보딩',en:'Onboarding',alias:'워크스루(Walkthrough), 튜토리얼, 앱 소개 화면',
 desc:'처음 앱을 연 사용자에게 핵심 가치를 2~4장으로 소개해요. 건너뛰기, 페이지 점, 시작하기 버튼으로 구성돼요.',
 dev:'PageView · ViewPager + indicator',hint:'좌우 드래그 · 다음 클릭',
 html:`<div class="ob"><span class="skip">건너뛰기</span><div class="slides">${[['쉽게 기록하고','하루를 간단히 남겨보세요'],['함께 나누고','친구들과 순간을 공유해요'],['다시 꺼내 봐요','소중한 기억을 모아 보여드려요']].map((s,i)=>`<section><div class="il" style="background:${GR[i]}"></div><h3>${s[0]}</h3><p>${s[1]}</p></section>`).join('')}</div><div class="pdots"><i class="on"></i><i></i><i></i></div><div class="bt"><button class="m-cta nx">다음</button></div></div>`,
 init(st){const s=st.querySelector('.slides'),ds=[...st.querySelectorAll('.pdots i')],nx=st.querySelector('.nx');const idx=()=>Math.round(s.scrollLeft/s.clientWidth);s.addEventListener('scroll',()=>{const i=idx();ds.forEach((d,j)=>d.classList.toggle('on',j===i));nx.textContent=i===2?'시작하기':'다음';},{passive:true});nx.onclick=()=>{const i=idx();s.scrollTo({left:((i+1)%3)*s.clientWidth,behavior:'smooth'});};st.querySelector('.skip').onclick=()=>s.scrollTo({left:2*s.clientWidth,behavior:'smooth'});dragScroll(s,'x',()=>s.clientWidth);}},
{cat:'screen',ko:'로그인',en:'Login',alias:'로그인 화면, 사인인, 간편 로그인',
 desc:'아이디·비밀번호 입력과 함께 SNS 간편 로그인 버튼을 둬요. 하단엔 회원가입·계정 찾기 링크를 배치해요.',

{cat:'screen',ko:'권한 요청',en:'Permission Request',alias:'시스템 권한 팝업, 사전 안내(Pre-permission)',
 desc:'알림·위치·카메라 등을 쓰기 전에 운영체제가 띄우는 허용 창이에요. 거절률을 줄이려고 먼저 앱 화면으로 이유를 설명(사전 안내)하기도 해요.',

{cat:'screen',ko:'채팅',en:'Chat',alias:'메신저, 대화방, 채팅방',
 desc:'상대 말풍선은 왼쪽, 내 말풍선은 오른쪽이에요. 아래엔 입력창(Composer)과 전송 버튼, 상대가 입력 중이면 점 세 개가 나타나요.',
 dev:'MessageList · Composer · typing indicator',hint:'메시지 입력 후 전송',
 html:`<div class="app">${bar('민지','back','more')}<div class="chat"><span class="ctime">오늘 오후 2:10</span><div class="bb l">시안 확인했어요! 👀</div><div class="bb l">모달 부분은 바텀 시트로 바꿔볼까요?</div><div class="bb r">좋아요, 드래그로 닫히게 할게요</div></div><div class="cin"><input placeholder="메시지 입력"><button>${I('send',15)}</button></div></div>`,
 init(st,c){const ch=st.querySelector('.chat'),inp=st.querySelector('.cin input');const R=['네 좋아요!','확인했습니다 🙌','그 방향으로 가요','멋지네요!'];let k=0;const send=()=>{const v=inp.value.trim()||'이 페이지 참고해 주세요';inp.value='';ch.insertAdjacentHTML('beforeend',`<div class="bb r"></div>`);ch.lastElementChild.textContent=v;ch.scrollTop=ch.scrollHeight;c.after(()=>{ch.insertAdjacentHTML('beforeend','<div class="bb l typing"><i></i><i></i><i></i></div>');ch.scrollTop=ch.scrollHeight;c.after(()=>{const t=ch.querySelector('.typing');if(t)t.remove();ch.insertAdjacentHTML('beforeend',`<div class="bb l">${R[k++%R.length]}</div>`);ch.scrollTop=ch.scrollHeight;},1200);},400);};st.querySelector('.cin button').onclick=send;inp.addEventListener('keydown',e=>{if(e.key==='Enter')send();});}},

/* wrap a PC-engine spec into a phone screen */
function MW(spec,o={}){const r=MSC(`<div class="mz">${spec.html}</div>`,{...o,bcss:'overflow:hidden;'+(o.bcss||'')});r.init=(st,c)=>{spec.init&&spec.init(st,c);o.init&&o.init(st,c);};r.dev=o.dev||spec.dev;r.hint=o.hint||spec.hint;return r;}

/* screen transition with arbitrary keyframes */
function mtransT(T){return (st,c)=>{const Pg=st.querySelector('.pgs'),A=Pg.querySelector('.a'),B=Pg.querySelector('.b');if(T.bg)Pg.style.background=T.bg;
 B.style.visibility='hidden';let open=false,busy=false,an=[];
 const fwd=()=>{if(open||busy)return;busy=true;B.style.visibility='visible';A.style.zIndex=T.below?2:1;B.style.zIndex=T.below?1:2;
  const o={duration:T.d||480,easing:T.e||'cubic-bezier(.2,.8,.2,1)',fill:'both'};
  an=[A.animate(T.out||[{opacity:1},{opacity:1}],{...o,...(T.oo||{})}),B.animate(T.in||[{opacity:1},{opacity:1}],{...o,...(T.io||{})})];
  Promise.all(an.map(a=>a.finished)).then(()=>{open=true;busy=false;}).catch(()=>{});};
 const back=()=>{if(!open||busy)return;busy=true;an.forEach(a=>a.reverse());Promise.all(an.map(a=>a.finished)).then(()=>{an.forEach(a=>a.cancel());B.style.visibility='hidden';open=false;busy=false;}).catch(()=>{});};
 A.querySelectorAll('[data-go],.m-row').forEach(x=>x.addEventListener('click',fwd));B.querySelectorAll('.m-bar .bi').forEach(x=>x.addEventListener('click',back));
 const loop=()=>{c.after(fwd,700);c.after(back,2600);};loop();c.every(loop,4200);};}
const MTX=(T,a,b)=>({hint:'자동 재생 · 탭',dev:T.dev,html:MP(a,b),init:mtransT(T)});

 init(st,c){const s=st.querySelector('.ms'),its=[...s.querySelectorAll('.msc-i')];let ly=0,vel=0;
  const up=()=>{const r=s.getBoundingClientRect();const cc=r.top+r.height/2,half=r.height/2;const y=s.scrollTop;vel=vel*.6+(y-ly)*.4;ly=y;const max=s.scrollHeight-s.clientHeight;const prog=max>0?y/max:0;
   if(o.f)its.forEach((el,i)=>{const b=el.getBoundingClientRect();const p=Math.max(-1.6,Math.min(1.6,(b.top+b.height/2-cc)/half));Object.assign(el.style,o.f(p,i,vel));});if(o.g)o.g(st,prog,y,vel);};
  s.addEventListener('scroll',up,{passive:true});requestAnimationFrame(up);if(typeof dragScroll==='function')dragScroll(s,'y');if(o.init)o.init(st,c,s);
  if(o.auto!==false)c.after(()=>s.scrollTo({top:o.ap||180,behavior:'smooth'}),700);}};}

const INFO_TIP=`<span class="info" tabindex="0" aria-label="즐겨찾기 저장 안내">!<span class="tip" role="tooltip"><b>즐겨찾기는 이 브라우저에만 저장돼요</b>로그인 기준이 아니라 지금 쓰는 PC의 이 브라우저에 저장돼요. 다른 사람·다른 PC·다른 브라우저와는 공유되지 않아요. 브라우저를 업데이트해도 그대로 남아요.<ul><li>브라우저의 쿠키·사이트 데이터를 지우면 함께 삭제돼요</li><li>시크릿 창은 창을 닫으면 사라져요</li><li>사파리는 7일 넘게 방문하지 않으면 지워질 수 있어요</li><li>사이트 주소가 바뀌거나 내려받은 파일로 열면 따로 저장돼요</li><li>회사 보안 정책으로 종료 시 데이터를 지우는 PC도 있어요</li><li>PC·MO 페이지 즐겨찾기는 따로 저장돼요</li></ul><div style="margin-top:8px"><b style="display:inline;font-size:12.5px">다른 PC로 옮기려면</b> ‘코드 복사’로 받은 코드를 새 PC에서 ‘코드 붙여넣기’ 하세요. 새 용어가 추가돼도 저장한 즐겨찾기는 유지돼요.</div></span></span>`;

const b64e=u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const b64d=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');const s=atob(t);return Uint8Array.from(s,c=>c.charCodeAt(0));};
async function pipe(u,stream){return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(stream)).arrayBuffer());}
async function makeCode(){const d={};for(const m in ALLKEYS){let a=[];try{a=JSON.parse(localStorage.getItem(ALLKEYS[m])||'[]');}catch(e){}if(m===MODE.toLowerCase())a=[...FAV];if(a.length)d[m]=a;}
 const raw=new TextEncoder().encode(JSON.stringify(d));
 if(typeof CompressionStream!=='undefined'){try{return 'SD1z-'+b64e(await pipe(raw,new CompressionStream('deflate-raw')));}catch(e){}}
 return 'SD1j-'+b64e(raw);}
async function readCode(code){code=code.trim().replace(/\s+/g,'');const m=code.match(/^SD1([zj])-([A-Za-z0-9_-]+)$/);if(!m)throw 0;let u=b64d(m[2]);if(m[1]==='z')u=await pipe(u,new DecompressionStream('deflate-raw'));const d=JSON.parse(new TextDecoder().decode(u));if(typeof d!=='object'||!d)throw 0;return d;}
function openDlg(kind){const bg=$('#dlg');const ta=bg.querySelector('textarea'),go=bg.querySelector('.go');
 if(kind==='copy'){bg.querySelector('h4').textContent='동기화 코드';bg.querySelector('p').innerHTML='이 코드를 메모나 메신저에 저장해 두세요. 다른 PC·브라우저에서 ‘코드 붙여넣기’로 즐겨찾기를 불러올 수 있어요. PC·MO 즐겨찾기가 함께 들어 있어요.';ta.readOnly=true;ta.value='만드는 중…';go.textContent='복사하기';
  makeCode().then(c=>{ta.value=c;ta.select();});go.onclick=async()=>{const ok=await copyText(ta.value);toast(ok?'코드를 복사했어요':'코드를 직접 선택해 복사해 주세요');if(ok)closeDlg();};}
 else{bg.querySelector('h4').textContent='코드 붙여넣기';bg.querySelector('p').innerHTML='저장해 둔 동기화 코드를 붙여넣으세요. 지금 있는 즐겨찾기는 그대로 두고, 코드 속 즐겨찾기를 <b style="color:#fff">더해요</b>.';ta.readOnly=false;ta.value='';ta.placeholder='SD1z-…';go.textContent='불러오기';setTimeout(()=>ta.focus(),50);
  go.onclick=async()=>{let d;try{d=await readCode(ta.value);}catch(e){toast('코드가 올바르지 않아요. 다시 확인해 주세요');return;}
   let added=0;for(const m in ALLKEYS){if(!Array.isArray(d[m]))continue;if(m===MODE.toLowerCase()){d[m].forEach(k=>{if(!FAV.has(k)){FAV.add(k);added++;}});saveFav();}else{try{const cur=new Set(JSON.parse(localStorage.getItem(ALLKEYS[m])||'[]'));d[m].forEach(k=>{if(!cur.has(k)){cur.add(k);added++;}});localStorage.setItem(ALLKEYS[m],JSON.stringify([...cur]));}catch(e){}}}
   closeDlg();updFavCount();toast(added?`즐겨찾기 ${added}개를 불러왔어요`:'이미 모두 들어 있어요');if(current==='fav')show('fav');};}
 bg.classList.add('show');}

function makeCard(it,showCat){
  const a=document.createElement('article');a.className='card';const cat=CATS.find(c=>c.id===it.cat);
  const hasMore=it.alias||it.dev;
  a.innerHTML=`<div class="stage">${STAGE(it)}${it.hint?`<span class="hint">${it.hint}</span>`:''}<button class="replay" title="다시 재생" aria-label="다시 재생">↻</button><button class="fav ${FAV.has(favKey(it))?'on':''}" title="즐겨찾기" aria-label="즐겨찾기" aria-pressed="${FAV.has(favKey(it))}">${STAR}</button></div>
  <div class="meta">${showCat?`<span class="cattag">${cat.ko}</span>`:''}<div class="names"><h3 title="${esc(it.ko)}">${it.ko}</h3><span class="en" title="${esc(it.en)}">${it.en}</span></div><p class="desc">${it.desc}</p>
  <div class="more">${it.alias?`<div class="box"><b>다른 이름</b>${it.alias}</div>`:''}${it.dev?`<div class="box"><b>개발 용어</b><code>${esc(it.dev)}</code></div>`:''}</div>
  <div class="foot"><button class="btn sec mo-t">자세히</button><button class="btn pri copy">명칭 복사</button></div></div>`;
  const mount=()=>MOUNT(a,it);
  a.querySelector('.replay').onclick=mount;
  a.querySelector('.mo-t').onclick=e=>{const o=a.classList.toggle('open');e.currentTarget.textContent=o?'접기':'자세히';};
  a.querySelector('.copy').onclick=async()=>{const t=`${it.ko} (${it.en})`;const ok=await copyText(t);toast(ok?`복사했어요 · ${t}`:t);};
  a.querySelector('.fav').onclick=e=>{const b=e.currentTarget,k=favKey(it);const on=!FAV.has(k);on?FAV.add(k):FAV.delete(k);const ok=saveFav();b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');updFavCount();toast(!ok?'이 브라우저에서는 저장할 수 없어요':on?'즐겨찾기에 추가했어요':'즐겨찾기에서 뺐어요');if(!on&&current==='fav'){a.remove();$('#cnt').textContent=FAV.size+'개';if(!FAV.size)renderCards([],false,'fav');}};
  a._mount=mount;return a;

let io=null;
function renderCards(list,showCat,kind){
  if(io)io.disconnect();grid.innerHTML='';
  if(!list.length){grid.innerHTML=kind==='fav'?'<p class="empty-res">아직 즐겨찾기한 명칭이 없어요. 카드 오른쪽 위 ☆를 눌러 추가해 보세요.</p>':'<p class="empty-res">찾는 명칭이 없어요. 다른 단어(영문/한글)로 검색해 보세요.</p>';return;}
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target._done){e.target._done=true;e.target._mount();}}),{rootMargin:'400px 0px'});
  const frag=document.createDocumentFragment();list.forEach(it=>{const c=makeCard(it,showCat);frag.appendChild(c);});grid.appendChild(frag);grid.querySelectorAll('.card').forEach(c=>io.observe(c));

function setNav(id){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));const on=nav.querySelector('button.on');if(on&&getComputedStyle(nav).flexDirection==='row')nav.scrollTo({left:on.offsetLeft-12,behavior:'smooth'});}
function show(id){
  if(id==='fav'){current='fav';setNav('fav');const list=ITEMS.filter(it=>FAV.has(favKey(it)));head('즐겨찾기',list.length,'별표한 명칭을 모아 봤어요. 카테고리 순서대로 보여줘요.',true);renderCards(list,true,'fav');window.scrollTo(0,0);return;}
  if(id==='all'){current='all';setNav('all');head('전체 보기',ITEMS.length,ALL_DESC);renderCards(ITEMS,true);window.scrollTo(0,0);return;}
  const cat=CATS.find(c=>c.id===id)||CATS[0];current=cat.id;setNav(cat.id);

  head(cat.ko,list.length,cat.desc+' 자주 쓰는 것부터 정렬했어요.');
  renderCards(list,false);window.scrollTo(0,0);
}
function search(v){
  const k=v.trim().toLowerCase();if(!k){show(current);return;}
  const list=ITEMS.filter(it=>[it.ko,it.en,it.alias||'',it.desc,it.dev||''].join(' ').toLowerCase().includes(k));
  setNav('__none');head(`“${v.trim()}” 검색 결과`,list.length,'모든 카테고리에서 한글명 · 영문명 · 다른 이름 · 설명을 함께 찾았어요.');
  renderCards(list,true);
}
