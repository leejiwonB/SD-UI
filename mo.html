<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MO · 모바일 UI·모션 용어 사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0f;--panel:#141418;--ink:#ececf1;--on-ink:#111114;--muted:#9a9aa6;--line:#27272e;--stage:#19191e;--accent:#5b74ff;--accent-d:#4a63f0;--accent-2:#ff6a45;--ios:#3d8bff;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;display:grid;grid-template-columns:264px 1fr;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
::selection{background:rgba(91,116,255,.4)}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 18px;border-right:1px solid var(--line);background:#101013;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.brand{display:flex;gap:10px;align-items:center;padding:0 4px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#0c0c0f;display:grid;place-items:center;font-weight:900;font-size:14px;letter-spacing:-.04em;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:-.02em}
.brand small{color:var(--muted);font-size:10.5px;font-family:var(--mono)}
.mode{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;color:var(--muted);cursor:pointer;transition:border-color .2s}
.mode:hover{border-color:#3d3d47}
.mode .cap{font-size:11.5px;color:var(--muted);flex:1}
.mode .tg{display:flex;align-items:center;gap:8px}
.mode .l{font:700 12.5px var(--mono);transition:color .25s;color:#5d5d68}
.mode .sw{position:relative;width:44px;height:24px;border-radius:99px;background:var(--accent);flex:none;transition:background .3s}
.mode .sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .32s cubic-bezier(.3,1.4,.6,1)}
.mode.mo .sw i{transform:translateX(20px)}
.mode.pc .lp,.mode.mo .lm{color:var(--ink)}
.mode.go.pc .sw i{transform:translateX(20px)}
.mode.go.mo .sw i{transform:none}
.mode.go.pc .lp{color:#5d5d68}.mode.go.pc .lm{color:var(--ink)}
.mode.go.mo .lm{color:#5d5d68}.mode.go.mo .lp{color:var(--ink)}
.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font:inherit;font-size:13px;outline:none;color:var(--ink)}
.search input::placeholder{color:#6a6a75}
.search input:focus{border-color:#55556a}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px;color:#c9c9d2;transition:background .15s}
#nav button:hover{background:#1b1b21}
#nav button .n{font-family:var(--mono);font-size:10.5px;color:#5d5d68;width:16px}
#nav button .k{flex:1;display:flex;flex-direction:column;line-height:1.25;font-weight:500}
#nav button .k small{font-family:var(--mono);font-size:10px;color:#73737e;font-weight:400}
#nav button .c{font-family:var(--mono);font-size:10.5px;color:#8a8a96;background:#1d1d23;border-radius:99px;padding:2px 7px}
#nav button.on{background:var(--ink);color:#0c0c0f}
#nav button.on .k small,#nav button.on .n{color:#6b6b75}
#nav button.on .c{background:#d5d5dd;color:#2a2a30}
.side-foot{margin:auto 4px 0;font-size:11.5px;line-height:1.6;color:#73737e}
.side-foot b{color:#b9b9c3}
main{padding:34px 40px 80px;min-width:0}
.top{margin-bottom:24px;max-width:820px}
.eyebrow{margin:0 0 6px;font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.top h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.035em;line-height:1.15}
.top p.d{margin:10px 0 0;color:#a9a9b4;font-size:14.5px;line-height:1.65}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.empty-res{color:var(--muted);font-size:14px;padding:40px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s}
.card:hover{border-color:#34343d}
.stage{position:relative;height:224px;background:var(--stage);overflow:hidden;border-bottom:1px solid var(--line);isolation:isolate}
.hint{position:absolute;left:9px;bottom:9px;font-size:10px;font-family:var(--mono);background:rgba(20,20,24,.92);border:1px solid var(--line);padding:2px 7px;border-radius:6px;color:var(--muted);z-index:60;pointer-events:none;max-width:70%}
.replay{position:absolute;right:8px;top:8px;z-index:60;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:rgba(20,20,24,.92);cursor:pointer;font-size:14px;color:#a9a9b4;display:grid;place-items:center;transition:transform .3s}
.replay:hover{transform:rotate(-120deg);color:var(--ink)}
.meta{padding:14px 16px 15px;display:flex;flex-direction:column;gap:5px;flex:1}
.cattag{align-self:flex-start;font-size:10.5px;background:rgba(91,116,255,.16);color:#8fa0ff;padding:2px 7px;border-radius:5px;font-weight:500}
.names{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.names h3{margin:0;font-size:17px;letter-spacing:-.025em;font-weight:700}
.en{font-family:var(--mono);font-size:12px;color:#8fa0ff;font-weight:600}
.alias{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.desc{margin:3px 0 0;font-size:13px;line-height:1.65;color:#c4c4cd}
.foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:9px}
.dev{font-family:var(--mono);font-size:10.5px;background:#1b1b20;border:1px solid var(--line);padding:4px 7px;border-radius:6px;color:#b0b0bb;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{flex:none;font-size:11.5px;font-weight:500;border:1px solid var(--line);background:#1d1d23;border-radius:7px;padding:4px 9px;cursor:pointer;color:#d0d0d8}
.copy:hover{border-color:#55556a}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#111114;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){
  body{display:block}
  .side{position:sticky;top:0;z-index:70;height:auto;padding:12px;gap:10px;border-right:0;border-bottom:1px solid var(--line)}
  .side-foot{display:none}
  .brand{display:none}
  .mode{padding:8px 12px}
  #nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  #nav button{flex:none;padding:7px 10px}
  #nav button .n,#nav button .k small{display:none}
  main{padding:22px 16px 60px}
  .top h1{font-size:26px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ---------- Phone ---------- */
.ph{position:relative;width:220px;height:452px;border-radius:36px;background:#141418;padding:7px;box-shadow:0 24px 40px -22px rgba(0,0,0,.55),inset 0 0 0 1.5px #3a3a42;flex:none}
.ph.buzz{animation:buzz .32s linear}
@keyframes buzz{20%{transform:translateX(-2px) rotate(-.6deg)}40%{transform:translateX(2px) rotate(.6deg)}60%{transform:translateX(-1.5px)}80%{transform:translateX(1.5px)}}
.ph-scr{position:absolute;inset:7px;border-radius:29px;overflow:hidden;background:#fff;font-size:12px;isolation:isolate}
.ph-sb{position:absolute;top:7px;left:7px;right:7px;height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 20px 0 22px;font-size:10.5px;font-weight:700;z-index:40;pointer-events:none;color:#111}
.ph-sb svg{fill:currentColor}
.ph.dark .ph-sb{color:#fff}
.ph-island{position:absolute;top:14px;left:50%;width:62px;height:18px;margin-left:-31px;background:#000;border-radius:12px;z-index:41;transition:all .45s cubic-bezier(.3,1.3,.5,1);display:flex;align-items:center;justify-content:space-between;padding:0 8px;color:#fff;font-size:9px;font-weight:700;overflow:hidden}
.ph-island span{opacity:0;transition:opacity .2s;white-space:nowrap}
.ph-island.big{width:150px;margin-left:-75px;height:30px;top:12px;border-radius:16px}
.ph-island.big span{opacity:1;transition-delay:.2s}
.ph-hi{position:absolute;bottom:14px;left:50%;width:76px;height:4px;margin-left:-38px;border-radius:3px;background:#111;z-index:41;pointer-events:none}
.ph.dark .ph-hi{background:#fff}

/* ---------- App primitives ---------- */
.ic{flex:none;display:block}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;padding-top:26px}
.m-bar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:13px;font-weight:700;flex:none;background:#fff;position:relative;z-index:3}
.m-bar .t{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
.m-bar .bi{width:28px;height:28px;display:grid;place-items:center;cursor:pointer;border-radius:8px}
.m-bar .bi:active{background:#f0efea}
.m-body{flex:1;overflow:auto;position:relative;scrollbar-width:none;overscroll-behavior:contain}
.m-body::-webkit-scrollbar{display:none}
.m-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #f1f0eb;background:#fff;cursor:pointer;position:relative;overflow:hidden}
.m-row .av{width:32px;height:32px;border-radius:50%;background:#dfe4ff;flex:none}
.m-row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.m-row .tx small{color:var(--muted);font-size:10.5px}
.m-row .ic{color:#b6b4ad}
.m-card{margin:10px 12px;border-radius:14px;background:#f4f3ef;padding:10px;display:flex;flex-direction:column;gap:7px}
.m-card .im{height:74px;border-radius:10px}
.m-ln{display:block;height:6px;border-radius:3px;background:#e4e2db}
.m-cta{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:42px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:transform .15s,background .2s,opacity .2s}
.m-cta:active{transform:scale(.97)}
.m-cta.dark{background:var(--ink)}
.m-cta.ghost{background:#f1f0ec;color:var(--ink)}
.m-cta:disabled{background:#d6d4cd;color:#fff;cursor:not-allowed}
.m-tabbar{height:58px;flex:none;display:flex;border-top:1px solid #efeee9;background:rgba(255,255,255,.96);padding-bottom:12px;position:relative;z-index:4}
.m-tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;color:#a9a8a1;cursor:pointer;position:relative}
.m-tabbar button.on{color:var(--ink);font-weight:700}
.m-tabbar.abs{position:absolute;left:0;right:0;bottom:0;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.m-tabbar.abs.hide{transform:translateY(100%)}
.m-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:99px;background:#f1f0ec;font-size:11px;margin:3px 3px 0 0;cursor:pointer;white-space:nowrap;border:1px solid transparent;transition:.2s}
.m-chip.on{background:var(--ink);color:#fff}
.m-dim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.m-dim.show{opacity:1;pointer-events:auto}
.m-sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:8px 14px 28px;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.3,1);z-index:21;touch-action:none}
.m-sheet.show{transform:none}
.m-sheet .sh-t{display:block;font-size:14px;margin:2px 0 10px}
.grab{width:38px;height:5px;border-radius:9px;background:#d4d2cb;margin:0 auto 10px;cursor:grab}
.m-opt{padding:11px 4px;border-bottom:1px solid #f1f0eb;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between}
.m-opt.on{color:var(--accent);font-weight:700}
.m-pad{padding:12px}
.lbl{position:absolute;font:600 9px var(--mono);background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;z-index:45;white-space:nowrap;pointer-events:none}
.lbl.o{background:var(--accent-2)}
.lbl.k{background:#16161a}
.m-h{font-size:22px;font-weight:900;letter-spacing:-.03em;margin:4px 14px 10px}
.m-sec{font-size:10.5px;color:var(--muted);padding:12px 14px 5px;font-weight:600}
.m-go{position:absolute;right:12px;bottom:26px;border:0;border-radius:99px;background:var(--accent);color:#fff;font:inherit;font-size:11px;font-weight:700;padding:8px 13px;cursor:pointer;z-index:5;box-shadow:0 6px 14px -6px var(--accent)}
.m-sw{position:relative;display:inline-block;width:40px;height:24px;flex:none}
.m-sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.m-sw span{position:absolute;inset:0;background:#e3e2dc;border-radius:99px;transition:.25s}
.m-sw span::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.4,.6,1)}
.m-sw input:checked+span{background:#34c759}
.m-sw input:checked+span::after{transform:translateX(16px)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #e2e0da;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- Navigation ---------- */
.tabc b{display:block;font-size:18px;margin:8px 14px 0}
.lt-big{margin:2px 14px 8px;font-size:26px;font-weight:900;letter-spacing:-.03em;transition:opacity .2s}
.lt-small{opacity:0;transition:opacity .2s}
.lt-bar{transition:box-shadow .2s;background:rgba(255,255,255,.95)}
.lt-bar.sc{box-shadow:0 1px 0 #ebeae5}
.stabs{overflow-x:auto;scrollbar-width:none;flex:none;border-bottom:1px solid #efeee9}
.stabs::-webkit-scrollbar{display:none}
.stabs .trk{display:inline-flex;position:relative;padding:0 6px}
.stabs button,.swt button,.sp-tabs button{border:0;background:none;font:inherit;font-size:12px;padding:10px 9px;color:#9a9890;cursor:pointer;white-space:nowrap}
.stabs button.on,.swt button.on,.sp-tabs button.on{color:var(--ink);font-weight:700}
.stabs .ind{position:absolute;bottom:0;height:2.5px;background:var(--ink);border-radius:2px;transition:left .3s cubic-bezier(.4,0,.2,1),width .3s}
.swt{display:flex;position:relative;flex:none;border-bottom:1px solid #efeee9}
.swt button{flex:1}
.swt .ind{position:absolute;left:0;bottom:0;width:33.333%;height:2.5px;background:var(--ink)}
.swp{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab}
.swp::-webkit-scrollbar{display:none}
.swp section{flex:0 0 100%;scroll-snap-align:start;overflow:hidden;padding-top:6px}
.swp section b{display:block;margin:6px 14px 0;font-size:14px}
.m-drawer{position:absolute;left:0;top:0;bottom:0;width:74%;background:#fff;z-index:21;padding:40px 10px 10px;transform:translateX(-100%);transition:transform .38s cubic-bezier(.2,.9,.3,1);border-radius:0 18px 18px 0}
.m-drawer.show{transform:none}
.m-drawer .dp{padding:6px 8px 14px;border-bottom:1px solid #efeee9;margin-bottom:8px;display:flex;flex-direction:column;gap:3px}
.m-drawer .dp .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#9fb0ff,#3d5afe);margin-bottom:6px}
.m-drawer .dp small{color:var(--muted);font-size:10.5px}
.m-drawer a{display:block;padding:10px 12px;border-radius:99px;font-size:12.5px;cursor:pointer}
.m-drawer a.on{background:#e7ebff;color:var(--accent);font-weight:700}
.ftb{position:absolute;left:20px;right:20px;bottom:26px;height:50px;border-radius:99px;background:#16161a;display:flex;padding:5px;box-shadow:0 12px 24px -10px rgba(0,0,0,.5);z-index:4}
.ftb button{flex:1;position:relative;z-index:1;color:#8a8990;border:0;background:none;display:grid;place-items:center;cursor:pointer;transition:color .3s}
.ftb button.on{color:#16161a}
.ftb .blob{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:99px;background:#fff;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.ctb .mid .pl{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 16px -6px var(--accent);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.ctb .mid.open .pl{transform:rotate(45deg)}
.ctm{position:absolute;left:50%;bottom:74px;display:flex;gap:10px;transform:translateX(-50%);z-index:6}
.ctm span{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 6px 16px -6px rgba(0,0,0,.35);display:grid;place-items:center;font-size:10px;font-weight:700;opacity:0;transform:translateY(20px) scale(.6);transition:.3s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.ctm.show span{opacity:1;transform:none;pointer-events:auto}
.ctm.show span:nth-child(2){transition-delay:.04s}.ctm.show span:nth-child(3){transition-delay:.08s}
.sbw .lt-big{height:34px;overflow:hidden;transition:height .3s,opacity .2s,margin .3s}
.sbw.on .lt-big{height:0;opacity:0;margin-top:0;margin-bottom:0}
.sbar{display:flex;align-items:center;padding:0 12px 8px;gap:8px}
.fld{flex:1;display:flex;align-items:center;gap:6px;background:#efeef0;border-radius:10px;padding:0 9px;height:32px;color:#8a8990}
.fld input{border:0;background:none;outline:none;font:inherit;font-size:12.5px;width:100%;color:var(--ink)}
.sbar .cn{border:0;background:none;color:var(--ios);font:inherit;font-size:12.5px;width:0;opacity:0;overflow:hidden;padding:0;transition:.3s;white-space:nowrap;cursor:pointer}
.sbw.on .sbar .cn{width:30px;opacity:1}
.recent{padding:4px 12px 8px}
.recent small{display:block;color:var(--muted);font-size:10.5px;margin-bottom:4px}
.ovm{position:absolute;right:8px;top:66px;width:136px;background:#fff;border-radius:14px;box-shadow:0 12px 30px -8px rgba(0,0,0,.35);padding:4px;transform:scale(.7);transform-origin:top right;opacity:0;pointer-events:none;transition:.22s cubic-bezier(.3,1.3,.5,1);z-index:10}
.ovm.show{opacity:1;transform:none;pointer-events:auto}
.ovm a{display:flex;gap:8px;align-items:center;padding:9px;font-size:12px;border-radius:9px;cursor:pointer}
.ovm a:active{background:#f1f0ec}
.ovm .dg{color:#e5484d}

/* ---------- Components ---------- */
.m-as{position:absolute;left:8px;right:8px;bottom:24px;z-index:21;transform:translateY(140%);transition:transform .42s cubic-bezier(.2,.9,.3,1)}
.m-as.show{transform:none}
.m-as .grp{background:rgba(249,249,251,.97);border-radius:14px;overflow:hidden;margin-top:7px}
.m-as small{display:block;text-align:center;font-size:10px;color:#8a8990;padding:9px}
.m-as a{display:block;text-align:center;padding:11px;font-size:14px;color:var(--ios);border-top:1px solid #e3e3e8;cursor:pointer}
.m-as .grp:last-child a{border:0;font-weight:700}
.m-as a.dg{color:#ff3b30}
.m-alert{position:absolute;left:50%;top:50%;width:200px;margin-left:-100px;transform:translateY(-50%) scale(1.15);opacity:0;background:rgba(249,249,251,.98);border-radius:16px;text-align:center;z-index:21;transition:transform .3s cubic-bezier(.2,.9,.3,1),opacity .2s;pointer-events:none;overflow:hidden}
.m-alert.show{transform:translateY(-50%);opacity:1;pointer-events:auto}
.m-alert b{display:block;font-size:13.5px;padding:16px 14px 4px}

.andnav{position:absolute;left:0;right:0;bottom:0;height:44px;background:#f2f2f2;display:flex;justify-content:space-around;align-items:center;z-index:42;border-top:1px solid #e3e3e3}

.thumb{position:absolute;inset:0;z-index:35;pointer-events:none;background:radial-gradient(circle at 85% 100%,rgba(52,199,89,.42) 0 190px,rgba(255,204,0,.36) 191px 300px,rgba(255,59,48,.3) 301px)}

function ctx(st){

  const alive=()=>st._gen===gen&&st.isConnected;
  return {alive,
    after(fn,ms){setTimeout(()=>{if(alive())fn();},ms);},
    every(fn,ms){const id=setInterval(()=>{if(!alive())return clearInterval(id);fn();},ms);},
    raf(fn){const loop=t=>{if(!alive())return;if(fn(t)!==false)requestAnimationFrame(loop);};requestAnimationFrame(loop);}};
}

const I=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;

const tabbar=(on=0,cls='')=>`<div class="m-tabbar ${cls}">${[['home','홈'],['search','검색'],['heart','찜'],['user','MY']].map(([k,l],i)=>`<button class="${i===on?'on':''}">${I(k,19)}<span>${l}</span></button>`).join('')}</div>`;
const HEART='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">'+P.heart+'</svg>';
function dragScroll(el,axis,snap){
  let down=false,moved=false,p0=0,s0=0;
  const pos=e=>axis==='x'?e.clientX:e.clientY;
  el.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=false;p0=pos(e);s0=axis==='x'?el.scrollLeft:el.scrollTop;});
  el.addEventListener('pointermove',e=>{if(!down)return;const d=pos(e)-p0;if(!moved&&Math.abs(d)>5){moved=true;try{el.setPointerCapture(e.pointerId);}catch(_){}el.style.scrollSnapType='none';el.style.scrollBehavior='auto';}if(moved){if(axis==='x')el.scrollLeft=s0-d;else el.scrollTop=s0-d;}});
  const up=e=>{if(!down)return;down=false;if(!moved)return;
    const size=snap?snap():0;
    if(size){const cur=axis==='x'?el.scrollLeft:el.scrollTop,start=s0,dir=Math.sign(cur-start);let t=Math.round(cur/size)*size;if(Math.abs(cur-start)>size*.18&&Math.round(cur/size)*size===Math.round(start/size)*size)t=(Math.round(start/size)+dir)*size;el.scrollTo({[axis==='x'?'left':'top']:t,behavior:'smooth'});setTimeout(()=>{el.style.scrollSnapType='';},500);}
    else el.style.scrollSnapType='';
    setTimeout(()=>{moved=false;},0);};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();}},true);
}
function sheetCtl(st,sel,dimSel){
  const s=st.querySelector(sel),d=dimSel?st.querySelector(dimSel):null;
  const set=v=>{s.classList.toggle('show',v);if(d)d.classList.toggle('show',v);s.style.transform='';};
  if(d)d.addEventListener('click',()=>set(false));
  const g=s.querySelector('.grab');
  if(g){let y0=null,dy=0;const tgt=s;
    tgt.addEventListener('pointerdown',e=>{if(!e.target.closest('.grab,.sh-t'))return;y0=e.clientY;dy=0;tgt.setPointerCapture(e.pointerId);tgt.style.transition='none';});
    tgt.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);tgt.style.transform=`translateY(${dy}px)`;if(d)d.style.opacity=String(1-dy/300);});
    const end=()=>{if(y0===null)return;y0=null;tgt.style.transition='';if(d)d.style.opacity='';if(dy>70)set(false);else tgt.style.transform='';};
    tgt.addEventListener('pointerup',end);tgt.addEventListener('pointercancel',end);}
  return {open:()=>set(true),close:()=>set(false)};
}
function ripple(el,e,col){const r=el.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height)*2.2;s.className='rp';if(col)s.style.background=col;s.style.cssText+=`;width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;el.appendChild(s);s.addEventListener('animationend',()=>s.remove());}
function burst(btn){const cols=['#ff3b5c','#3d5afe','#ffb547','#34c759'];btn.querySelector('svg').animate([{transform:'scale(1)'},{transform:'scale(.6)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:450,easing:'ease-out'});for(let i=0;i<8;i++){const p=document.createElement('i');p.className='pt';p.style.background=cols[i%4];const a=i/8*Math.PI*2;btn.appendChild(p);p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*24}px),calc(-50% + ${Math.sin(a)*24}px)) scale(0)`,opacity:.6}],{duration:550,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();}}

const PA=`${bar('홈','','bell')}<div class="m-body">${rows(7,{t:'게시물',s:'탭해서 상세 보기'})}</div><button class="m-go" data-go>열기 →</button>`;

const MT={
  push:{out:[{transform:'translateX(0)',filter:'brightness(1)'},{transform:'translateX(-30%)',filter:'brightness(.7)'}],in:[{transform:'translateX(100%)'},{transform:'translateX(0)'}],d:480},

  sharedAxis:{out:[{transform:'translateX(0)',opacity:1},{transform:'translateX(-36px)',opacity:0}],in:[{transform:'translateX(36px)',opacity:0},{transform:'translateX(0)',opacity:1}],d:360,e:'cubic-bezier(.4,0,.2,1)'},
  circle:{out:[{opacity:1},{opacity:1}],in:[{clipPath:'circle(0% at 84% 87%)'},{clipPath:'circle(150% at 84% 87%)'}],d:620,e:'cubic-bezier(.6,0,.3,1)'}
};
function mtrans(type){return (st,c)=>{
  const Pg=st.querySelector('.pgs'),A=Pg.querySelector('.a'),B=Pg.querySelector('.b'),T=MT[type];
  if(T.bg)Pg.style.background=T.bg; if(T.sheet)B.classList.add('sheetb');
  B.style.visibility='hidden';let open=false,busy=false,an=[];
  const fwd=()=>{if(open||busy)return;busy=true;B.style.visibility='visible';A.style.zIndex=1;B.style.zIndex=2;
    const o={duration:T.d||500,easing:T.e||'cubic-bezier(.2,.8,.2,1)',fill:'both'};
    an=[A.animate(T.out,{...o,...(T.outOpt||{})}),B.animate(T.in,{...o,...(T.inOpt||{})})];
    Promise.all(an.map(a=>a.finished)).then(()=>{open=true;busy=false;}).catch(()=>{});};
  const back=()=>{if(!open||busy)return;busy=true;an.forEach(a=>a.reverse());
    Promise.all(an.map(a=>a.finished)).then(()=>{an.forEach(a=>a.cancel());B.style.visibility='hidden';open=false;busy=false;}).catch(()=>{});};
  A.querySelectorAll('[data-go],.m-row').forEach(x=>x.addEventListener('click',fwd));
  B.querySelectorAll('.m-bar .bi').forEach(x=>x.addEventListener('click',back));
  c.after(fwd,700);c.after(back,2500);
};}
function morph(o){return (st,c)=>{
  let open=null,busy=false;const E='cubic-bezier(.6,0,.2,1)';
  const srcs=[...st.querySelectorAll(o.src)];
  const openEl=src=>{if(open||busy)return;busy=true;
    const sr=st.getBoundingClientRect(),r=src.getBoundingClientRect(),W=st.clientWidth,H=st.clientHeight;
    const d=document.createElement('div');d.className='mo-det';d.innerHTML=`<div class="mo-hero"></div><div class="mo-body">${o.body}</div><span class="mo-x">${I('close',14)}</span>`;
    const h=d.querySelector('.mo-hero'),b=d.querySelector('.mo-body'),x=d.querySelector('.mo-x');
    h.style.background=src.dataset.bg||src.style.background;b.style.top=(H*o.ratio)+'px';if(o.ratio>=1){b.style.top='26px';b.style.color='#fff';}
    st.appendChild(d);
    const from={left:(r.left-sr.left)+'px',top:(r.top-sr.top)+'px',width:r.width+'px',height:r.height+'px',borderRadius:o.r0||'12px'},
          to={left:'0px',top:'0px',width:W+'px',height:(H*o.ratio)+'px',borderRadius:'0px'};
    src.style.visibility='hidden';
    const a1=h.animate([from,to],{duration:520,easing:E,fill:'forwards'});
    const a2=d.animate([{background:'rgba(255,255,255,0)'},{background:o.ratio>=1?'rgba(255,255,255,0)':'rgba(255,255,255,1)'}],{duration:300,fill:'forwards'});
    const a3=b.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:300,delay:330,fill:'both'});
    const a4=x.animate([{opacity:0},{opacity:1}],{duration:200,delay:400,fill:'both'});
    a1.onfinish=()=>{busy=false;};open={d,src,an:[a1,a2,a3,a4]};x.onclick=close;};
  const close=()=>{if(!open||busy)return;busy=true;const {d,src,an}=open;open=null;an.forEach(a=>{a.playbackRate=1.15;a.reverse();});
    Promise.all(an.map(a=>a.finished)).then(()=>{src.style.visibility='';d.remove();busy=false;}).catch(()=>{});};
  srcs.forEach(s=>s.addEventListener('click',()=>openEl(s)));
  c.after(()=>openEl(srcs[o.auto||0]),800);c.after(close,2800);

{cat:'nav',ko:'상단 앱 바',en:'Top App Bar',alias:'내비게이션 바(Navigation Bar), 헤더, 타이틀 바',
 desc:'화면 맨 위 제목 영역이에요. 왼쪽(Leading)엔 뒤로가기, 가운데는 제목(Title), 오른쪽(Trailing)엔 액션 아이콘을 둬요.',
 dev:'UINavigationBar · TopAppBar',
 html:`<div class="app">${bar('화면 제목')}<div class="m-body">${cards(3)}</div></div><span class="lbl" style="left:6px;top:72px">Leading</span><span class="lbl k" style="left:50%;transform:translateX(-50%);top:72px">Title</span><span class="lbl o" style="right:6px;top:72px">Trailing</span>`},
{cat:'nav',ko:'라지 타이틀',en:'Large Title',alias:'큰 제목, 접히는 제목',
 desc:'iOS에서 큰 제목이 콘텐츠 위에 있다가, 스크롤하면 작은 제목으로 바뀌며 상단 바에 들어가요.',
 dev:'prefersLargeTitles = true',hint:'스크롤',
 html:`<div class="app ios-bg"><div class="m-bar lt-bar"><span></span><span class="t lt-small">설정</span><span></span></div><div class="m-body"><h2 class="lt-big">설정</h2><div class="grpl">${['일반','알림','개인정보 보호','배터리','디스플레이','사운드'].map(t=>`<div class="r"><span class="l">${t}</span>${I('chev',13)}</div>`).join('')}</div><div class="grpl">${['계정','언어','도움말','앱 정보'].map(t=>`<div class="r"><span class="l">${t}</span>${I('chev',13)}</div>`).join('')}</div><div style="height:60px"></div></div></div>`,
 init(st){const b=st.querySelector('.m-body'),s=st.querySelector('.lt-small'),bar=st.querySelector('.lt-bar'),big=st.querySelector('.lt-big');b.addEventListener('scroll',()=>{const y=b.scrollTop;s.style.opacity=y>28?1:0;big.style.opacity=Math.max(0,1-y/30);bar.classList.toggle('sc',y>28);},{passive:true});}},
{cat:'nav',ko:'스크롤 탭',en:'Scrollable Tabs',alias:'상단 탭, 카테고리 탭, 가로 스크롤 탭',
 desc:'탭이 많을 때 좌우로 스크롤되는 상단 탭이에요. 누른 탭이 가운데로 오도록 자동 스크롤하는 게 일반적이에요.',
 dev:'TabLayout(scrollable) · ScrollView',hint:'탭 클릭',
 html:`<div class="app">${bar('쇼핑','','search')}<div class="stabs"><div class="trk">${['추천','랭킹','신상품','세일','브랜드','뷰티','리빙','스포츠'].map((t,i)=>`<button class="${i?'':'on'}">${t}</button>`).join('')}<i class="ind"></i></div></div><div class="m-body"><div class="stc2">${cards(3)}</div></div></div>`,
 init(st){const w=st.querySelector('.stabs'),bs=[...w.querySelectorAll('button')],ind=w.querySelector('.ind'),ct=st.querySelector('.stc2');const set=(b,a)=>{bs.forEach(x=>x.classList.toggle('on',x===b));ind.style.left=(b.offsetLeft+6)+'px';ind.style.width=(b.offsetWidth-12)+'px';w.scrollTo({left:b.offsetLeft-w.clientWidth/2+b.offsetWidth/2,behavior:'smooth'});if(a)ct.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:250});};bs.forEach(b=>b.onclick=()=>set(b,true));requestAnimationFrame(()=>set(bs[0]));dragScroll(w,'x');}},
{cat:'nav',ko:'스와이프 탭',en:'Swipe Tabs',alias:'뷰 페이저(ViewPager), 페이징 탭',
 desc:'탭 아래 콘텐츠를 좌우로 밀어서 탭을 바꿔요. 인디케이터가 손가락을 따라 함께 움직여요.',
 dev:'ViewPager2 · TabView(.page)',hint:'좌우 드래그',
 html:`<div class="app">${bar('피드','','')}<div class="swt"><button class="on">팔로잉</button><button>추천</button><button>인기</button><i class="ind"></i></div><div class="swp">${['팔로잉','추천','인기'].map((t,i)=>`<section><b>${t} 피드</b>${cards(3,i*2)}</section>`).join('')}</div></div>`,
 init(st){const sw=st.querySelector('.swp'),bs=[...st.querySelectorAll('.swt button')],ind=st.querySelector('.swt .ind');sw.addEventListener('scroll',()=>{const p=sw.scrollLeft/sw.clientWidth;ind.style.transform=`translateX(${p*100}%)`;const i=Math.round(p);bs.forEach((b,j)=>b.classList.toggle('on',j===i));},{passive:true});bs.forEach((b,i)=>b.onclick=()=>sw.scrollTo({left:i*sw.clientWidth,behavior:'smooth'}));dragScroll(sw,'x',()=>sw.clientWidth);}},
{cat:'nav',ko:'내비게이션 드로어',en:'Navigation Drawer',alias:'사이드 메뉴, 햄버거 메뉴, 오프캔버스',
 desc:'왼쪽에서 꺼내는 메뉴 패널이에요. 위쪽에는 프로필 헤더를 두는 경우가 많고, 바깥(딤)을 누르면 닫혀요.',
 dev:'DrawerLayout · ModalNavigationDrawer',hint:'☰ 클릭',
 html:`<div class="app">${bar('MyApp','menu','')}<div class="m-body">${cards(3)}</div></div><div class="m-dim"></div><div class="m-drawer"><div class="dp"><span class="av"></span><b>김디자인</b><small>designer@mail.com</small></div><a class="on">홈</a><a>탐색</a><a>알림</a><a>설정</a></div>`,
 init(st,c){const d=st.querySelector('.m-drawer'),m=st.querySelector('.m-dim');const set=v=>{d.classList.toggle('show',v);m.classList.toggle('show',v);};st.querySelector('.m-bar .bi').onclick=()=>set(true);m.onclick=()=>set(false);d.querySelectorAll('a').forEach(a=>a.onclick=()=>{d.querySelectorAll('a').forEach(x=>x.classList.toggle('on',x===a));set(false);});}},
{cat:'nav',ko:'플로팅 탭 바',en:'Floating Tab Bar',alias:'알약형 탭 바, 필(Pill) 내비게이션',
 desc:'화면 가장자리에서 떨어져 떠 있는 알약 모양 탭 바예요. 선택 표시가 미끄러지듯 이동해요.',
 dev:'custom TabBar · spring animation',hint:'탭 클릭',
 html:`<div class="app"><div class="m-body" style="padding-top:4px">${cards(4)}<div style="height:60px"></div></div><div class="ftb"><i class="blob"></i>${['home','search','heart','user'].map((k,i)=>`<button class="${i?'':'on'}">${I(k,18)}</button>`).join('')}</div></div>`,
 init(st){const bs=[...st.querySelectorAll('.ftb button')],bl=st.querySelector('.blob');bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(x=>x.classList.toggle('on',x===b));bl.style.transform=`translateX(${i*100}%)`;});}},
{cat:'nav',ko:'센터 액션 탭 바',en:'Center Action Tab',alias:'중앙 버튼 탭 바, 만들기(+) 탭',
 desc:'탭 바 가운데에 강조된 + 버튼을 둔 형태예요. 글쓰기·업로드처럼 서비스의 핵심 행동을 강조할 때 써요.',
 dev:'BottomAppBar + FAB',hint:'+ 클릭',
 html:`<div class="app"><div class="m-body">${cards(4)}</div><div class="ctm"><span>글</span><span>사진</span><span>라이브</span></div><div class="m-tabbar ctb"><button class="on">${I('home',19)}<span>홈</span></button><button>${I('search',19)}<span>검색</span></button><button class="mid"><span class="pl">${I('plus',22)}</span></button><button>${I('chat',19)}<span>채팅</span></button><button>${I('user',19)}<span>MY</span></button></div></div>`,
 init(st){const m=st.querySelector('.mid'),menu=st.querySelector('.ctm');m.onclick=()=>{m.classList.toggle('open');menu.classList.toggle('show');};}},
{cat:'nav',ko:'검색 바',en:'Search Bar',alias:'서치 바, 검색창, 검색 컨트롤러',
 desc:'누르면 큰 제목이 접히고 오른쪽에 취소 버튼이 나타나며 검색 모드로 바뀌어요. 최근 검색어를 함께 보여주는 경우가 많아요.',
 dev:'UISearchController · SearchBar',hint:'검색창 클릭',
 html:`<div class="app"><div class="sbw"><h2 class="lt-big">검색</h2><div class="sbar"><div class="fld">${I('search',14)}<input placeholder="검색"></div><button class="cn">취소</button></div></div><div class="m-body"><div class="recent"><small>최근 검색어</small>${['모달','바텀 시트','스와이프','토스트'].map(t=>`<span class="m-chip">${t}</span>`).join('')}</div>${cards(2)}</div></div>`,
 init(st){const w=st.querySelector('.sbw'),i=st.querySelector('.fld input');i.addEventListener('focus',()=>w.classList.add('on'));st.querySelector('.cn').onclick=()=>{i.value='';i.blur();w.classList.remove('on');};st.querySelectorAll('.recent .m-chip').forEach(ch=>ch.onclick=()=>{w.classList.add('on');i.value=ch.textContent;});}},
{cat:'nav',ko:'더보기 메뉴',en:'Overflow Menu',alias:'케밥 메뉴(⋮), 미트볼 메뉴(⋯), 옵션 메뉴',
 desc:'⋮ 또는 ⋯ 아이콘을 누르면 나오는 추가 메뉴예요. 자주 쓰지 않는 액션을 숨겨 화면을 깔끔하게 유지해요.',
 dev:'DropdownMenu · UIMenu',hint:'⋮ 클릭',
 html:`<div class="app">${bar('상세','back','more')}<div class="m-body">${cards(3)}</div></div><div class="ovm"><a>${I('share',14)}공유하기</a><a>${I('heart',14)}저장</a><a>${I('pen',14)}수정</a><a class="dg">${I('trash',14)}삭제</a></div>`,
 init(st){const m=st.querySelector('.ovm'),b=st.querySelectorAll('.m-bar .bi')[1];b.onclick=e=>{e.stopPropagation();m.classList.toggle('show');};st.addEventListener('click',e=>{if(!e.target.closest('.ovm'))m.classList.remove('show');});m.querySelectorAll('a').forEach(a=>a.onclick=()=>m.classList.remove('show'));}},

/* ---------- COMPONENTS ---------- */
{cat:'comp',ko:'바텀 시트',en:'Bottom Sheet',alias:'하단 시트, 드래그 시트, 모달 시트',
 desc:'아래에서 올라오는 패널이에요. 핸들(Handle/Grabber)을 아래로 끌면 닫혀요. 멈추는 높이 단계는 스냅 포인트(Snap points)라고 해요.',
 dev:'BottomSheet · detents / snapPoints',hint:'버튼 클릭 · 핸들 드래그',
 html:`<div class="app">${bar('상품','back','')}<div class="m-body">${cards(2)}<div class="m-pad"><button class="m-cta op">옵션 선택</button></div></div></div><div class="m-dim"></div><div class="m-sheet"><div class="grab"></div><b class="sh-t">옵션 선택</b>${['블랙 / M','블랙 / L','화이트 / M'].map((t,i)=>`<div class="m-opt ${i?'':'on'}">${t}${i?'':I('check',14)}</div>`).join('')}<div style="height:10px"></div><button class="m-cta">확인</button></div>`,
 init(st,c){const s=sheetCtl(st,'.m-sheet','.m-dim');st.querySelector('.op').onclick=s.open;st.querySelectorAll('.m-sheet .m-cta,.m-opt').forEach(b=>b.addEventListener('click',s.close));c.after(s.open,700);}},
{cat:'comp',ko:'액션 시트',en:'Action Sheet',alias:'선택 시트, iOS 액션 시트',
 desc:'iOS에서 아래에서 올라오는 선택지 목록이에요. 취소 버튼이 따로 떨어져 있고, 삭제처럼 위험한 동작은 빨간색으로 표시해요.',
 dev:'UIAlertController(.actionSheet)',hint:'클릭',
 html:`<div class="app">${bar('프로필','back','')}<div class="m-body"><div style="display:flex;flex-direction:column;align-items:center;padding:24px 0;gap:10px"><span style="width:76px;height:76px;border-radius:50%;background:${GR[0]}"></span><button class="m-cta ghost op" style="width:auto;padding:0 16px;height:34px">사진 변경</button></div>${rows(3,{t:'정보'})}</div></div><div class="m-dim"></div><div class="m-as"><div class="grp"><small>프로필 사진 변경</small><a>사진 찍기</a><a>앨범에서 선택</a><a class="dg">현재 사진 삭제</a></div><div class="grp"><a>취소</a></div></div>`,
 init(st,c){const s=sheetCtl(st,'.m-as','.m-dim');st.querySelector('.op').onclick=s.open;st.querySelectorAll('.m-as a').forEach(a=>a.onclick=s.close);c.after(s.open,700);}},
{cat:'comp',ko:'얼럿',en:'Alert Dialog',alias:'다이얼로그, 확인 창, 컨펌 팝업',
 desc:'화면 가운데 뜨는 확인 창이에요. 버튼은 2개 이하로, 권장 행동은 오른쪽(iOS는 굵게) 배치해요.',
 dev:'UIAlertController · AlertDialog',hint:'클릭',
 html:`<div class="app">${bar('설정','back','')}<div class="m-body">${rows(5,{t:'설정'})}<div class="m-pad"><button class="m-cta op">알림 설정하기</button></div></div></div><div class="m-dim"></div><div class="m-alert"><b>알림을 허용할까요?</b><p>새 댓글과 이벤트 소식을<br>가장 먼저 알려드려요.</p><div class="bt"><a>나중에</a><a class="pr">허용</a></div></div>`,
 init(st,c){const a=st.querySelector('.m-alert'),d=st.querySelector('.m-dim');const set=v=>{a.classList.toggle('show',v);d.classList.toggle('show',v);};st.querySelector('.op').onclick=()=>set(true);a.querySelectorAll('a').forEach(x=>x.onclick=()=>set(false));c.after(()=>set(true),700);}},
{cat:'comp',ko:'스낵바',en:'Snackbar',alias:'하단 알림, 실행 취소 바',
 desc:'화면 아래에 잠깐 나타나는 알림이에요. "실행 취소" 같은 액션을 하나 붙일 수 있고, 몇 초 뒤 자동으로 사라져요.',
 dev:'Snackbar.make(…).setAction("실행 취소")',hint:'보관 클릭',
 html:`<div class="app">${bar('메일함','menu','search')}<div class="m-body mlist">${rows(7,{t:'메일',s:'오른쪽 아이콘으로 보관',chev:false})}</div></div><div class="m-snack"><span>보관함으로 이동했어요</span><u>실행 취소</u></div>`,
 init(st){const s=st.querySelector('.m-snack');let h,last=null;st.querySelectorAll('.mlist .m-row').forEach(r=>{const b=document.createElement('span');b.innerHTML=I('archive',16);b.style.color='#8a8990';r.appendChild(b);b.onclick=e=>{e.stopPropagation();last=r;r.style.display='none';s.classList.add('show');clearTimeout(h);h=setTimeout(()=>s.classList.remove('show'),3000);};});s.querySelector('u').onclick=()=>{if(last)last.style.display='';s.classList.remove('show');};}},
{cat:'comp',ko:'토스트',en:'Toast',alias:'토스트 메시지, 상단 알림, HUD',
 desc:'짧은 결과 메시지를 잠깐 띄웠다가 사라져요. 액션 버튼 없이 정보만 알려줄 때 써요. iOS 앱은 위쪽, Android는 아래쪽에 띄우는 경우가 많아요.',
 dev:'Toast.makeText · custom HUD',hint:'클릭',
 html:`<div class="app">${bar('공유','back','')}<div class="m-body">${cards(2)}<div class="m-pad"><button class="m-cta op">${I('share',15)}링크 복사</button></div></div></div><div class="m-toast">${I('check',14)}링크를 복사했어요</div>`,
 init(st,c){const t=st.querySelector('.m-toast');let h;const show=()=>{t.classList.add('show');clearTimeout(h);h=setTimeout(()=>t.classList.remove('show'),1800);};st.querySelector('.op').onclick=show;c.after(show,700);}},
{cat:'comp',ko:'FAB · 스피드 다이얼',en:'FAB · Speed Dial',alias:'플로팅 액션 버튼, 떠 있는 버튼',
 desc:'화면 위에 떠 있는 핵심 행동 버튼(FAB)이에요. 누르면 하위 버튼이 라벨과 함께 펼쳐지는 형태를 스피드 다이얼이라고 해요.',
 dev:'FloatingActionButton · SpeedDial',hint:'+ 클릭',
 html:`<div class="app">${bar('노트','menu','search')}<div class="m-body">${rows(7,{t:'노트'})}</div></div><div class="m-dim"></div><div class="m-fabw"><button class="m-fab">${I('plus',22)}</button><span class="m-mini"><em>새 노트</em><i>${I('pen',15)}</i></span><span class="m-mini"><em>사진</em><i>${I('cam',15)}</i></span><span class="m-mini"><em>체크리스트</em><i>${I('check',15)}</i></span></div>`,
 init(st){const w=st.querySelector('.m-fabw'),d=st.querySelector('.m-dim');const set=v=>{w.classList.toggle('on',v);d.classList.toggle('show',v);};w.querySelector('.m-fab').onclick=()=>set(!w.classList.contains('on'));d.onclick=()=>set(false);w.querySelectorAll('.m-mini').forEach(m=>m.onclick=()=>set(false));}},
{cat:'comp',ko:'필터 칩',en:'Filter Chips',alias:'칩 필터, 태그 필터, 퀵 필터',
 desc:'가로로 스크롤되는 작은 버튼들로 목록을 걸러요. 여러 개를 동시에 고를 수 있고(다중 선택), 선택된 칩은 색이 채워져요.',
 dev:'ChipGroup · FilterChip',hint:'칩 클릭',
 html:`<div class="app">${bar('검색 결과','back','filter')}<div class="fchips">${['무료배송','오늘출발','할인','4.5점 이상','새상품','브랜드'].map(t=>`<span class="m-chip">${t}</span>`).join('')}</div><div class="fcount">전체 128개</div><div class="m-body fres">${rows(6,{t:'상품'})}</div></div>`,
 init(st){const ch=[...st.querySelectorAll('.fchips .m-chip')],cnt=st.querySelector('.fcount'),res=st.querySelector('.fres');ch.forEach(c=>c.onclick=()=>{c.classList.toggle('on');const n=ch.filter(x=>x.classList.contains('on')).length;cnt.textContent=n?`필터 ${n}개 적용 · ${Math.max(6,128-n*31)}개`:'전체 128개';res.animate([{opacity:.3},{opacity:1}],{duration:250});});dragScroll(st.querySelector('.fchips'),'x');}},
{cat:'comp',ko:'수량 스테퍼',en:'Quantity Stepper',alias:'수량 조절, 카운터, 플러스/마이너스 버튼',
 desc:'− / + 버튼으로 숫자를 하나씩 바꿔요. 최소값(1)에서는 − 버튼을 비활성(disabled)으로 바꿔 더 줄일 수 없음을 알려줘요.',
 dev:'UIStepper · NumberStepper',hint:'− + 클릭',
 html:`<div class="app">${bar('장바구니','back','')}<div class="m-body">${[0,1].map(i=>`<div class="qrow"><span class="th" style="background:${GR[i+1]}"></span><div class="tx"><b>상품 이름 ${i+1}</b><span class="pr" data-p="${[18000,24000][i]}">${[18000,24000][i].toLocaleString()}원</span><div class="qty"><button class="mn" disabled>−</button><span>1</span><button class="pl">+</button></div></div></div>`).join('')}<div class="sumry"><div class="tt"><span>합계</span><span class="sum">42,000원</span></div></div></div></div>`,
 init(st){const upd=()=>{let s=0;st.querySelectorAll('.qrow').forEach(r=>{s+=(+r.querySelector('.pr').dataset.p)*(+r.querySelector('.qty span').textContent);});st.querySelector('.sum').textContent=s.toLocaleString()+'원';};st.querySelectorAll('.qty').forEach(q=>{const v=q.querySelector('span'),mn=q.querySelector('.mn');const set=n=>{v.textContent=n;mn.disabled=n<=1;v.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:200});upd();};q.querySelector('.pl').onclick=()=>set(+v.textContent+1);mn.onclick=()=>set(Math.max(1,+v.textContent-1));});}},

 init(st,c){const w=st.querySelector('.otp'),ins=[...w.querySelectorAll('input')],m=st.querySelector('.otp-msg');let t=179;c.every(()=>{if(w.classList.contains('ok'))return;t=Math.max(0,t-1);m.textContent=`남은 시간 0${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;},1000);ins.forEach((inp,i)=>{inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&ins[i+1])ins[i+1].focus();if(ins.every(x=>x.value)){w.classList.add('ok');m.textContent='✓ 인증이 완료됐어요';m.style.color='#34c759';}});inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&ins[i-1]){ins[i-1].focus();ins[i-1].value='';w.classList.remove('ok');m.style.color='';}});});}},

 init(st){const h=st.querySelector('.cm-hole'),tip=st.querySelector('.cm-tip'),btn=tip.querySelector('button');const S=[{l:170,t:30,w:34,h:34,tt:120,b:'필터가 새로워졌어요',s:'여기서 원하는 조건으로 빠르게 걸러보세요.'},{l:110,t:380,w:56,h:46,tt:270,b:'찜 목록',s:'마음에 드는 상품은 여기 모여요.'}];let i=0;const set=()=>{if(i>=S.length){h.style.opacity=0;tip.style.opacity=0;setTimeout(()=>{h.style.display='none';tip.style.display='none';},300);return;}const s=S[i];Object.assign(h.style,{left:s.l+'px',top:s.t+'px',width:s.w+'px',height:s.h+'px'});tip.style.top=s.tt+'px';tip.querySelector('b').textContent=s.b;tip.querySelector('span').textContent=s.s;tip.querySelector('.cn').textContent=`${i+1} / ${S.length}`;btn.textContent=i===S.length-1?'확인':'다음';};btn.onclick=()=>{i++;set();};set();}},

 desc:'시작일과 종료일을 차례로 눌러 기간을 골라요. 사이 날짜는 연한 색 띠로 이어 보여줘요. 숙박·예약 서비스에서 많이 써요.',

 html:`<div class="app">${bar('날짜 선택','close','')}<div class="calsum"><div>체크인<b class="ci">12월 4일</b></div><div>체크아웃<b class="co">12월 7일</b></div></div><div class="m-body"><div class="cal"><div class="mh"><span>‹</span><span>2026년 12월</span><span>›</span></div><div class="wk">${'일월화수목금토'.split('').map(d=>`<span>${d}</span>`).join('')}</div><div class="ds"></div></div></div><div class="m-pad" style="padding-bottom:28px"><button class="m-cta cta">3박 · 선택 완료</button></div></div>`,
 init(st){const ds=st.querySelector('.ds'),ci=st.querySelector('.ci'),co=st.querySelector('.co'),cta=st.querySelector('.cta');const first=new Date(2026,11,1).getDay();let s=4,e=7;const draw=()=>{ds.innerHTML='';for(let i=0;i<first;i++)ds.insertAdjacentHTML('beforeend','<span class="mu"></span>');for(let d=1;d<=31;d++){const sp=document.createElement('span');sp.textContent=d;if(d===s)sp.classList.add('s');if(e&&d===e)sp.classList.add('e');if(d===s&&e)sp.classList.add('hasE');if(e&&d>s&&d<e)sp.classList.add('in');sp.onclick=()=>{if(!s||e){s=d;e=null;}else if(d>s){e=d;}else{s=d;}draw();};ds.appendChild(sp);}ci.textContent=s?`12월 ${s}일`:'-';co.textContent=e?`12월 ${e}일`:'선택';cta.textContent=e?`${e-s}박 · 선택 완료`:'체크아웃 날짜를 선택하세요';cta.disabled=!e;};draw();}},

 desc:'제목을 누르면 아래로 내용이 펼쳐져요. 화살표(Chevron)가 회전하며 열림 상태를 알려줘요.',
 dev:'DisclosureGroup · ExpandableListView',hint:'클릭',
 html:`<div class="app">${bar('자주 묻는 질문','back','')}<div class="m-body m-acc">${[['배송은 얼마나 걸리나요?','결제 후 평균 2~3일 안에 도착해요. 도서산간 지역은 1~2일 더 걸릴 수 있어요.'],['교환·환불은 어떻게 하나요?','수령 후 7일 이내 마이페이지 > 주문내역에서 신청할 수 있어요.'],['회원 등급 혜택이 궁금해요','등급에 따라 쿠폰과 적립률이 달라져요.'],['비밀번호를 잊어버렸어요','로그인 화면의 "비밀번호 찾기"를 눌러주세요.']].map((q,i)=>`<div class="it ${i?'':'open'}"><button>${q[0]}${I('chev',14)}</button><div class="bd"><div><p>${q[1]}</p></div></div></div>`).join('')}</div></div>`,
 init(st){st.querySelectorAll('.m-acc button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));}},
{cat:'comp',ko:'텍스트 필드',en:'Text Field',alias:'입력창, 인풋, 입력 필드',
 desc:'라벨(Label), 입력 영역, 도움말(Helper text), 글자 수(Counter)로 구성돼요. 값이 있으면 지우기(Clear) 버튼이 나타나요.',
 dev:'TextField · clearButtonMode',hint:'입력',
 html:`<div class="app">${bar('프로필 수정','back','')}<div class="m-body"><div class="tf"><label>닉네임</label><div class="w"><input maxlength="20" value="디자이너"><button class="clr">×</button></div><div class="hp"><span>한글·영문 2~20자</span><span class="cnt">4/20</span></div></div><div class="tf"><label>소개</label><div class="w"><input maxlength="20" placeholder="한 줄 소개"><button class="clr">×</button></div><div class="hp"><span>선택 입력</span><span class="cnt">0/20</span></div></div></div></div>`,
 init(st){st.querySelectorAll('.tf').forEach(f=>{const i=f.querySelector('input'),c=f.querySelector('.cnt');const u=()=>{f.classList.toggle('has',!!i.value);c.textContent=`${i.value.length}/20`;};i.oninput=u;f.querySelector('.clr').onclick=()=>{i.value='';u();i.focus();};u();});}},
{cat:'comp',ko:'숫자 키패드',en:'Number Keypad',alias:'PIN 패드, 보안 키패드, 커스텀 키보드',
 desc:'앱이 직접 그리는 숫자 입력판이에요. 간편 비밀번호, 송금 금액 입력에 써요. 입력한 자리는 점으로 채워 보여줘요.',
 dev:'custom keypad · secure entry',hint:'숫자 4개 클릭',
 html:`<div class="app">${bar('','close','')}<div class="m-body"><div class="pin"><b>간편 비밀번호 입력</b><small>숫자 4자리를 눌러주세요</small><div class="pdts">${'<i></i>'.repeat(4)}</div><div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button>${n}</button>`).join('')}<button class="e"></button><button>0</button><button class="e del">⌫</button></div></div></div></div>`,
 init(st,c){let v='';const ds=[...st.querySelectorAll('.pdts i')],w=st.querySelector('.pdts'),sm=st.querySelector('.pin small');const draw=()=>ds.forEach((d,i)=>d.classList.toggle('f',i<v.length));st.querySelectorAll('.kp button').forEach(b=>b.onclick=()=>{if(b.classList.contains('del')){v=v.slice(0,-1);draw();return;}if(!b.textContent||v.length>=4)return;v+=b.textContent;draw();if(v.length===4){w.classList.add('ok');sm.textContent='✓ 확인됐어요';c.after(()=>{v='';w.classList.remove('ok');sm.textContent='숫자 4자리를 눌러주세요';draw();},1400);}});}},

/* ---------- GESTURE ---------- */
{cat:'gesture',ko:'스와이프 액션',en:'Swipe Actions',alias:'밀어서 삭제(Swipe to Delete), 스와이프 메뉴',
 desc:'목록을 옆으로 밀면 뒤에 숨은 버튼(보관·삭제)이 나타나요. 끝까지 밀면 바로 실행되는 방식(Full swipe)도 있어요.',
 dev:'swipeActions · ItemTouchHelper',hint:'행을 왼쪽으로 드래그',
 html:`<div class="app">${bar('메시지','','plus')}<div class="m-body">${Array.from({length:6},(_,i)=>`<div class="swr"><div class="acts"><button style="background:#ff9500">${I('archive',14)}보관</button><button class="del" style="background:#ff3b30">${I('trash',14)}삭제</button></div><div class="fg"><span class="av" style="background:${COL[i%6]}"></span><span class="tx"><b>대화 ${i+1}</b><small>왼쪽으로 밀어보세요</small></span></div></div>`).join('')}</div></div>`,
 init(st,c){const fgs=[];st.querySelectorAll('.swr').forEach(r=>{const fg=r.querySelector('.fg');fgs.push(fg);let x0=null,dx=0,base=0;fg.addEventListener('pointerdown',e=>{x0=e.clientX;fg.setPointerCapture(e.pointerId);fg.style.transition='none';fgs.forEach(o=>{if(o!==fg){o.style.transform='';o._b=0;}});base=fg._b||0;});fg.addEventListener('pointermove',e=>{if(x0===null)return;dx=Math.min(0,Math.max(-150,base+e.clientX-x0));fg.style.transform=`translateX(${dx}px)`;});const end=()=>{if(x0===null)return;x0=null;fg.style.transition='';fg._b=dx<-50?-120:0;fg.style.transform=`translateX(${fg._b}px)`;};fg.addEventListener('pointerup',end);fg.addEventListener('pointercancel',end);r.querySelectorAll('.acts button').forEach(b=>b.onclick=()=>{r.animate([{height:r.offsetHeight+'px',opacity:1},{height:'0px',opacity:0}],{duration:280,easing:'ease-in'}).onfinish=()=>r.remove();});});c.after(()=>{fgs[0].style.transform='translateX(-120px)';fgs[0]._b=-120;},700);c.after(()=>{fgs[0].style.transform='';fgs[0]._b=0;},2000);}},
{cat:'gesture',ko:'당겨서 새로고침',en:'Pull to Refresh',alias:'풀 투 리프레시, 끌어서 새로고침',
 desc:'목록 맨 위에서 아래로 끌어당기면 로딩 표시가 나타나고, 놓으면 새 콘텐츠를 불러와요.',
 dev:'UIRefreshControl · SwipeRefreshLayout',hint:'목록을 아래로 드래그',
 html:`<div class="app">${bar('피드','','bell')}<div class="ptr-wrap"><div class="ptr-ind"><i></i></div><div class="ptr-list">${rows(7,{t:'게시물',chev:false})}</div></div></div>`,
 init(st,c){const L=st.querySelector('.ptr-list'),ind=st.querySelector('.ptr-ind');let y0=null,dy=0,busy=false,n=7;L.addEventListener('pointerdown',e=>{if(busy)return;y0=e.clientY;L.setPointerCapture(e.pointerId);L.style.transition='none';});L.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,(e.clientY-y0)*.5);dy=Math.min(dy,90);L.style.transform=`translateY(${dy}px)`;ind.style.opacity=Math.min(1,dy/50);ind.style.transform=`rotate(${dy*4}deg)`;});const end=()=>{if(y0===null)return;y0=null;L.style.transition='transform .35s cubic-bezier(.2,.9,.3,1)';if(dy>55){busy=true;L.style.transform='translateY(48px)';ind.classList.add('load');c.after(()=>{n++;L.insertAdjacentHTML('afterbegin',`<div class="m-row" style="background:#f3f5ff"><span class="av" style="background:#3d5afe"></span><span class="tx"><b>새 게시물 ${n}</b><small>방금 전</small></span></div>`);L.style.transform='';ind.classList.remove('load');ind.style.opacity=0;busy=false;},1100);}else{L.style.transform='';ind.style.opacity=0;}dy=0;};L.addEventListener('pointerup',end);L.addEventListener('pointercancel',end);}},
{cat:'gesture',ko:'롱프레스',en:'Long Press',alias:'길게 누르기, 컨텍스트 메뉴, 햅틱 터치',
 desc:'항목을 0.5초 정도 길게 누르면 살짝 떠오르며 추가 메뉴가 나타나요. 배경은 흐려져요.',
 dev:'contextMenu · onLongClick',hint:'항목을 꾹 누르기',
 html:`<div class="app">${bar('사진첩','','')}<div class="m-body">${Array.from({length:4},(_,i)=>`<div class="lp-it"><span class="th" style="background:${GR[i]}"></span><span class="tx" style="display:flex;flex-direction:column;gap:3px"><b>앨범 ${i+1}</b><small style="color:var(--muted);font-size:10.5px">${12+i*7}장</small></span></div>`).join('')}</div></div><div class="lp-blur"></div><div class="lp-menu"><a>공유${I('share',13)}</a><a>즐겨찾기${I('heart',13)}</a><a class="dg">삭제${I('trash',13)}</a></div>`,
 init(st){const bl=st.querySelector('.lp-blur'),m=st.querySelector('.lp-menu');let cur=null,t=null;const close=()=>{bl.classList.remove('show');m.classList.remove('show');if(cur){cur.classList.remove('lift','raised');cur=null;}};st.querySelectorAll('.lp-it').forEach(it=>{it.addEventListener('pointerdown',()=>{it.classList.add('hold');t=setTimeout(()=>{it.classList.remove('hold');it.classList.add('lift','raised');cur=it;const sr=st.getBoundingClientRect(),r=it.getBoundingClientRect();let top=r.bottom-sr.top+8;if(top>st.clientHeight-130)top=r.top-sr.top-120;m.style.top=top+'px';bl.classList.add('show');m.classList.add('show');},500);});const cancel=()=>{clearTimeout(t);it.classList.remove('hold');};it.addEventListener('pointerup',cancel);it.addEventListener('pointerleave',cancel);it.addEventListener('contextmenu',e=>e.preventDefault());});bl.onclick=close;m.querySelectorAll('a').forEach(a=>a.onclick=close);}},
{cat:'gesture',ko:'더블 탭',en:'Double Tap',alias:'두 번 탭해서 좋아요, 더블 클릭',
 desc:'사진을 빠르게 두 번 누르면 가운데 큰 하트가 튀어나오며 좋아요가 눌려요. 버튼을 찾지 않아도 되는 지름길 제스처예요.',
 dev:'onDoubleTap · TapGesture(count: 2)',hint:'사진 더블 클릭',
 html:`<div class="app">${bar('피드','','chat')}<div class="m-body"><div style="display:flex;align-items:center;gap:8px;padding:8px 12px"><span style="width:28px;height:28px;border-radius:50%;background:${GR[1]}"></span><b>designer.kim</b></div><div class="dt-photo"><span class="big">${HEART}</span></div><div class="dt-act"><button class="lk-btn hrt">${HEART}</button>${I('chat',20)}${I('send',20)}</div><div style="padding:8px 12px;font-size:11px"><b class="lc">좋아요 128개</b></div></div></div>`,
 init(st){const ph=st.querySelector('.dt-photo'),big=ph.querySelector('.big'),h=st.querySelector('.hrt'),lc=st.querySelector('.lc');let n=128,on=false;const set=v=>{if(on===v)return;on=v;n+=v?1:-1;h.classList.toggle('on',v);lc.textContent=`좋아요 ${n}개`;};ph.addEventListener('dblclick',()=>{set(true);big.animate([{opacity:0,transform:'scale(.3)'},{opacity:1,transform:'scale(1.15)',offset:.25},{opacity:1,transform:'scale(1)',offset:.6},{opacity:0,transform:'scale(1.3) translateY(-20px)'}],{duration:900,easing:'ease-out'});burst(h);});h.onclick=()=>{set(!on);if(on)burst(h);};}},
{cat:'gesture',ko:'드래그 투 디스미스',en:'Drag to Dismiss',alias:'끌어서 닫기, 스와이프 다운 닫기',
 desc:'전체 화면 사진을 아래로 끌면 작아지고 배경이 투명해지면서, 충분히 끌고 놓으면 닫혀요.',
 dev:'interactive dismissal · PanGesture',hint:'사진을 아래로 드래그',
 html:`<div class="app"><div class="dd-re"><button class="m-cta" style="width:auto;padding:0 16px">사진 다시 열기</button></div></div><div class="dd-view"><span class="dd-close">${I('close',20)}</span><div class="dd-img"></div></div>`,
 init(st){const v=st.querySelector('.dd-view'),im=v.querySelector('.dd-img'),ph=st.parentElement;let y0=null,dy=0;const open=()=>{v.style.display='grid';v.style.background='#000';im.style.transform='';ph.classList.add('dark');v.animate([{opacity:0},{opacity:1}],{duration:250});};const close=()=>{im.style.transform=`translateY(${Math.max(dy,0)+300}px) scale(.6)`;v.animate([{background:v.style.background||'#000'},{background:'rgba(0,0,0,0)'}],{duration:300,fill:'forwards'}).onfinish=a=>{v.style.display='none';ph.classList.remove('dark');v.getAnimations().forEach(x=>x.cancel());};};im.addEventListener('pointerdown',e=>{y0=e.clientY;im.setPointerCapture(e.pointerId);im.style.transition='none';});im.addEventListener('pointermove',e=>{if(y0===null)return;dy=e.clientY-y0;const p=Math.min(1,Math.abs(dy)/300);im.style.transform=`translateY(${dy}px) scale(${1-p*.35})`;v.style.background=`rgba(0,0,0,${1-p})`;});const end=()=>{if(y0===null)return;y0=null;im.style.transition='';if(Math.abs(dy)>90)close();else{im.style.transform='';v.style.background='#000';}dy=0;};im.addEventListener('pointerup',end);im.addEventListener('pointercancel',end);v.querySelector('.dd-close').onclick=()=>{dy=0;close();};st.querySelector('.dd-re button').onclick=open;ph.classList.add('dark');}},
{cat:'gesture',ko:'스와이프 카드',en:'Swipe Cards',alias:'틴더 스와이프, 카드 스택, 좌우 넘기기 선택',
 desc:'카드를 오른쪽으로 밀면 좋아요, 왼쪽은 넘기기. 손가락을 따라 기울어지고, 충분히 밀면 날아가며 다음 카드가 나와요.',
 dev:'card stack · PanGesture + rotation',hint:'카드를 좌우로 드래그',
 html:`<div class="app">${bar('오늘의 추천','','')}<div class="sc-stack"></div><div class="sc-btns"><button class="no">✕</button><button class="yes" style="color:#ff3b5c">♥</button></div></div>`,
 init(st){const S=st.querySelector('.sc-stack');const D=[['서울 성수','카페 · 1.2km'],['부산 해운대','바다 · 340km'],['제주 애월','숙소 · 450km'],['강릉 안목','커피거리 · 160km']];let k=0;const make=()=>{const d=D[k%D.length],el=document.createElement('div');el.className='sc-card';el.style.background=GR[k%GR.length];el.innerHTML=`<span class="st like">LIKE</span><span class="st nope">NOPE</span><b>${d[0]}</b><small>${d[1]}</small>`;k++;S.prepend(el);bind(el);};const fly=(el,dir)=>{el.style.transition='transform .4s ease-in';el.style.transform=`translateX(${dir*320}px) rotate(${dir*30}deg)`;setTimeout(()=>{el.remove();make();},380);};const bind=el=>{let x0=null,dx=0;el.addEventListener('pointerdown',e=>{if(el!==S.lastElementChild)return;x0=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none';});el.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/12}deg)`;el.querySelector('.like').style.opacity=Math.max(0,dx/80);el.querySelector('.nope').style.opacity=Math.max(0,-dx/80);});const end=()=>{if(x0===null)return;x0=null;if(Math.abs(dx)>80)fly(el,Math.sign(dx));else{el.style.transition='';el.style.transform='';el.querySelectorAll('.st').forEach(s=>s.style.opacity=0);}dx=0;};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);};for(let i=0;i<3;i++)make();st.querySelector('.no').onclick=()=>fly(S.lastElementChild,-1);st.querySelector('.yes').onclick=()=>fly(S.lastElementChild,1);}},
{cat:'gesture',ko:'엣지 스와이프 백',en:'Edge Swipe Back',alias:'뒤로 가기 제스처, 가장자리 스와이프, 인터랙티브 팝',
 desc:'화면 왼쪽 가장자리에서 오른쪽으로 밀면 이전 화면이 드러나며 뒤로 가요. 손가락을 따라 실시간으로 움직이는 게 핵심이에요.',
 dev:'interactivePopGestureRecognizer · predictive back',hint:'왼쪽 끝(주황)에서 오른쪽으로 드래그',
 html:`<div class="esb"><div class="pa">${bar('목록','','')}<div class="m-body">${rows(7,{t:'항목'})}</div></div><div class="pb">${bar('상세','back','')}<div class="m-body"><div class="det-hero"></div><div class="det-tx"><b>상세 화면</b><span class="m-ln"></span><span class="m-ln" style="width:70%"></span></div></div></div><div class="edge"></div></div>`,
 init(st,c){const A=st.querySelector('.pa'),B=st.querySelector('.pb'),E=st.querySelector('.edge');const W=()=>st.clientWidth;let x0=null,dx=0;const put=x=>{B.style.transform=`translateX(${x}px)`;A.style.transform=`translateX(${-W()*.3+x*.3}px)`;A.style.filter=`brightness(${.7+.3*x/W()})`;};const anim=on=>{B.style.transition=A.style.transition='transform .35s cubic-bezier(.2,.9,.3,1),filter .35s';put(on?0:W());E.style.display=on?'':'none';};const reset=()=>{anim(true);};put(0);E.addEventListener('pointerdown',e=>{x0=e.clientX;E.setPointerCapture(e.pointerId);B.style.transition=A.style.transition='none';});E.addEventListener('pointermove',e=>{if(x0===null)return;dx=Math.max(0,e.clientX-x0);put(dx);});const end=()=>{if(x0===null)return;x0=null;if(dx>W()*.35){anim(false);c.after(reset,1200);}else anim(true);dx=0;};E.addEventListener('pointerup',end);E.addEventListener('pointercancel',end);A.querySelectorAll('.m-row').forEach(r=>r.onclick=reset);B.querySelector('.bi').onclick=()=>{anim(false);c.after(reset,1200);};}},
{cat:'gesture',ko:'핀치 줌',en:'Pinch to Zoom',alias:'두 손가락 확대, 핀치 아웃/인',
 desc:'두 손가락을 벌리면 확대(Pinch out), 모으면 축소(Pinch in)돼요. 사진·지도에서 써요. (데모는 손가락 위치를 자동으로 보여줘요)',
 dev:'MagnificationGesture · ScaleGestureDetector',hint:'자동 재생',
 html:`<div class="app" style="background:#000">${bar('사진','back','share').replace('class="m-bar"','class="m-bar" style="background:#000;color:#fff"')}<div class="pz"><div class="img"></div><i class="f f1"></i><i class="f f2"></i></div></div>`,dark:true},
{cat:'gesture',ko:'드래그 정렬',en:'Drag to Reorder',alias:'순서 변경, 소터블 리스트, 재정렬',
 desc:'오른쪽 핸들(≡)을 잡고 위아래로 끌어 순서를 바꿔요. 잡은 항목은 살짝 떠오르며 그림자가 생겨요.',
 dev:'onMove · ItemTouchHelper · reorderable',hint:'≡ 핸들 드래그',
 html:`<div class="app">${bar('즐겨찾기 편집','close','')}<div class="m-body"><div class="ro-list">${['리서치','와이어프레임','디자인 시안','프로토타입','개발 전달'].map((t,i)=>`<div class="ro-it"><span class="n">${i+1}</span><span style="flex:1">${t}</span><span class="hd">≡</span></div>`).join('')}</div></div></div>`,
 init(st){const L=st.querySelector('.ro-list');const num=()=>L.querySelectorAll('.ro-it').forEach((x,i)=>x.querySelector('.n').textContent=i+1);L.querySelectorAll('.hd').forEach(h=>{const it=h.parentElement;let act=false;h.addEventListener('pointerdown',e=>{act=true;h.setPointerCapture(e.pointerId);it.classList.add('drag');});h.addEventListener('pointermove',e=>{if(!act)return;const sib=[...L.querySelectorAll('.ro-it')].filter(x=>x!==it);const nxt=sib.find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2;});const before=L.querySelectorAll('.ro-it');const firstRects=new Map([...before].map(x=>[x,x.getBoundingClientRect().top]));if(nxt){if(nxt.previousElementSibling!==it)L.insertBefore(it,nxt);}else if(L.lastElementChild!==it)L.appendChild(it);[...L.querySelectorAll('.ro-it')].forEach(x=>{if(x===it)return;const d=firstRects.get(x)-x.getBoundingClientRect().top;if(d)x.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:180,easing:'ease-out'});});num();});const end=()=>{act=false;it.classList.remove('drag');};h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);});}},
{cat:'gesture',ko:'밀어서 확인',en:'Slide to Confirm',alias:'슬라이드 투 언락, 밀어서 결제, 스와이프 버튼',

 html:`<div class="app">${bar('홈','','search')}<div class="m-body">${['지금 뜨는 콘텐츠','최근 본 상품','추천 브랜드'].map((t,k)=>`<div class="shelf"><h4>${t}<small>전체보기 ›</small></h4><div class="row ${k===1?'wide':''}">${Array.from({length:7},(_,i)=>`<div style="background:${GR[(i+k)%6]}"></div>`).join('')}</div></div>`).join('')}<div style="height:30px"></div></div></div>`,
 init(st){st.querySelectorAll('.shelf .row').forEach(r=>dragScroll(r,'x'));}},
{cat:'scroll',ko:'맨 위로 버튼',en:'Scroll to Top',alias:'탑 버튼, 상태 표시줄 탭',
 desc:'어느 정도 스크롤하면 나타나고, 누르면 맨 위로 올라가요. iOS는 상단 상태 표시줄을 탭해도 맨 위로 가요.',
 dev:'scrollTo(top) · scrollsToTop',hint:'스크롤 후 ↑ 클릭',
 html:`<div class="app">${bar('목록','','')}<div class="m-body">${rows(16,{t:'항목'})}</div></div><button class="btt">${I('up',18)}</button>`,
 init(st){const b=st.querySelector('.m-body'),t=st.querySelector('.btt');b.addEventListener('scroll',()=>t.classList.toggle('show',b.scrollTop>120),{passive:true});t.onclick=()=>b.scrollTo({top:0,behavior:'smooth'});}},
{cat:'scroll',ko:'스크롤 리빌',en:'Scroll Reveal',alias:'스크롤 등장, 인뷰 애니메이션',
 desc:'카드가 화면에 들어올 때 아래에서 떠오르며 나타나요. 모바일에서는 짧고 가볍게(200~400ms) 쓰는 게 좋아요.',
 dev:'onAppear · IntersectionObserver',hint:'스크롤',
 html:`<div class="app">${bar('매거진','','')}<div class="m-body">${cards(8).replace(/class="m-card"/g,'class="m-card rv"')}</div></div>`,
 init(st){const b=st.querySelector('.m-body');const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('in',e.isIntersecting)),{root:b,threshold:.2});b.querySelectorAll('.rv').forEach(x=>io.observe(x));}},
{cat:'scroll',ko:'확장형 FAB',en:'Extended FAB',alias:'라벨 FAB, 축소되는 플로팅 버튼',
 desc:'아이콘과 글자가 함께 있는 플로팅 버튼이에요. 아래로 스크롤하면 아이콘만 남도록 줄어들고, 위로 올리면 다시 늘어나요.',
 dev:'ExtendedFloatingActionButton(expanded)',hint:'스크롤',
 html:`<div class="app">${bar('커뮤니티','','search')}<div class="m-body">${rows(14,{t:'글',s:'댓글 12 · 좋아요 40'})}</div></div><button class="efab">${I('pen',17)}<span>글쓰기</span></button>`,
 init(st){const b=st.querySelector('.m-body'),f=st.querySelector('.efab');let last=0;b.addEventListener('scroll',()=>{const y=b.scrollTop;if(Math.abs(y-last)<3)return;f.classList.toggle('mini',y>last&&y>20);last=y;},{passive:true});}},

/* ---------- FEEDBACK ---------- */
{cat:'feedback',ko:'스켈레톤 UI',en:'Skeleton',alias:'스켈레톤 로딩, 고스트 UI, 쉬머(Shimmer)',
 desc:'콘텐츠가 올 자리에 회색 뼈대를 먼저 보여줘요. 위를 지나가는 빛은 쉬머(Shimmer)라고 해요. 스피너보다 덜 기다리는 느낌을 줘요.',
 dev:'redacted(.placeholder) · Shimmer',hint:'자동 반복',
 html:`<div class="app">${bar('피드','','bell')}<div class="skw"><div class="sk">${[0,1].map(()=>`<div class="fc"><div class="hd"><span class="av"></span><span class="t"><span class="m-ln" style="width:50%"></span><span class="m-ln" style="width:30%"></span></span></div><div class="im"></div></div>`).join('')}</div><div class="real">${[0,1].map(i=>`<div class="fc"><div class="hd"><span class="av" style="background:${GR[i]}"></span><span class="t"><b>creator_${i+1}</b><small style="color:var(--muted);font-size:10px">방금 전</small></span></div><div class="im" style="background:${GR[i+2]}"></div></div>`).join('')}</div></div></div>`,
 init(st,c){const w=st.querySelector('.skw');c.every(()=>w.classList.toggle('loaded'),2200);}},
{cat:'feedback',ko:'액티비티 인디케이터',en:'Activity Indicator',alias:'스피너, 로딩 인디케이터, 프로그레스 인디케이터',
 desc:'끝을 알 수 없는 대기를 표시해요. iOS는 회전하는 살(Spokes), Android는 늘었다 줄었다 하는 원형 선이 기본이에요.',
 dev:'ProgressView() · CircularProgressIndicator',hint:'자동 재생',
 html:`<div class="app">${bar('로딩','back','')}<div class="ai-wrap"><div><span class="ios-sp"></span>iOS · Activity Indicator</div><div><svg class="md-sp" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20"/></svg>Android · Circular</div><div><span class="lin"><i></i></span>Linear · Indeterminate</div></div></div>`,
 init(st){const s=st.querySelector('.ios-sp');for(let i=0;i<8;i++){const x=document.createElement('i');x.style.transform=`rotate(${i*45}deg)`;x.style.animationDelay=(-1+i/8)+'s';s.appendChild(x);}}},
{cat:'feedback',ko:'리플 효과',en:'Ripple',alias:'잉크 효과, 터치 피드백(Android)',
 desc:'누른 위치에서 물결이 퍼져 나가요. Android(머티리얼)의 기본 터치 반응이에요.',
 dev:'Modifier.clickable · ripple',hint:'항목 클릭',
 html:`<div class="app">${bar('설정','back','')}<div class="m-body rpl">${rows(8,{t:'메뉴'})}</div></div>`,
 init(st){st.querySelectorAll('.rpl .m-row').forEach(r=>r.addEventListener('pointerdown',e=>ripple(r,e)));}},
{cat:'feedback',ko:'탭 하이라이트',en:'Tap Highlight',alias:'눌림 상태, 셀 하이라이트, Pressed state(iOS)',
 desc:'누르는 동안 행 배경이 회색으로 바뀌었다가 떼면 서서히 돌아와요. iOS 목록의 기본 터치 반응이에요.',
 dev:'UITableViewCell selectionStyle · isPressed',hint:'항목 누르기',
 html:`<div class="app">${bar('연락처','','plus')}<div class="m-body hlt">${rows(8,{t:'연락처'})}</div></div>`,
 init(st){st.querySelectorAll('.hlt .m-row').forEach(r=>{r.addEventListener('pointerdown',()=>r.classList.add('hl'));['pointerup','pointerleave','pointercancel'].forEach(ev=>r.addEventListener(ev,()=>r.classList.remove('hl')));});}},
{cat:'feedback',ko:'오프라인 배너',en:'Offline Banner',alias:'네트워크 상태 배너, 연결 끊김 알림',
 desc:'인터넷 연결이 끊기면 상단에 배너가 나타나고, 다시 연결되면 초록색으로 바뀌었다 사라져요.',
 dev:'NWPathMonitor · ConnectivityManager',hint:'버튼 클릭',
 html:`<div class="app">${bar('홈','','bell')}<div class="m-body">${cards(2)}<div class="m-pad"><button class="m-cta dark tg">${I('wifi',15)}연결 끊어보기</button></div></div></div><div class="offb">${I('wifi',13)}<span>오프라인 상태예요</span></div>`,
 init(st,c){const b=st.querySelector('.offb'),t=st.querySelector('.tg'),s=b.querySelector('span');let off=false;t.onclick=()=>{off=!off;if(off){b.classList.remove('ok');s.textContent='오프라인 상태예요';b.classList.add('show');t.innerHTML=I('wifi',15)+'다시 연결하기';}else{b.classList.add('ok');s.textContent='다시 연결됐어요';t.innerHTML=I('wifi',15)+'연결 끊어보기';c.after(()=>{if(!off)b.classList.remove('show');},1500);}};}},
{cat:'feedback',ko:'인라인 검증',en:'Inline Validation',alias:'실시간 유효성 검사, 입력 오류 표시',
 desc:'입력하는 동안 바로 맞는지 알려줘요. 틀리면 빨간 테두리와 문구, 맞으면 초록 표시. 모든 조건을 만족해야 버튼이 활성화돼요.',
 dev:'onChange validation · error state',hint:'입력해 보기',
 html:`<div class="app">${bar('회원가입','back','')}<div class="m-body iv"><div class="f fe"><label>이메일</label><input placeholder="name@mail.com"><div class="msg"></div></div><div class="f fp"><label>비밀번호</label><input type="password" placeholder="8자 이상"><ul class="rules"><li class="r1">✓ 8자 이상</li><li class="r2">✓ 숫자 포함</li><li class="r3">✓ 영문 포함</li></ul></div></div><div class="m-pad" style="padding-bottom:28px"><button class="m-cta go" disabled>가입하기</button></div></div>`,
 init(st){const fe=st.querySelector('.fe'),fp=st.querySelector('.fp'),ei=fe.querySelector('input'),pi=fp.querySelector('input'),m=fe.querySelector('.msg'),go=st.querySelector('.go');const chk=()=>{const ev=ei.value,ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ev);fe.classList.toggle('bad',!!ev&&!ok);fe.classList.toggle('good',ok);m.textContent=!ev?'':ok?'사용할 수 있는 이메일이에요':'이메일 형식이 올바르지 않아요';const p=pi.value,r=[p.length>=8,/\d/.test(p),/[a-zA-Z]/.test(p)];r.forEach((v,i)=>fp.querySelector('.r'+(i+1)).classList.toggle('ok',v));go.disabled=!(ok&&r.every(Boolean));};ei.oninput=chk;pi.oninput=chk;}},
{cat:'feedback',ko:'완료 화면',en:'Success Screen',alias:'결과 화면, 완료 페이지, 성공 피드백',
 desc:'주문·가입처럼 중요한 작업이 끝났을 때 보여주는 화면이에요. 체크 애니메이션과 다음 행동 버튼을 함께 둬요.',
 dev:'Lottie · stroke animation',hint:'↻ 재생',
 html:`<div class="app"><div class="okscr"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34"/><path d="M25 41 l10 10 l20 -22"/></svg><b>주문이 완료됐어요</b><p>내일(화) 도착 예정이에요</p><button class="m-cta">주문 내역 보기</button></div></div>`},
{cat:'feedback',ko:'빈 화면',en:'Empty State',alias:'엠티 스테이트, 데이터 없음, 제로 스테이트',
 desc:'보여줄 내용이 없을 때의 화면이에요. 일러스트, 이유를 알려주는 문구, 다음 행동 버튼(CTA)으로 구성해요.',
 dev:'ContentUnavailableView · EmptyView',
 html:`<div class="app">${bar('찜 목록','','')}<div class="m-body"><div class="emp"><svg viewBox="0 0 64 64" fill="none" stroke="#b6b4ad" stroke-width="2.5" stroke-linejoin="round"><path d="M32 54s-20-12-24-24C5 21 11 12 20 12c5 0 9 3 12 7 3-4 7-7 12-7 9 0 15 9 12 18-4 12-24 24-24 24z"/></svg><b>아직 찜한 상품이 없어요</b><p>마음에 드는 상품의 ♡를 눌러<br>여기에 모아보세요</p><button class="m-cta">상품 둘러보기</button></div></div>${tabbar(2)}</div>`},
{cat:'feedback',ko:'로딩 버튼',en:'Loading Button',alias:'비동기 버튼, 상태 버튼',
 desc:'누르면 버튼 안에 로딩 표시가 나타나고, 끝나면 완료로 바뀌어요. 처리 중에는 다시 눌리지 않게 막아요.',
 dev:'isLoading · disabled',hint:'버튼 클릭',
 html:`<div class="app">${bar('프로필 수정','back','')}<div class="m-body"><div class="tf"><label>이름</label><div class="w"><input value="김디자인"></div></div><div class="tf"><label>소개</label><div class="w"><input value="Product Designer"></div></div></div></div><div class="lbw"><button class="m-cta">저장하기</button></div>`,
 init(st,c){const b=st.querySelector('.lbw .m-cta');let s=0;b.onclick=()=>{if(s)return;s=1;b.classList.add('loading');b.innerHTML='<i class="sp"></i>저장 중…';c.after(()=>{b.classList.remove('loading');b.classList.add('done');b.innerHTML=I('check',15)+'저장 완료';c.after(()=>{b.classList.remove('done');b.textContent='저장하기';s=0;},1500);},1500);};}},
{cat:'feedback',ko:'좋아요 애니메이션',en:'Like Animation',alias:'하트 팝, 파티클 버스트',
 desc:'하트를 누르면 쪼그라들었다 커지며 작은 파티클이 터져요. 숫자도 함께 바뀌어요.',
 dev:'Lottie · scale keyframes',hint:'♡ 클릭',
 html:`<div class="app">${bar('피드','','')}<div class="m-body">${[0,1].map(i=>`<div class="fc"><div class="hd"><span class="av" style="background:${GR[i]}"></span><span class="t"><b>creator_${i+1}</b></span></div><div class="im" style="background:${GR[i+3]}"></div><div style="display:flex;align-items:center;gap:6px;margin-top:8px"><button class="lk-btn">${HEART}</button><span class="n" style="font-size:11px;font-weight:700">${120+i*30}</span></div></div>`).join('')}</div></div>`,
 init(st){st.querySelectorAll('.lk-btn').forEach(b=>{const n=b.nextElementSibling;b.onclick=()=>{const on=b.classList.toggle('on');n.textContent=+n.textContent+(on?1:-1);if(on)burst(b);};});}},
{cat:'feedback',ko:'햅틱 피드백',en:'Haptic Feedback',alias:'진동 피드백, 탭틱, 햅틱 터치',
 desc:'스위치를 켜거나 중요한 행동을 했을 때 짧은 진동으로 손끝에 반응을 줘요. 강도(Light·Medium·Heavy)와 종류(Success·Error)를 지정해요. (화면에서는 흔들림으로 표현)',
 dev:'UIImpactFeedbackGenerator · HapticFeedback',hint:'스위치 클릭',
 html:`<div class="app ios-bg">${bar('설정','back','')}<div class="m-body"><div class="m-sec">햅틱</div><div class="grpl">${[['진동 모드','Light Impact',1],['키보드 햅틱','Selection',0],['결제 완료 알림','Success',0]].map(([t,k,v])=>`<div class="r" data-k="${k}"><span class="l">${t}</span><label class="m-sw"><input type="checkbox" ${v?'checked':''}><span></span></label></div>`).join('')}</div></div></div><span class="hp-tag"></span>`,
 init(st,c){const ph=st.parentElement,tag=st.querySelector('.hp-tag');let h;st.querySelectorAll('.grpl .r').forEach(r=>{r.querySelector('input').addEventListener('change',()=>{ph.classList.remove('buzz');void ph.offsetWidth;ph.classList.add('buzz');const sw=r.querySelector('.m-sw'),sr=st.getBoundingClientRect(),rr=sw.getBoundingClientRect(),ring=document.createElement('span');ring.className='hp-ring';ring.style.left=(rr.left-sr.left+rr.width/2-15)+'px';ring.style.top=(rr.top-sr.top+rr.height/2-15)+'px';st.appendChild(ring);ring.addEventListener('animationend',()=>ring.remove());tag.textContent='Haptic · '+r.dataset.k;tag.classList.add('show');clearTimeout(h);h=setTimeout(()=>tag.classList.remove('show'),1200);});});}},
{cat:'feedback',ko:'업로드 진행',en:'Upload Progress',alias:'전송 진행률, 파일 업로드 상태',
 desc:'파일마다 진행 막대와 퍼센트를 보여주고, 끝나면 체크로 바뀌어요. 여러 개를 동시에 올릴 때 써요.',
 dev:'URLSession progress · WorkManager',hint:'자동 재생',
 html:`<div class="app">${bar('업로드','close','')}<div class="m-body">${['IMG_2041.jpg','IMG_2042.jpg','영상_0312.mp4','문서_최종.pdf'].map((t,i)=>`<div class="up-row"><span class="th" style="background:${GR[i]}"></span><span class="tx"><b>${t}</b><span class="bar"><i></i></span></span><span class="st">0%</span></div>`).join('')}</div></div>`,
 init(st,c){const rs=[...st.querySelectorAll('.up-row')];const sp=[1.4,.9,.45,1.1];let t0;c.raf(t=>{if(t0===undefined)t0=t;let all=true;rs.forEach((r,i)=>{const p=Math.min(100,(t-t0)/1000*35*sp[i]);r.querySelector('.bar i').style.width=p+'%';const s=r.querySelector('.st');if(p>=100){r.classList.add('done');s.textContent='완료';}else{all=false;s.textContent=Math.floor(p)+'%';}});return !all;});}},

/* ---------- SCREENS ---------- */
{cat:'screen',ko:'스플래시',en:'Splash Screen',alias:'런치 스크린, 시작 화면, 로딩 화면',
 desc:'앱을 켤 때 잠깐 보이는 첫 화면이에요. 보통 로고만 두고, 준비가 끝나면 홈으로 자연스럽게 넘어가요.',
 dev:'LaunchScreen · SplashScreen API',hint:'↻ 재생',
 html:`<div class="app">${bar('홈','','bell')}<div class="m-body">${cards(3)}</div>${tabbar(0)}</div><div class="spl"><b>MyApp</b></div>`,
 init(st,c){c.after(()=>st.querySelector('.spl').classList.add('out'),1800);}},
{cat:'screen',ko:'온보딩',en:'Onboarding',alias:'워크스루(Walkthrough), 튜토리얼, 앱 소개 화면',
 desc:'처음 앱을 연 사용자에게 핵심 가치를 2~4장으로 소개해요. 건너뛰기, 페이지 점, 시작하기 버튼으로 구성돼요.',
 dev:'PageView · ViewPager + indicator',hint:'좌우 드래그 · 다음 클릭',
 html:`<div class="ob"><span class="skip">건너뛰기</span><div class="slides">${[['쉽게 기록하고','하루를 간단히 남겨보세요'],['함께 나누고','친구들과 순간을 공유해요'],['다시 꺼내 봐요','소중한 기억을 모아 보여드려요']].map((s,i)=>`<section><div class="il" style="background:${GR[i]}"></div><h3>${s[0]}</h3><p>${s[1]}</p></section>`).join('')}</div><div class="pdots"><i class="on"></i><i></i><i></i></div><div class="bt"><button class="m-cta nx">다음</button></div></div>`,
 init(st){const s=st.querySelector('.slides'),ds=[...st.querySelectorAll('.pdots i')],nx=st.querySelector('.nx');const idx=()=>Math.round(s.scrollLeft/s.clientWidth);s.addEventListener('scroll',()=>{const i=idx();ds.forEach((d,j)=>d.classList.toggle('on',j===i));nx.textContent=i===2?'시작하기':'다음';},{passive:true});nx.onclick=()=>{const i=idx();s.scrollTo({left:((i+1)%3)*s.clientWidth,behavior:'smooth'});};st.querySelector('.skip').onclick=()=>s.scrollTo({left:2*s.clientWidth,behavior:'smooth'});dragScroll(s,'x',()=>s.clientWidth);}},
{cat:'screen',ko:'로그인',en:'Login',alias:'로그인 화면, 사인인, 간편 로그인',
 desc:'아이디·비밀번호 입력과 함께 SNS 간편 로그인 버튼을 둬요. 하단엔 회원가입·계정 찾기 링크를 배치해요.',
 dev:'AuthenticationServices · OAuth',
 html:`<div class="lg"><div class="lo">MyApp</div><input placeholder="이메일"><input type="password" placeholder="비밀번호"><button class="m-cta" style="margin-top:4px">로그인</button><div class="or">또는</div><span class="sns" style="background:#fee500;color:#191919">카카오로 계속하기</span><span class="sns" style="background:#111;color:#fff">Apple로 계속하기</span><span class="sns" style="border-color:#dddbd4">Google로 계속하기</span><div class="links"><span>회원가입</span><span>·</span><span>계정 찾기</span></div></div>`},
{cat:'screen',ko:'권한 요청',en:'Permission Request',alias:'시스템 권한 팝업, 사전 안내(Pre-permission)',
 desc:'알림·위치·카메라 등을 쓰기 전에 운영체제가 띄우는 허용 창이에요. 거절률을 줄이려고 먼저 앱 화면으로 이유를 설명(사전 안내)하기도 해요.',
 dev:'requestAuthorization · requestPermissions',hint:'버튼 클릭',
 html:`<div class="app"><div class="perm-bg">${bar('홈','','bell')}${cards(3)}</div></div><div class="m-dim show"></div><div class="m-alert show"><b>'MyApp'에서 알림을<br>보내고자 합니다</b><p>경고, 사운드 및 아이콘 배지가 알림에 포함될 수 있습니다.</p><div class="bt"><a>허용 안 함</a><a class="pr">허용</a></div></div>`,
 init(st,c){const a=st.querySelector('.m-alert'),d=st.querySelector('.m-dim');a.querySelectorAll('a').forEach(x=>x.onclick=()=>{a.classList.remove('show');d.classList.remove('show');c.after(()=>{a.classList.add('show');d.classList.add('show');},1500);});}},
{cat:'screen',ko:'홈 피드',en:'Home Feed',alias:'메인 화면, 타임라인, 스토리 + 피드',
 desc:'앱의 첫 화면이에요. 상단 로고·알림, 스토리처럼 가로로 넘기는 영역, 세로로 이어지는 콘텐츠 피드, 하단 탭 바로 구성돼요.',
 dev:'LazyColumn · UICollectionView',hint:'스크롤',
 html:`<div class="app"><div class="m-bar"><b style="font-size:16px;font-weight:900">MyApp</b><span style="display:flex;gap:10px">${I('heart')}${I('chat')}</span></div><div class="feed-st">${GR.concat(GR).map(g=>`<span><i style="background:${g}"></i></span>`).join('')}</div><div class="m-body">${[0,1,2].map(i=>`<div class="fc"><div class="hd"><span class="av" style="background:${GR[i]}"></span><span class="t"><b>creator_${i+1}</b></span>${I('more',16)}</div><div class="im" style="background:${GR[i+2]}"></div></div>`).join('')}</div>${tabbar(0)}</div>`,
