<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[SD] 사이트 용어정리 · MO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#131313;--panel:#1b1b1b;--card:#1d1d1d;--ink:#ededed;--on-ink:#131313;--muted:#9a9a9a;--line:#2a2a2a;--soft:#242424;--accent:#8e93ff;--accent-d:#7a80f5;--accent-2:#ff8a65;--ios:#3d8bff;--mono:'JetBrains Mono',ui-monospace,monospace}
/* ================= shell v4 (simple · rounded) ================= */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

button{font-family:inherit}
.side{position:sticky;top:12px;height:calc(100vh - 24px);background:var(--panel);border-radius:28px;padding:22px 16px 16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.brand{font-size:17px;font-weight:800;letter-spacing:-.02em;padding:2px 8px 4px;color:#fff;white-space:nowrap}
.mode{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:99px;padding:4px}
.mode::before{content:'';position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:99px;background:#ededed;transition:transform .35s cubic-bezier(.3,1.2,.5,1)}
.mode.mo::before{transform:translateX(100%)}
.mode.go.pc::before{transform:translateX(100%)}.mode.go.mo::before{transform:none}
.mode a{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:99px;text-decoration:none;font-size:12.5px;font-weight:700;color:#9a9a9a;transition:color .2s}
.mode a svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.mode a:hover{color:#fff}
.mode a.on{color:#131313;cursor:default}
.mode.go a.on{color:#9a9a9a}.mode.go a:not(.on){color:#131313}
.search input{width:100%;height:42px;border-radius:99px;border:0;background:var(--soft);color:#fff;padding:0 18px;font:inherit;font-size:13px;outline:none;transition:box-shadow .2s}
.search input::placeholder{color:#777}
.search input:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
#nav{display:flex;flex-direction:column;gap:4px;overflow:auto;margin:0 -4px;padding:0 4px;scrollbar-width:none;flex:1}
#nav::-webkit-scrollbar{display:none}
#nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;color:#b8b8b8;font-size:13.5px;font-weight:500;padding:10px 10px 10px 14px;border-radius:99px;cursor:pointer;text-align:left;transition:background .15s,color .15s;white-space:nowrap}
#nav button:hover{background:var(--soft);color:#fff}
#nav button .c{font-size:11px;font-weight:700;background:var(--soft);color:#9a9a9a;border-radius:99px;padding:3px 9px;min-width:30px;text-align:center}
#nav button.on{background:#ededed;color:#131313;font-weight:700}
#nav button.on .c{background:#131313;color:#fff}
.side-foot{margin:0;font-size:11px;line-height:1.6;color:#777;padding:0 8px}
main{min-width:0;padding:10px 6px 40px}
.top{padding:14px 10px 22px}
.top .h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;color:#fff}
.top .cnt{font-size:12px;font-weight:700;background:var(--soft);color:#bdbdbd;border-radius:99px;padding:5px 12px}
.top .d{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.65;max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border-radius:30px;padding:8px;display:flex;flex-direction:column;min-width:0}
.stage{position:relative;height:280px;border-radius:24px;overflow:hidden;isolation:isolate}
.stage .hint{position:absolute;left:12px;top:12px;z-index:50;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:99px;pointer-events:none;backdrop-filter:blur(6px)}
.stage .replay{position:absolute;right:12px;top:12px;z-index:50;width:34px;height:34px;border-radius:50%;border:0;font-size:15px;cursor:pointer;opacity:0;transform:scale(.9);transition:opacity .2s,transform .2s;display:grid;place-items:center}
.card:hover .replay,.replay:focus-visible{opacity:1;transform:none}
.stage .replay{right:43px;width:27px;height:27px;font-size:12px}
.stage .fav{transition:opacity .2s,transform .15s,color .2s}
.stage .fav{position:absolute;right:12px;top:12px;z-index:50;width:27px;height:27px;opacity:0;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:#fff;color:#b5b3ab;box-shadow:0 2px 8px rgba(0,0,0,.12);transition:transform .15s,color .2s}
.card:hover .fav,.fav:focus-visible,.stage .fav.on{opacity:1}
@media (hover:none){.stage .fav{opacity:1}}
.stage .fav:hover{color:#16161a;transform:scale(1.06)}
.stage .fav svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.stage .fav.on{color:#ffb020}.stage .fav.on svg{fill:currentColor}
.stage .fav.pop{animation:favpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes favpop{0%{transform:scale(.7)}100%{transform:scale(1)}}
#nav button .fv{display:inline-flex;align-items:center;gap:7px}
#nav button .fv svg{width:14px;height:14px;fill:#ffb020;stroke:none}
.syncs{display:inline-flex;gap:6px;margin-left:4px}
.syncs button{height:30px;border:0;border-radius:99px;padding:0 12px;font-size:12px;font-weight:700;cursor:pointer;background:var(--soft);color:#e5e5e5}
.syncs button:hover{background:#2e2e2e}
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;display:none;align-items:center;justify-content:center;padding:20px}
.dlg-bg.show{display:flex}
.dlg{width:440px;max-width:100%;background:var(--panel);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.dlg h4{margin:0;font-size:17px;color:#fff}
.dlg p{margin:0;font-size:13px;line-height:1.6;color:#a8a8a8}
.dlg textarea{width:100%;height:110px;resize:none;border:0;border-radius:18px;background:var(--soft);color:#fff;padding:14px;font:12px/1.5 var(--mono);outline:none;word-break:break-all}
.dlg textarea:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.dlg .row{display:flex;gap:6px;justify-content:flex-end}
.info{position:relative;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);color:#cfcfcf;font-size:12px;font-weight:800;cursor:help;outline:none}
.info:hover,.info:focus{background:#ededed;color:#131313}
.info .tip{position:absolute;left:0;top:32px;width:330px;max-width:calc(100vw - 40px);background:#ededed;color:#131313;border-radius:18px;padding:14px 16px;font-size:12.5px;font-weight:500;line-height:1.6;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);opacity:0;transform:translateY(-4px);pointer-events:none;transition:.18s;z-index:100;text-align:left;cursor:default}
.info:hover .tip,.info:focus .tip{opacity:1;transform:none;pointer-events:auto}
.info .tip b{display:block;font-size:13px;margin-bottom:4px}
.info .tip ul{margin:6px 0 0;padding-left:16px}
.info .tip li{margin:2px 0}
@media (hover:none){.stage .replay{opacity:1;transform:none}}
.meta{padding:14px 12px 8px;display:flex;flex-direction:column;gap:8px;flex:1}
.names{display:flex;align-items:center;justify-content:space-between;gap:10px}
.names h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.names .en{flex:none;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600;color:#c9c9c9;background:var(--soft);border-radius:99px;padding:4px 10px}
.cattag{align-self:flex-start;font-size:10.5px;font-weight:700;color:var(--accent);background:rgba(142,147,255,.12);border-radius:99px;padding:3px 9px}
.desc{margin:0;font-size:13px;line-height:1.6;color:#a8a8a8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .desc{-webkit-line-clamp:unset}
.more{display:none;flex-direction:column;gap:6px}
.card.open .more{display:flex}
.more .box{background:var(--soft);border-radius:16px;padding:10px 12px;font-size:12px;line-height:1.55;color:#cfcfcf}
.more .box b{display:block;font-size:10.5px;color:#8a8a8a;font-weight:600;margin-bottom:2px}
.more .box code{font-family:var(--mono);font-size:11.5px;color:#d6d8ff;word-break:break-all}
.foot{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.btn{height:38px;border-radius:99px;border:0;padding:0 16px;font-size:12.5px;font-weight:700;cursor:pointer;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--soft);color:#e5e5e5}.btn.sec:hover{background:#2e2e2e}
.btn.pri{background:#ededed;color:#131313;margin-left:auto}.btn.pri:hover{background:#fff}
.empty-res{color:var(--muted);padding:40px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#ededed;color:#131313;font-size:13px;font-weight:600;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:999;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){
 body{grid-template-columns:1fr!important;padding:8px}
 .side{position:static;height:auto;padding:16px 12px 12px;border-radius:24px}
 #nav{flex-direction:row;overflow-x:auto;flex:none}
 #nav button{flex:none}
 .side-foot{display:none}
 .grid{grid-template-columns:1fr}
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ---------- Phone ---------- */
.ph{position:relative;width:220px;height:452px;border-radius:36px;background:#141418;padding:7px;box-shadow:0 24px 40px -22px rgba(0,0,0,.55),inset 0 0 0 1.5px #3a3a42;flex:none}
.ph.buzz{animation:buzz .32s linear}
@keyframes buzz{20%{transform:translateX(-2px) rotate(-.6deg)}40%{transform:translateX(2px) rotate(.6deg)}60%{transform:translateX(-1.5px)}80%{transform:translateX(1.5px)}}
.ph-scr{position:absolute;inset:7px;border-radius:29px;overflow:hidden;background:#fff;font-size:12px;isolation:isolate}
.ph-sb{position:absolute;top:7px;left:7px;right:7px;height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 20px 0 22px;font-size:10.5px;font-weight:700;z-index:40;pointer-events:none;color:#111}
.ph-sb svg{fill:currentColor}
.ph.dark .ph-sb{color:#fff}
.ph-island{position:absolute;top:14px;left:50%;width:62px;height:18px;margin-left:-31px;background:#000;border-radius:12px;z-index:41;transition:all .45s cubic-bezier(.3,1.3,.5,1);display:flex;align-items:center;justify-content:space-between;padding:0 8px;color:#fff;font-size:9px;font-weight:700;overflow:hidden}
.ph-island span{opacity:0;transition:opacity .2s;white-space:nowrap}
.ph-island.big{width:150px;margin-left:-75px;height:30px;top:12px;border-radius:16px}
.ph-island.big span{opacity:1;transition-delay:.2s}
.ph-hi{position:absolute;bottom:14px;left:50%;width:76px;height:4px;margin-left:-38px;border-radius:3px;background:#111;z-index:41;pointer-events:none}
.ph.dark .ph-hi{background:#fff}

/* ---------- App primitives ---------- */
.ic{flex:none;display:block}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;padding-top:26px}
.m-bar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:13px;font-weight:700;flex:none;background:#fff;position:relative;z-index:3}
.m-bar .t{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
.m-bar .bi{width:28px;height:28px;display:grid;place-items:center;cursor:pointer;border-radius:8px}
.m-bar .bi:active{background:#f0efea}
.m-body{flex:1;overflow:auto;position:relative;scrollbar-width:none;overscroll-behavior:contain}
.m-body::-webkit-scrollbar{display:none}
.m-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #f1f0eb;background:#fff;cursor:pointer;position:relative;overflow:hidden}
.m-row .av{width:32px;height:32px;border-radius:50%;background:#dfe4ff;flex:none}
.m-row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.m-row .tx small{color:var(--muted);font-size:10.5px}
.m-row .ic{color:#b6b4ad}
.m-card{margin:10px 12px;border-radius:14px;background:#f4f3ef;padding:10px;display:flex;flex-direction:column;gap:7px}
.m-card .im{height:74px;border-radius:10px}
.m-ln{display:block;height:6px;border-radius:3px;background:#e4e2db}
.m-cta{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:42px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:transform .15s,background .2s,opacity .2s}
.m-cta:active{transform:scale(.97)}
.m-cta.dark{background:var(--ink)}
.m-cta.ghost{background:#f1f0ec;color:var(--ink)}
.m-cta:disabled{background:#d6d4cd;color:#fff;cursor:not-allowed}
.m-tabbar{height:58px;flex:none;display:flex;border-top:1px solid #efeee9;background:rgba(255,255,255,.96);padding-bottom:12px;position:relative;z-index:4}
.m-tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;color:#a9a8a1;cursor:pointer;position:relative}
.m-tabbar button.on{color:var(--ink);font-weight:700}
.m-tabbar.abs{position:absolute;left:0;right:0;bottom:0;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.m-tabbar.abs.hide{transform:translateY(100%)}
.m-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:99px;background:#f1f0ec;font-size:11px;margin:3px 3px 0 0;cursor:pointer;white-space:nowrap;border:1px solid transparent;transition:.2s}
.m-chip.on{background:var(--ink);color:#fff}
.m-dim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.m-dim.show{opacity:1;pointer-events:auto}
.m-sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:8px 14px 28px;transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.3,1);z-index:21;touch-action:none}
.m-sheet.show{transform:none}
.m-sheet .sh-t{display:block;font-size:14px;margin:2px 0 10px}
.grab{width:38px;height:5px;border-radius:9px;background:#d4d2cb;margin:0 auto 10px;cursor:grab}
.m-opt{padding:11px 4px;border-bottom:1px solid #f1f0eb;font-size:12.5px;cursor:pointer;display:flex;justify-content:space-between}
.m-opt.on{color:var(--accent);font-weight:700}
.m-pad{padding:12px}
.lbl{position:absolute;font:600 9px var(--mono);background:var(--accent);color:#fff;padding:2px 6px;border-radius:4px;z-index:45;white-space:nowrap;pointer-events:none}
.lbl.o{background:var(--accent-2)}
.lbl.k{background:#16161a}
.m-h{font-size:22px;font-weight:900;letter-spacing:-.03em;margin:4px 14px 10px}
.m-sec{font-size:10.5px;color:var(--muted);padding:12px 14px 5px;font-weight:600}
.m-go{position:absolute;right:12px;bottom:26px;border:0;border-radius:99px;background:var(--accent);color:#fff;font:inherit;font-size:11px;font-weight:700;padding:8px 13px;cursor:pointer;z-index:5;box-shadow:0 6px 14px -6px var(--accent)}
.m-sw{position:relative;display:inline-block;width:40px;height:24px;flex:none}
.m-sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.m-sw span{position:absolute;inset:0;background:#e3e2dc;border-radius:99px;transition:.25s}
.m-sw span::after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.4,.6,1)}
.m-sw input:checked+span{background:#34c759}
.m-sw input:checked+span::after{transform:translateX(16px)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #e2e0da;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- Navigation ---------- */
.tabc b{display:block;font-size:18px;margin:8px 14px 0}
.lt-big{margin:2px 14px 8px;font-size:26px;font-weight:900;letter-spacing:-.03em;transition:opacity .2s}
.lt-small{opacity:0;transition:opacity .2s}
.lt-bar{transition:box-shadow .2s;background:rgba(255,255,255,.95)}
.lt-bar.sc{box-shadow:0 1px 0 #ebeae5}
.stabs{overflow-x:auto;scrollbar-width:none;flex:none;border-bottom:1px solid #efeee9}
.stabs::-webkit-scrollbar{display:none}
.stabs .trk{display:inline-flex;position:relative;padding:0 6px}
.stabs button,.swt button,.sp-tabs button{border:0;background:none;font:inherit;font-size:12px;padding:10px 9px;color:#9a9890;cursor:pointer;white-space:nowrap}
.stabs button.on,.swt button.on,.sp-tabs button.on{color:var(--ink);font-weight:700}
.stabs .ind{position:absolute;bottom:0;height:2.5px;background:var(--ink);border-radius:2px;transition:left .3s cubic-bezier(.4,0,.2,1),width .3s}
.swt{display:flex;position:relative;flex:none;border-bottom:1px solid #efeee9}
.swt button{flex:1}
.swt .ind{position:absolute;left:0;bottom:0;width:33.333%;height:2.5px;background:var(--ink)}
.swp{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab}
.swp::-webkit-scrollbar{display:none}
.swp section{flex:0 0 100%;scroll-snap-align:start;overflow:hidden;padding-top:6px}
.swp section b{display:block;margin:6px 14px 0;font-size:14px}
.m-drawer{position:absolute;left:0;top:0;bottom:0;width:74%;background:#fff;z-index:21;padding:40px 10px 10px;transform:translateX(-100%);transition:transform .38s cubic-bezier(.2,.9,.3,1);border-radius:0 18px 18px 0}
.m-drawer.show{transform:none}
.m-drawer .dp{padding:6px 8px 14px;border-bottom:1px solid #efeee9;margin-bottom:8px;display:flex;flex-direction:column;gap:3px}
.m-drawer .dp .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#9fb0ff,#3d5afe);margin-bottom:6px}
.m-drawer .dp small{color:var(--muted);font-size:10.5px}
.m-drawer a{display:block;padding:10px 12px;border-radius:99px;font-size:12.5px;cursor:pointer}
.m-drawer a.on{background:#e7ebff;color:var(--accent);font-weight:700}
.ftb{position:absolute;left:20px;right:20px;bottom:26px;height:50px;border-radius:99px;background:#16161a;display:flex;padding:5px;box-shadow:0 12px 24px -10px rgba(0,0,0,.5);z-index:4}
.ftb button{flex:1;position:relative;z-index:1;color:#8a8990;border:0;background:none;display:grid;place-items:center;cursor:pointer;transition:color .3s}
.ftb button.on{color:#16161a}
.ftb .blob{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:99px;background:#fff;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.ctb .mid .pl{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 16px -6px var(--accent);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.ctb .mid.open .pl{transform:rotate(45deg)}
.ctm{position:absolute;left:50%;bottom:74px;display:flex;gap:10px;transform:translateX(-50%);z-index:6}
.ctm span{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 6px 16px -6px rgba(0,0,0,.35);display:grid;place-items:center;font-size:10px;font-weight:700;opacity:0;transform:translateY(20px) scale(.6);transition:.3s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.ctm.show span{opacity:1;transform:none;pointer-events:auto}
.ctm.show span:nth-child(2){transition-delay:.04s}.ctm.show span:nth-child(3){transition-delay:.08s}
.sbw .lt-big{height:34px;overflow:hidden;transition:height .3s,opacity .2s,margin .3s}
.sbw.on .lt-big{height:0;opacity:0;margin-top:0;margin-bottom:0}
.sbar{display:flex;align-items:center;padding:0 12px 8px;gap:8px}

.pz{position:relative;height:300px;margin:12px;border-radius:14px;overflow:hidden;background:#000}
.pz .img{position:absolute;inset:0;background:radial-gradient(circle at 30% 35%,#ffd166 0 10%,transparent 11%),radial-gradient(circle at 70% 60%,#ff6b6b 0 14%,transparent 15%),linear-gradient(160deg,#3d5afe,#9b5cff);animation:pz 3.2s cubic-bezier(.4,0,.2,1) infinite}
.pz .f{position:absolute;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid #fff;box-shadow:0 0 0 6px rgba(255,255,255,.25)}
.pz .f1{animation:f1 3.2s cubic-bezier(.4,0,.2,1) infinite}
.pz .f2{animation:f2 3.2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes pz{0%,15%{transform:scale(1)}45%,65%{transform:scale(1.8)}95%,100%{transform:scale(1)}}
@keyframes f1{0%,15%{left:44%;top:44%}45%,65%{left:20%;top:22%}95%,100%{left:44%;top:44%}}
@keyframes f2{0%,15%{left:52%;top:52%}45%,65%{left:74%;top:72%}95%,100%{left:52%;top:52%}}
.ro-list{padding:8px 12px}
.ro-it{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #ebeae5;border-radius:12px;padding:10px;margin-bottom:7px;font-size:12px;transition:box-shadow .2s,transform .2s;user-select:none;-webkit-user-select:none}
.ro-it .hd{color:#a3a29b;cursor:grab;touch-action:none;font-size:15px;letter-spacing:-2px;padding:0 4px}
.ro-it .n{width:20px;height:20px;border-radius:6px;background:#eef0ff;color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:700}
.ro-it.drag{box-shadow:0 12px 24px -10px rgba(0,0,0,.35);transform:scale(1.03);border-color:var(--accent)}
.stc{position:absolute;left:16px;right:16px;bottom:44px;height:52px;border-radius:99px;background:#16161a;overflow:hidden}
.stc .tx{position:absolute;inset:0;display:grid;place-items:center;color:#8a8990;font-size:12px;font-weight:700;letter-spacing:.02em;background:linear-gradient(90deg,#55555c 0%,#fff 50%,#55555c 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.stc .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.stc .kn{position:absolute;left:4px;top:4px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;touch-action:none;cursor:grab;z-index:2}
.stc.done{background:#34c759}
.stc.done .tx{-webkit-text-fill-color:#fff;color:#fff;animation:none}
.pan{position:absolute;inset:0;overflow:hidden;background:#e8eef5;cursor:grab;touch-action:none}
.pan .mp{position:absolute;left:-200px;top:-200px;width:620px;height:820px;background:linear-gradient(90deg,transparent 48%,#fff 48% 52%,transparent 52%) 0 0/110px 110px,linear-gradient(0deg,transparent 48%,#fff 48% 52%,transparent 52%) 0 0/110px 110px,radial-gradient(circle at 30% 40%,#cfe8c9 0 60px,transparent 61px),radial-gradient(circle at 70% 70%,#cfe8c9 0 80px,transparent 81px),radial-gradient(circle at 60% 25%,#bfd9f2 0 70px,transparent 71px),#e8eef5}
.pan .pinm{position:absolute;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent-2);border:3px solid #fff;box-shadow:0 4px 8px rgba(0,0,0,.25)}

/* ---------- Transitions ---------- */
.pgs{position:absolute;inset:0;background:#fff}
.mpg{position:absolute;inset:0;padding-top:26px;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.mpg.sheetb{border-radius:16px 16px 0 0}
.det-hero{height:150px;background:linear-gradient(135deg,#ffb199,#ff5a36);flex:none}
.det-tx{padding:12px;display:flex;flex-direction:column;gap:7px}
.det-tx b{font-size:15px}
.mo-det{position:absolute;inset:0;z-index:15}
.mo-hero{position:absolute}
.mo-body{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:7px;padding:12px}
.mo-x{position:absolute;right:10px;top:34px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:2}
.homegrid{position:absolute;inset:0;padding:48px 18px 0;background:linear-gradient(160deg,#c9d4ff,#ffd9cc);display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;align-content:start}
.homegrid .ai{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8.5px;color:#333}
.homegrid .ai i{width:38px;height:38px;border-radius:11px;display:block;cursor:pointer;box-shadow:0 3px 8px -4px rgba(0,0,0,.3)}
.xs-map{position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,#fff 48% 52%,transparent 52%) 0 0/90px 90px,linear-gradient(0deg,transparent 48%,#fff 48% 52%,transparent 52%) 0 0/90px 90px,radial-gradient(circle at 40% 30%,#cfe8c9 0 50px,transparent 51px),#e8eef5}
.xs{position:absolute;left:0;right:0;bottom:0;top:58%;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -10px 24px -12px rgba(0,0,0,.25);transition:top .5s cubic-bezier(.2,.9,.3,1),border-radius .5s;z-index:5;display:flex;flex-direction:column;overflow:hidden}
.xs.full{top:0;border-radius:0}
.xs .xhd{padding:8px 14px 6px;cursor:pointer;flex:none;transition:padding .5s}
.xs.full .xhd{padding-top:34px}
.xs .xhd b{font-size:13px}
.xs .xhd .grab{transition:opacity .3s}
.xs.full .xhd .grab{opacity:0}
.xs .m-body{flex:1}
.tcf{position:relative;flex:1}
.tcf section{position:absolute;inset:0;opacity:0;transition:opacity .22s;pointer-events:none;overflow:hidden}
.tcf section.on{opacity:1;pointer-events:auto}
.tcf section b{display:block;font-size:20px;font-weight:900;margin:12px 14px 4px}
.fabgo{position:absolute;right:14px;bottom:30px;width:50px;height:50px;border-radius:16px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:5;box-shadow:0 10px 20px -8px var(--accent)}

/* ---------- Scroll ---------- */
.ct-h{position:absolute;left:0;right:0;top:0;height:170px;z-index:3;overflow:hidden;background:#fff}
.ct-h .img{position:absolute;inset:0;background:linear-gradient(160deg,#5fd3a8,#3d5afe)}
.ct-h .bk{position:absolute;left:10px;top:34px;color:#fff;transition:color .2s}
.ct-h .tt{position:absolute;left:14px;bottom:12px;font-size:22px;font-weight:900;color:#fff;transform-origin:left bottom;white-space:nowrap}
.ct-h.solid .bk,.ct-h.solid .tt{color:var(--ink)}
.ct-h.solid{box-shadow:0 1px 0 #ebeae5}
.sh-img{height:170px;background:linear-gradient(160deg,#ff9a76,#9b5cff);display:grid;place-items:center;color:#fff;font-weight:900;letter-spacing:.1em;transition:height .45s cubic-bezier(.2,.9,.3,1)}
.sh-img.drag{transition:none}
.sh-info{padding:10px 14px;display:flex;flex-direction:column}
.sh-info small{color:var(--muted);font-size:11px}
.sp-tabs{position:sticky;top:0;z-index:2;display:flex;background:#fff;border-bottom:1px solid #efeee9}
.sp-tabs button{flex:1}
.sp-tabs .ind{position:absolute;bottom:0;left:0;width:33.333%;height:2.5px;background:var(--ink);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.spsec{padding:12px 14px 20px;border-bottom:8px solid #f4f3ef}
.spsec h4{margin:0 0 8px;font-size:13px}
.spsec .m-ln{margin-bottom:8px}
.shorts{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;background:#000;cursor:grab}
.shorts::-webkit-scrollbar{display:none}
.shorts section{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;color:#fff}
.shorts .side{position:absolute;right:10px;bottom:70px;display:flex;flex-direction:column;gap:14px;align-items:center;font-size:9px}
.shorts .cap{position:absolute;left:12px;right:56px;bottom:40px;font-size:11px;line-height:1.5}
.shorts .cap b{font-size:12px}
.shelf h4{margin:14px 14px 8px;font-size:13px;display:flex;justify-content:space-between}
.shelf h4 small{color:var(--muted);font-weight:400;font-size:10.5px}
.shelf .row{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scroll-snap-type:x mandatory;scroll-padding:14px;scrollbar-width:none;cursor:grab}
.shelf .row::-webkit-scrollbar{display:none}
.shelf .row div{flex:0 0 96px;height:120px;border-radius:12px;scroll-snap-align:start}
.shelf .row.wide div{flex:0 0 150px;height:90px}
.btt{position:absolute;right:12px;bottom:30px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--ink);box-shadow:0 6px 16px -6px rgba(0,0,0,.35);display:grid;place-items:center;cursor:pointer;opacity:0;transform:translateY(14px) scale(.7);transition:.3s cubic-bezier(.3,1.4,.5,1);pointer-events:none;z-index:6}
.btt.show{opacity:1;transform:none;pointer-events:auto}
.rv{opacity:0;transform:translateY(26px);transition:opacity .55s,transform .55s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.efab{position:absolute;right:14px;bottom:30px;height:48px;border-radius:16px;border:0;background:var(--accent);color:#fff;font:inherit;font-size:12.5px;font-weight:700;display:flex;align-items:center;padding:0 14px;gap:0;cursor:pointer;box-shadow:0 10px 20px -8px var(--accent);z-index:5}
.efab span{max-width:60px;overflow:hidden;white-space:nowrap;transition:max-width .3s cubic-bezier(.4,0,.2,1),margin .3s;margin-left:6px}
.efab.mini span{max-width:0;margin-left:0}
.ild{display:flex;justify-content:center;padding:10px 0 30px;opacity:0;transition:opacity .2s}
.ild.on{opacity:1}

/* ---------- Feedback ---------- */
.sk .av,.sk .m-ln,.sk .im{background:linear-gradient(90deg,#ecebe6 25%,#f7f6f2 50%,#ecebe6 75%)!important;background-size:300% 100%!important;animation:sk 1.3s linear infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}
.skw{position:relative;flex:1}
.skw>div{position:absolute;inset:0;transition:opacity .4s;overflow:hidden}
.skw .real{opacity:0}
.skw.loaded .sk{opacity:0}.skw.loaded .real{opacity:1}
.fc{padding:10px 12px;border-bottom:8px solid #f4f3ef}
.fc .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fc .hd .av{width:28px;height:28px;border-radius:50%;flex:none}
.fc .hd .t{flex:1;display:flex;flex-direction:column;gap:4px}
.fc .im{height:110px;border-radius:12px}
.ai-wrap{display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:30px}
.ai-wrap>div{display:flex;flex-direction:column;align-items:center;gap:8px;font:10px var(--mono);color:var(--muted)}
.ios-sp{position:relative;width:26px;height:26px}
.ios-sp i{position:absolute;left:11.5px;top:0;width:3px;height:8px;border-radius:2px;background:#555;transform-origin:1.5px 13px;animation:fadeSp 1s linear infinite}
@keyframes fadeSp{from{opacity:1}to{opacity:.15}}
.md-sp{width:32px;height:32px;animation:spin 1.4s linear infinite}
.md-sp circle{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:1 200;stroke-dashoffset:0;animation:mdash 1.4s ease-in-out infinite}
@keyframes mdash{0%{stroke-dasharray:1 200;stroke-dashoffset:0}50%{stroke-dasharray:70 200;stroke-dashoffset:-15}100%{stroke-dasharray:70 200;stroke-dashoffset:-85}}
.lin{width:150px;height:4px;border-radius:9px;background:#e4e8ff;overflow:hidden;position:relative}
.lin i{position:absolute;top:0;bottom:0;width:40%;background:var(--accent);border-radius:9px;animation:lin 1.2s cubic-bezier(.6,0,.4,1) infinite}
@keyframes lin{from{left:-40%}to{left:100%}}
.rp{position:absolute;border-radius:50%;background:rgba(0,0,0,.12);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.m-row.hl{background:#e5e5ea;transition:none}
.m-row{transition:background .35s}
.offb{position:absolute;left:0;right:0;top:68px;height:30px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;color:#fff;background:#55555c;transform:translateY(-100%);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .3s,background .3s;z-index:2}
.offb.show{transform:none;opacity:1}
.offb.ok{background:#34c759}
.iv{padding:14px}
.iv .f{margin-bottom:12px}
.iv label{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.iv input{width:100%;border:1.5px solid #dddbd4;border-radius:10px;padding:9px 10px;font:inherit;font-size:12.5px;outline:none;transition:border-color .2s,background .2s}
.iv input:focus{border-color:var(--accent)}
.iv .bad input{border-color:#ff3b30;background:#fff6f5}
.iv .good input{border-color:#34c759}
.iv .msg{font-size:10px;margin-top:4px;min-height:14px;color:#ff3b30}
.iv .good .msg{color:#34c759}
.iv .rules{list-style:none;margin:4px 0 0;padding:0;font-size:10.5px;color:#a3a29b}
.iv .rules li{display:flex;align-items:center;gap:5px;margin-top:3px;transition:color .2s}
.iv .rules li.ok{color:#34c759}
.okscr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:110px 18px 0;text-align:center}
.okscr svg{width:76px;height:76px;animation:okPop .4s cubic-bezier(.3,1.6,.5,1) .7s both}
.okscr circle{fill:none;stroke:#34c759;stroke-width:4;stroke-dasharray:220;stroke-dashoffset:220;animation:draw .6s ease-out forwards}
.okscr path{fill:none;stroke:#34c759;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .35s ease-out .55s forwards}
.okscr b{font-size:16px;margin-top:16px;opacity:0;animation:fadeUp .4s ease-out .8s forwards}
.okscr p{font-size:11px;color:var(--muted);margin:6px 0 0;opacity:0;animation:fadeUp .4s ease-out .9s forwards}
.okscr .m-cta{position:absolute;left:14px;right:14px;bottom:30px;width:auto;opacity:0;animation:fadeUp .4s ease-out 1.05s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes okPop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.emp{display:flex;flex-direction:column;align-items:center;text-align:center;padding:60px 24px 0;gap:4px}
.emp svg{width:70px;height:70px;margin-bottom:8px}
.emp b{font-size:14px}
.emp p{margin:0 0 14px;font-size:11px;color:var(--muted);line-height:1.5}
.emp .m-cta{width:auto;padding:0 20px;height:38px}
.lbw{position:absolute;left:14px;right:14px;bottom:30px}
.lbw .m-cta.loading{background:#7d8fff;cursor:wait}
.lbw .m-cta.done{background:#34c759}
.lbw .sp{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.lk-btn{position:relative;border:0;background:none;padding:0;cursor:pointer;width:26px;height:26px;display:grid;place-items:center}
.lk-btn svg{width:22px;height:22px;transition:fill .2s,color .2s}
.lk-btn.on{color:#ff3b5c}
.lk-btn.on svg{fill:currentColor}
.lk-btn .pt{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;pointer-events:none}
.hp-ring{position:absolute;width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);pointer-events:none;animation:hpr .6s ease-out forwards;z-index:5}
@keyframes hpr{from{transform:scale(.6);opacity:1}to{transform:scale(2.4);opacity:0}}
.hp-tag{position:absolute;left:50%;top:84px;transform:translate(-50%,-10px);background:#16161a;color:#fff;font:600 10px var(--mono);padding:5px 9px;border-radius:99px;opacity:0;transition:.25s;z-index:6;white-space:nowrap}
.hp-tag.show{opacity:1;transform:translate(-50%,0)}
.up-row{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid #f1f0eb}
.up-row .th{width:36px;height:36px;border-radius:8px;flex:none}
.up-row .tx{flex:1;display:flex;flex-direction:column;gap:5px;font-size:11.5px;min-width:0}
.up-row .bar{height:4px;border-radius:9px;background:#ecebe6;overflow:hidden}
.up-row .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px}
.up-row .st{font:10px var(--mono);color:var(--muted);width:30px;text-align:right}
.up-row.done .st{color:#34c759}
.up-row.done .bar i{background:#34c759}

/* ---------- Screens ---------- */
.spl{position:absolute;inset:0;background:var(--accent);display:grid;place-items:center;z-index:3;transition:opacity .5s}
.spl.out{opacity:0;pointer-events:none}
.spl b{color:#fff;font-size:26px;font-weight:900;letter-spacing:-.03em;animation:splIn .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes splIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.ob{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:26px}
.ob .skip{align-self:flex-end;font-size:11px;color:var(--muted);padding:8px 14px;cursor:pointer}
.ob .slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab}
.ob .slides::-webkit-scrollbar{display:none}
.ob .slides section{flex:0 0 100%;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 20px 0}
.ob .il{width:130px;height:130px;border-radius:40px;margin:16px 0 22px}
.ob h3{margin:0 0 6px;font-size:16px;letter-spacing:-.02em}
.ob p{margin:0;font-size:11px;color:var(--muted);line-height:1.6}
.ob .bt{padding:0 14px 30px}
.lg{position:absolute;inset:0;padding:60px 18px 0;display:flex;flex-direction:column;gap:8px}
.lg .lo{font-size:22px;font-weight:900;margin-bottom:14px;letter-spacing:-.03em}
.lg input{border:1.5px solid #e3e1da;border-radius:10px;padding:10px;font:inherit;font-size:12px;outline:none}
.lg .or{display:flex;align-items:center;gap:8px;font-size:10px;color:#a3a29b;margin:8px 0}
.lg .or::before,.lg .or::after{content:"";flex:1;height:1px;background:#e3e1da}
.lg .sns{height:38px;border-radius:10px;display:grid;place-items:center;font-size:11.5px;font-weight:700;border:1px solid transparent}
.lg .links{display:flex;justify-content:center;gap:12px;font-size:10px;color:var(--muted);margin-top:8px}
.perm-bg{position:absolute;inset:0;filter:blur(1.5px)}
.feed-st{display:flex;gap:10px;overflow-x:auto;padding:6px 12px 10px;scrollbar-width:none;flex:none}
.feed-st::-webkit-scrollbar{display:none}
.feed-st span{flex:none;width:46px;height:46px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#ffb547,#ff5a36,#9b5cff)}
.feed-st span i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid #fff}
.pdp-img{height:200px;position:relative}
.pdp-img .num{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.45);color:#fff;font:10px var(--mono);padding:2px 7px;border-radius:99px}
.pdp-in{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pdp-in small{color:var(--muted);font-size:10.5px}
.pdp-in .pr{font-size:16px;font-weight:900}
.pdp-in .pr em{font-style:normal;color:var(--accent-2);margin-right:4px}
.ck-row{display:flex;gap:10px;padding:12px;border-bottom:1px solid #f1f0eb;align-items:flex-start}
.ck-box{width:18px;height:18px;border-radius:5px;background:var(--accent);flex:none;display:grid;place-items:center;color:#fff}
.sumry{margin:10px 12px;padding:10px 12px;border-radius:12px;background:#f7f6f2;font-size:11px;display:flex;flex-direction:column;gap:5px}
.sumry div{display:flex;justify-content:space-between}
.sumry .tt{font-weight:900;font-size:13px;border-top:1px solid #e6e4de;padding-top:6px}
.paym{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 12px}
.paym span{border:1.5px solid #e3e1da;border-radius:10px;padding:10px 6px;font-size:11px;text-align:center;cursor:pointer}
.paym span.on{border-color:var(--accent);color:var(--accent);font-weight:700;background:#f3f5ff}
.addr{margin:0 12px;padding:10px 12px;border:1px solid #ebeae5;border-radius:12px;font-size:11px;line-height:1.6}
.addr b{font-size:12px}
.mp-prof{display:flex;align-items:center;gap:10px;padding:10px 14px}
.mp-prof .av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#9fb0ff,#3d5afe)}
.mp-stat{display:flex;margin:6px 12px 8px;background:#f7f6f2;border-radius:12px}
.mp-stat div{flex:1;text-align:center;padding:10px 0;font-size:10px;color:var(--muted)}
.mp-stat b{display:block;font-size:15px;color:var(--ink)}
.nt-row{display:flex;gap:10px;padding:11px 12px;align-items:flex-start;position:relative}
.nt-row.new{background:#f4f6ff}

    if(size){const cur=axis==='x'?el.scrollLeft:el.scrollTop,start=s0,dir=Math.sign(cur-start);let t=Math.round(cur/size)*size;if(Math.abs(cur-start)>size*.18&&Math.round(cur/size)*size===Math.round(start/size)*size)t=(Math.round(start/size)+dir)*size;el.scrollTo({[axis==='x'?'left':'top']:t,behavior:'smooth'});setTimeout(()=>{el.style.scrollSnapType='';},500);}

function mtrans(type){return (st,c)=>{

 html:`<div class="app">${bar('MyApp','menu','')}<div class="m-body">${cards(3)}</div></div><div class="m-dim"></div><div class="m-drawer"><div class="dp"><span class="av"></span><b>김디자인</b><small>designer@mail.com</small></div><a class="on">홈</a><a>탐색</a><a>알림</a><a>설정</a></div>`,
 init(st,c){const d=st.querySelector('.m-drawer'),m=st.querySelector('.m-dim');const set=v=>{d.classList.toggle('show',v);m.classList.toggle('show',v);};st.querySelector('.m-bar .bi').onclick=()=>set(true);m.onclick=()=>set(false);d.querySelectorAll('a').forEach(a=>a.onclick=()=>{d.querySelectorAll('a').forEach(x=>x.classList.toggle('on',x===a));set(false);});}},
{cat:'nav',ko:'플로팅 탭 바',en:'Floating Tab Bar',alias:'알약형 탭 바, 필(Pill) 내비게이션',
 desc:'화면 가장자리에서 떨어져 떠 있는 알약 모양 탭 바예요. 선택 표시가 미끄러지듯 이동해요.',
 dev:'custom TabBar · spring animation',hint:'탭 클릭',
 html:`<div class="app"><div class="m-body" style="padding-top:4px">${cards(4)}<div style="height:60px"></div></div><div class="ftb"><i class="blob"></i>${['home','search','heart','user'].map((k,i)=>`<button class="${i?'':'on'}">${I(k,18)}</button>`).join('')}</div></div>`,
 init(st){const bs=[...st.querySelectorAll('.ftb button')],bl=st.querySelector('.blob');bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(x=>x.classList.toggle('on',x===b));bl.style.transform=`translateX(${i*100}%)`;});}},
{cat:'nav',ko:'센터 액션 탭 바',en:'Center Action Tab',alias:'중앙 버튼 탭 바, 만들기(+) 탭',
 desc:'탭 바 가운데에 강조된 + 버튼을 둔 형태예요. 글쓰기·업로드처럼 서비스의 핵심 행동을 강조할 때 써요.',
 dev:'BottomAppBar + FAB',hint:'+ 클릭',
 html:`<div class="app"><div class="m-body">${cards(4)}</div><div class="ctm"><span>글</span><span>사진</span><span>라이브</span></div><div class="m-tabbar ctb"><button class="on">${I('home',19)}<span>홈</span></button><button>${I('search',19)}<span>검색</span></button><button class="mid"><span class="pl">${I('plus',22)}</span></button><button>${I('chat',19)}<span>채팅</span></button><button>${I('user',19)}<span>MY</span></button></div></div>`,
 init(st){const m=st.querySelector('.mid'),menu=st.querySelector('.ctm');m.onclick=()=>{m.classList.toggle('open');menu.classList.toggle('show');};}},
{cat:'nav',ko:'검색 바',en:'Search Bar',alias:'서치 바, 검색창, 검색 컨트롤러',
 desc:'누르면 큰 제목이 접히고 오른쪽에 취소 버튼이 나타나며 검색 모드로 바뀌어요. 최근 검색어를 함께 보여주는 경우가 많아요.',
 dev:'UISearchController · SearchBar',hint:'검색창 클릭',
 html:`<div class="app"><div class="sbw"><h2 class="lt-big">검색</h2><div class="sbar"><div class="fld">${I('search',14)}<input placeholder="검색"></div><button class="cn">취소</button></div></div><div class="m-body"><div class="recent"><small>최근 검색어</small>${['모달','바텀 시트','스와이프','토스트'].map(t=>`<span class="m-chip">${t}</span>`).join('')}</div>${cards(2)}</div></div>`,
 init(st){const w=st.querySelector('.sbw'),i=st.querySelector('.fld input');i.addEventListener('focus',()=>w.classList.add('on'));st.querySelector('.cn').onclick=()=>{i.value='';i.blur();w.classList.remove('on');};st.querySelectorAll('.recent .m-chip').forEach(ch=>ch.onclick=()=>{w.classList.add('on');i.value=ch.textContent;});}},
{cat:'nav',ko:'더보기 메뉴',en:'Overflow Menu',alias:'케밥 메뉴(⋮), 미트볼 메뉴(⋯), 옵션 메뉴',
 desc:'⋮ 또는 ⋯ 아이콘을 누르면 나오는 추가 메뉴예요. 자주 쓰지 않는 액션을 숨겨 화면을 깔끔하게 유지해요.',
 dev:'DropdownMenu · UIMenu',hint:'⋮ 클릭',
 html:`<div class="app">${bar('상세','back','more')}<div class="m-body">${cards(3)}</div></div><div class="ovm"><a>${I('share',14)}공유하기</a><a>${I('heart',14)}저장</a><a>${I('pen',14)}수정</a><a class="dg">${I('trash',14)}삭제</a></div>`,
 init(st){const m=st.querySelector('.ovm'),b=st.querySelectorAll('.m-bar .bi')[1];b.onclick=e=>{e.stopPropagation();m.classList.toggle('show');};st.addEventListener('click',e=>{if(!e.target.closest('.ovm'))m.classList.remove('show');});m.querySelectorAll('a').forEach(a=>a.onclick=()=>m.classList.remove('show'));}},

/* ---------- COMPONENTS ---------- */
{cat:'comp',ko:'바텀 시트',en:'Bottom Sheet',alias:'하단 시트, 드래그 시트, 모달 시트',
 desc:'아래에서 올라오는 패널이에요. 핸들(Handle/Grabber)을 아래로 끌면 닫혀요. 멈추는 높이 단계는 스냅 포인트(Snap points)라고 해요.',
 dev:'BottomSheet · detents / snapPoints',hint:'버튼 클릭 · 핸들 드래그',
 html:`<div class="app">${bar('상품','back','')}<div class="m-body">${cards(2)}<div class="m-pad"><button class="m-cta op">옵션 선택</button></div></div></div><div class="m-dim"></div><div class="m-sheet"><div class="grab"></div><b class="sh-t">옵션 선택</b>${['블랙 / M','블랙 / L','화이트 / M'].map((t,i)=>`<div class="m-opt ${i?'':'on'}">${t}${i?'':I('check',14)}</div>`).join('')}<div style="height:10px"></div><button class="m-cta">확인</button></div>`,
 init(st,c){const s=sheetCtl(st,'.m-sheet','.m-dim');st.querySelector('.op').onclick=s.open;st.querySelectorAll('.m-sheet .m-cta,.m-opt').forEach(b=>b.addEventListener('click',s.close));c.after(s.open,700);}},
{cat:'comp',ko:'액션 시트',en:'Action Sheet',alias:'선택 시트, iOS 액션 시트',
 desc:'iOS에서 아래에서 올라오는 선택지 목록이에요. 취소 버튼이 따로 떨어져 있고, 삭제처럼 위험한 동작은 빨간색으로 표시해요.',
 dev:'UIAlertController(.actionSheet)',hint:'클릭',
 html:`<div class="app">${bar('프로필','back','')}<div class="m-body"><div style="display:flex;flex-direction:column;align-items:center;padding:24px 0;gap:10px"><span style="width:76px;height:76px;border-radius:50%;background:${GR[0]}"></span><button class="m-cta ghost op" style="width:auto;padding:0 16px;height:34px">사진 변경</button></div>${rows(3,{t:'정보'})}</div></div><div class="m-dim"></div><div class="m-as"><div class="grp"><small>프로필 사진 변경</small><a>사진 찍기</a><a>앨범에서 선택</a><a class="dg">현재 사진 삭제</a></div><div class="grp"><a>취소</a></div></div>`,
 init(st,c){const s=sheetCtl(st,'.m-as','.m-dim');st.querySelector('.op').onclick=s.open;st.querySelectorAll('.m-as a').forEach(a=>a.onclick=s.close);c.after(s.open,700);}},
{cat:'comp',ko:'얼럿',en:'Alert Dialog',alias:'다이얼로그, 확인 창, 컨펌 팝업',
 desc:'화면 가운데 뜨는 확인 창이에요. 버튼은 2개 이하로, 권장 행동은 오른쪽(iOS는 굵게) 배치해요.',
 dev:'UIAlertController · AlertDialog',hint:'클릭',
 html:`<div class="app">${bar('설정','back','')}<div class="m-body">${rows(5,{t:'설정'})}<div class="m-pad"><button class="m-cta op">알림 설정하기</button></div></div></div><div class="m-dim"></div><div class="m-alert"><b>알림을 허용할까요?</b><p>새 댓글과 이벤트 소식을<br>가장 먼저 알려드려요.</p><div class="bt"><a>나중에</a><a class="pr">허용</a></div></div>`,
 init(st,c){const a=st.querySelector('.m-alert'),d=st.querySelector('.m-dim');const set=v=>{a.classList.toggle('show',v);d.classList.toggle('show',v);};st.querySelector('.op').onclick=()=>set(true);a.querySelectorAll('a').forEach(x=>x.onclick=()=>set(false));c.after(()=>set(true),700);}},
{cat:'comp',ko:'스낵바',en:'Snackbar',alias:'하단 알림, 실행 취소 바',
 desc:'화면 아래에 잠깐 나타나는 알림이에요. "실행 취소" 같은 액션을 하나 붙일 수 있고, 몇 초 뒤 자동으로 사라져요.',
 dev:'Snackbar.make(…).setAction("실행 취소")',hint:'보관 클릭',
 html:`<div class="app">${bar('메일함','menu','search')}<div class="m-body mlist">${rows(7,{t:'메일',s:'오른쪽 아이콘으로 보관',chev:false})}</div></div><div class="m-snack"><span>보관함으로 이동했어요</span><u>실행 취소</u></div>`,
 init(st){const s=st.querySelector('.m-snack');let h,last=null;st.querySelectorAll('.mlist .m-row').forEach(r=>{const b=document.createElement('span');b.innerHTML=I('archive',16);b.style.color='#8a8990';r.appendChild(b);b.onclick=e=>{e.stopPropagation();last=r;r.style.display='none';s.classList.add('show');clearTimeout(h);h=setTimeout(()=>s.classList.remove('show'),3000);};});s.querySelector('u').onclick=()=>{if(last)last.style.display='';s.classList.remove('show');};}},
{cat:'comp',ko:'토스트',en:'Toast',alias:'토스트 메시지, 상단 알림, HUD',
 desc:'짧은 결과 메시지를 잠깐 띄웠다가 사라져요. 액션 버튼 없이 정보만 알려줄 때 써요. iOS 앱은 위쪽, Android는 아래쪽에 띄우는 경우가 많아요.',
 dev:'Toast.makeText · custom HUD',hint:'클릭',
 html:`<div class="app">${bar('공유','back','')}<div class="m-body">${cards(2)}<div class="m-pad"><button class="m-cta op">${I('share',15)}링크 복사</button></div></div></div><div class="m-toast">${I('check',14)}링크를 복사했어요</div>`,
 init(st,c){const t=st.querySelector('.m-toast');let h;const show=()=>{t.classList.add('show');clearTimeout(h);h=setTimeout(()=>t.classList.remove('show'),1800);};st.querySelector('.op').onclick=show;c.after(show,700);}},
{cat:'comp',ko:'FAB · 스피드 다이얼',en:'FAB · Speed Dial',alias:'플로팅 액션 버튼, 떠 있는 버튼',
 desc:'화면 위에 떠 있는 핵심 행동 버튼(FAB)이에요. 누르면 하위 버튼이 라벨과 함께 펼쳐지는 형태를 스피드 다이얼이라고 해요.',
 dev:'FloatingActionButton · SpeedDial',hint:'+ 클릭',
 html:`<div class="app">${bar('노트','menu','search')}<div class="m-body">${rows(7,{t:'노트'})}</div></div><div class="m-dim"></div><div class="m-fabw"><button class="m-fab">${I('plus',22)}</button><span class="m-mini"><em>새 노트</em><i>${I('pen',15)}</i></span><span class="m-mini"><em>사진</em><i>${I('cam',15)}</i></span><span class="m-mini"><em>체크리스트</em><i>${I('check',15)}</i></span></div>`,
 init(st){const w=st.querySelector('.m-fabw'),d=st.querySelector('.m-dim');const set=v=>{w.classList.toggle('on',v);d.classList.toggle('show',v);};w.querySelector('.m-fab').onclick=()=>set(!w.classList.contains('on'));d.onclick=()=>set(false);w.querySelectorAll('.m-mini').forEach(m=>m.onclick=()=>set(false));}},
{cat:'comp',ko:'필터 칩',en:'Filter Chips',alias:'칩 필터, 태그 필터, 퀵 필터',
 desc:'가로로 스크롤되는 작은 버튼들로 목록을 걸러요. 여러 개를 동시에 고를 수 있고(다중 선택), 선택된 칩은 색이 채워져요.',
 dev:'ChipGroup · FilterChip',hint:'칩 클릭',
 html:`<div class="app">${bar('검색 결과','back','filter')}<div class="fchips">${['무료배송','오늘출발','할인','4.5점 이상','새상품','브랜드'].map(t=>`<span class="m-chip">${t}</span>`).join('')}</div><div class="fcount">전체 128개</div><div class="m-body fres">${rows(6,{t:'상품'})}</div></div>`,
 init(st){const ch=[...st.querySelectorAll('.fchips .m-chip')],cnt=st.querySelector('.fcount'),res=st.querySelector('.fres');ch.forEach(c=>c.onclick=()=>{c.classList.toggle('on');const n=ch.filter(x=>x.classList.contains('on')).length;cnt.textContent=n?`필터 ${n}개 적용 · ${Math.max(6,128-n*31)}개`:'전체 128개';res.animate([{opacity:.3},{opacity:1}],{duration:250});});dragScroll(st.querySelector('.fchips'),'x');}},
{cat:'comp',ko:'수량 스테퍼',en:'Quantity Stepper',alias:'수량 조절, 카운터, 플러스/마이너스 버튼',
 desc:'− / + 버튼으로 숫자를 하나씩 바꿔요. 최소값(1)에서는 − 버튼을 비활성(disabled)으로 바꿔 더 줄일 수 없음을 알려줘요.',
 dev:'UIStepper · NumberStepper',hint:'− + 클릭',
 html:`<div class="app">${bar('장바구니','back','')}<div class="m-body">${[0,1].map(i=>`<div class="qrow"><span class="th" style="background:${GR[i+1]}"></span><div class="tx"><b>상품 이름 ${i+1}</b><span class="pr" data-p="${[18000,24000][i]}">${[18000,24000][i].toLocaleString()}원</span><div class="qty"><button class="mn" disabled>−</button><span>1</span><button class="pl">+</button></div></div></div>`).join('')}<div class="sumry"><div class="tt"><span>합계</span><span class="sum">42,000원</span></div></div></div></div>`,
 init(st){const upd=()=>{let s=0;st.querySelectorAll('.qrow').forEach(r=>{s+=(+r.querySelector('.pr').dataset.p)*(+r.querySelector('.qty span').textContent);});st.querySelector('.sum').textContent=s.toLocaleString()+'원';};st.querySelectorAll('.qty').forEach(q=>{const v=q.querySelector('span'),mn=q.querySelector('.mn');const set=n=>{v.textContent=n;mn.disabled=n<=1;v.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:200});upd();};q.querySelector('.pl').onclick=()=>set(+v.textContent+1);mn.onclick=()=>set(Math.max(1,+v.textContent-1));});}},
{cat:'comp',ko:'휠 피커',en:'Wheel Picker',alias:'드럼 피커, 롤 피커, 날짜 선택 휠',
 desc:'돌아가는 원통처럼 위아래로 굴려서 값을 고르는 피커예요. 가운데 강조된 줄이 선택된 값이에요. 날짜·시간 입력에 많이 써요.',
 dev:'UIPickerView · UIDatePicker(.wheels)',hint:'위아래 스크롤 · 드래그',
 html:`<div class="app">${bar('생년월일','back','')}<div class="m-body"><div style="padding:30px 16px;text-align:center"><small style="color:var(--muted)">선택한 날짜</small><div class="wv" style="font-size:20px;font-weight:900;margin-top:4px">1995년 6월 15일</div></div></div></div><div class="whw"><div class="hd"><span>날짜 선택</span><b>완료</b></div><div class="whs"><div class="wh" data-k="y">${Array.from({length:30},(_,i)=>`<div>${1985+i}</div>`).join('')}</div><div class="wh" data-k="m">${Array.from({length:12},(_,i)=>`<div>${i+1}월</div>`).join('')}</div><div class="wh" data-k="d">${Array.from({length:31},(_,i)=>`<div>${i+1}일</div>`).join('')}</div></div></div>`,
 init(st){const ws=[...st.querySelectorAll('.wh')],out=st.querySelector('.wv'),init={y:10,m:5,d:14};const val={};ws.forEach(w=>{const it=[...w.children];const upd=()=>{const i=Math.round(w.scrollTop/32);it.forEach((d,j)=>{d.classList.toggle('on',j===i);const dist=(j*32-w.scrollTop)/32;d.style.transform=`rotateX(${Math.max(-70,Math.min(70,-dist*22))}deg)`;});val[w.dataset.k]=it[i]?it[i].textContent:'';out.textContent=`${val.y||''}년 ${val.m||''} ${val.d||''}`.replace('년 ',(val.y?'년 ':''));};w.addEventListener('scroll',upd,{passive:true});requestAnimationFrame(()=>{w.scrollTop=init[w.dataset.k]*32;upd();});dragScroll(w,'y',()=>32);});}},
{cat:'comp',ko:'설정 리스트',en:'Settings List',alias:'그룹 리스트(Grouped List), 인셋 그룹, 테이블 뷰',
 desc:'항목을 그룹으로 묶은 설정 화면 목록이에요. 오른쪽에는 스위치, 현재 값, 화살표(Chevron, 다음 화면으로 이동) 중 하나를 둬요.',
 dev:'UITableView(.insetGrouped) · List',hint:'스위치 클릭',
 html:`<div class="app ios-bg">${bar('알림','back','')}<div class="m-body"><div class="m-sec">알림 받기</div><div class="grpl"><div class="r"><span class="l"><i class="ico" style="background:#ff3b30">${I('bell',13)}</i>푸시 알림</span><label class="m-sw"><input type="checkbox" checked><span></span></label></div><div class="r"><span class="l"><i class="ico" style="background:#34c759">${I('chat',13)}</i>댓글 알림</span><label class="m-sw"><input type="checkbox" checked><span></span></label></div><div class="r"><span class="l"><i class="ico" style="background:#ff9500">${I('heart',13)}</i>좋아요 알림</span><label class="m-sw"><input type="checkbox"><span></span></label></div></div><div class="m-sec">기타</div><div class="grpl"><div class="r"><span class="l">알림 소리</span><span class="v">기본${I('chev',13)}</span></div><div class="r"><span class="l">방해 금지 시간</span><span class="v">22:00~08:00${I('chev',13)}</span></div></div></div></div>`},
{cat:'comp',ko:'세그먼트 컨트롤',en:'Segmented Control',alias:'세그먼티드 버튼, 토글 탭',
 desc:'2~4개 옵션 중 하나를 골라 같은 화면의 보기 방식을 바꿔요. 탭보다 작고 화면 안 필터 역할을 해요.',
 dev:'UISegmentedControl · SegmentedButton',hint:'클릭',
 html:`<div class="app">${bar('통계','back','')}<div class="iseg"><i class="pill"></i><button class="on">일간</button><button>주간</button><button>월간</button></div><div class="m-body"><div class="segv" style="padding:6px 14px"><small style="color:var(--muted)">오늘 방문자</small><div class="segn" style="font-size:26px;font-weight:900">1,284</div></div>${cards(2)}</div></div>`,
 init(st){const bs=[...st.querySelectorAll('.iseg button')],p=st.querySelector('.iseg .pill'),n=st.querySelector('.segn'),l=st.querySelector('.segv small');const D=[['오늘 방문자','1,284'],['이번 주 방문자','8,930'],['이번 달 방문자','36,402']];bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(x=>x.classList.toggle('on',x===b));p.style.transform=`translateX(${i*100}%)`;l.textContent=D[i][0];n.textContent=D[i][1];n.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:250});});}},

 html:`<div class="app">${bar('기획전','','search')}<div class="m-body"><div style="padding:6px 16px 10px;font-size:15px;font-weight:900">이번 주 추천</div><div class="pkc">${['봄 신상','홈카페','캠핑','오피스'].map((t,i)=>`<div style="background:${GR[i]}">${t}</div>`).join('')}</div><div class="pdots"><i class="on"></i><i></i><i></i><i></i></div>${cards(1,2)}</div></div>`,

{cat:'comp',ko:'페이지 인디케이터',en:'Page Indicator',alias:'페이지 컨트롤, 도트 인디케이터, 페이지 넘버',
 desc:'여러 장 중 몇 번째인지 알려줘요. 점(Dots), 늘어나는 알약(Expanding dot), 숫자(1/5) 방식이 있어요.',

{cat:'comp',ko:'인증번호 입력',en:'OTP Input',alias:'PIN 코드 입력, 인증 코드 필드, 원타임 패스워드',
 desc:'한 칸에 한 글자씩 입력하고, 입력하면 다음 칸으로 자동 이동해요. 문자로 받은 번호를 자동 입력(AutoFill)하는 기능과 함께 써요.',
 dev:'textContentType = .oneTimeCode',hint:'숫자 입력',
 html:`<div class="app">${bar('본인 인증','back','')}<div class="m-body" style="padding:20px 14px 0;text-align:center"><b style="font-size:15px">인증번호를 입력해 주세요</b><p style="margin:6px 0 0;font-size:11px;color:var(--muted)">010-****-1234로 보낸 6자리</p><div class="otp">${'<input inputmode="numeric" maxlength="1">'.repeat(6)}</div><div class="otp-msg">남은 시간 02:59</div></div></div>`,
 init(st,c){const w=st.querySelector('.otp'),ins=[...w.querySelectorAll('input')],m=st.querySelector('.otp-msg');let t=179;c.every(()=>{if(w.classList.contains('ok'))return;t=Math.max(0,t-1);m.textContent=`남은 시간 0${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;},1000);ins.forEach((inp,i)=>{inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);if(inp.value&&ins[i+1])ins[i+1].focus();if(ins.every(x=>x.value)){w.classList.add('ok');m.textContent='✓ 인증이 완료됐어요';m.style.color='#34c759';}});inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&ins[i-1]){ins[i-1].focus();ins[i-1].value='';w.classList.remove('ok');m.style.color='';}});});}},
{cat:'comp',ko:'코치마크',en:'Coachmark',alias:'온보딩 툴팁, 기능 안내, 스포트라이트 가이드',
 desc:'처음 쓰는 사용자에게 화면의 특정 부분을 밝게 비추며 기능을 알려줘요. 나머지는 어둡게 덮어요.',
 dev:'TapTargetView · Spotlight',hint:'다음 클릭',
 html:`<div class="app">${bar('홈','menu','filter')}<div class="m-body">${cards(3)}</div>${tabbar(0)}</div><div class="cm-hole"></div><div class="cm-tip"><b></b><span></span><div class="ft"><span class="cn"></span><button>다음</button></div></div>`,
 init(st){const h=st.querySelector('.cm-hole'),tip=st.querySelector('.cm-tip'),btn=tip.querySelector('button');const S=[{l:170,t:30,w:34,h:34,tt:120,b:'필터가 새로워졌어요',s:'여기서 원하는 조건으로 빠르게 걸러보세요.'},{l:110,t:380,w:56,h:46,tt:270,b:'찜 목록',s:'마음에 드는 상품은 여기 모여요.'}];let i=0;const set=()=>{if(i>=S.length){h.style.opacity=0;tip.style.opacity=0;setTimeout(()=>{h.style.display='none';tip.style.display='none';},300);return;}const s=S[i];Object.assign(h.style,{left:s.l+'px',top:s.t+'px',width:s.w+'px',height:s.h+'px'});tip.style.top=s.tt+'px';tip.querySelector('b').textContent=s.b;tip.querySelector('span').textContent=s.s;tip.querySelector('.cn').textContent=`${i+1} / ${S.length}`;btn.textContent=i===S.length-1?'확인':'다음';};btn.onclick=()=>{i++;set();};set();}},
{cat:'comp',ko:'하단 고정 CTA',en:'Sticky Bottom CTA',alias:'플로팅 구매 버튼, 하단 버튼 바, 고정 버튼',
 desc:'스크롤해도 화면 아래에 붙어 있는 주요 행동 버튼이에요. 홈 인디케이터와 겹치지 않도록 아래쪽 세이프 에어리어만큼 여백을 둬요.',
 dev:'safeAreaInset(edge: .bottom)',hint:'스크롤 · ♡ 클릭',
 html:`<div class="app">${bar('상품 상세','back','share')}<div class="m-body"><div class="pdp-img" style="background:${GR[3]}"></div><div class="pdp-in"><small>브랜드</small><b>라운지 체어</b><div class="pr"><em>20%</em>129,000원</div></div>${cards(3)}<div style="height:90px"></div></div></div><div class="sbcta"><span class="hb">${I('heart',18)}</span><button class="m-cta">구매하기</button></div><span class="lbl o" style="left:50%;transform:translateX(-50%);bottom:6px">Safe Area</span>`,

{cat:'comp',ko:'기간 선택 캘린더',en:'Date Range Picker',alias:'달력, 체크인/체크아웃 선택, 캘린더 피커',
 desc:'시작일과 종료일을 차례로 눌러 기간을 골라요. 사이 날짜는 연한 색 띠로 이어 보여줘요. 숙박·예약 서비스에서 많이 써요.',
 dev:'DateRangePicker · UICalendarView',hint:'날짜 두 번 클릭',
 html:`<div class="app">${bar('날짜 선택','close','')}<div class="calsum"><div>체크인<b class="ci">12월 4일</b></div><div>체크아웃<b class="co">12월 7일</b></div></div><div class="m-body"><div class="cal"><div class="mh"><span>‹</span><span>2026년 12월</span><span>›</span></div><div class="wk">${'일월화수목금토'.split('').map(d=>`<span>${d}</span>`).join('')}</div><div class="ds"></div></div></div><div class="m-pad" style="padding-bottom:28px"><button class="m-cta cta">3박 · 선택 완료</button></div></div>`,
 init(st){const ds=st.querySelector('.ds'),ci=st.querySelector('.ci'),co=st.querySelector('.co'),cta=st.querySelector('.cta');const first=new Date(2026,11,1).getDay();let s=4,e=7;const draw=()=>{ds.innerHTML='';for(let i=0;i<first;i++)ds.insertAdjacentHTML('beforeend','<span class="mu"></span>');for(let d=1;d<=31;d++){const sp=document.createElement('span');sp.textContent=d;if(d===s)sp.classList.add('s');if(e&&d===e)sp.classList.add('e');if(d===s&&e)sp.classList.add('hasE');if(e&&d>s&&d<e)sp.classList.add('in');sp.onclick=()=>{if(!s||e){s=d;e=null;}else if(d>s){e=d;}else{s=d;}draw();};ds.appendChild(sp);}ci.textContent=s?`12월 ${s}일`:'-';co.textContent=e?`12월 ${e}일`:'선택';cta.textContent=e?`${e-s}박 · 선택 완료`:'체크아웃 날짜를 선택하세요';cta.disabled=!e;};draw();}},
{cat:'comp',ko:'단계 진행 바',en:'Step Progress',alias:'프로그레스 헤더, 온보딩 단계, 설문 진행률',
 desc:'회원가입·설문처럼 여러 단계 흐름에서 상단 막대로 진행률을 보여줘요. 다음을 누를 때마다 채워져요.',
 dev:'LinearProgressIndicator · ProgressView',hint:'다음 클릭',
 html:`<div class="app">${bar('','back','')}<div class="stp-top"><div class="bar"><i></i></div><span class="n">1/4</span></div><div class="m-body"><div class="stp-q"><h3>이름을 알려주세요</h3><p>프로필에 표시돼요</p></div><div class="tf"><div class="w"><input placeholder="입력"></div></div></div><div class="m-pad" style="padding-bottom:28px"><button class="m-cta nx">다음</button></div></div>`,
 init(st){const Q=['이름을 알려주세요','관심 분야를 골라주세요','알림을 받을까요?','거의 다 됐어요!'];let i=0;const b=st.querySelector('.stp-top i'),n=st.querySelector('.stp-top .n'),h=st.querySelector('.stp-q h3'),nx=st.querySelector('.nx');const set=()=>{b.style.width=((i+1)/4*100)+'%';n.textContent=`${i+1}/4`;h.textContent=Q[i];nx.textContent=i===3?'완료':'다음';st.querySelector('.stp-q').animate([{opacity:0,transform:'translateX(20px)'},{opacity:1,transform:'none'}],{duration:300});};nx.onclick=()=>{i=(i+1)%4;set();};st.querySelector('.m-bar .bi').onclick=()=>{i=Math.max(0,i-1);set();};set();}},
{cat:'comp',ko:'아코디언',en:'Accordion',alias:'접기/펼치기, 익스팬더블 리스트, FAQ',
 desc:'제목을 누르면 아래로 내용이 펼쳐져요. 화살표(Chevron)가 회전하며 열림 상태를 알려줘요.',
 dev:'DisclosureGroup · ExpandableListView',hint:'클릭',
 html:`<div class="app">${bar('자주 묻는 질문','back','')}<div class="m-body m-acc">${[['배송은 얼마나 걸리나요?','결제 후 평균 2~3일 안에 도착해요. 도서산간 지역은 1~2일 더 걸릴 수 있어요.'],['교환·환불은 어떻게 하나요?','수령 후 7일 이내 마이페이지 > 주문내역에서 신청할 수 있어요.'],['회원 등급 혜택이 궁금해요','등급에 따라 쿠폰과 적립률이 달라져요.'],['비밀번호를 잊어버렸어요','로그인 화면의 "비밀번호 찾기"를 눌러주세요.']].map((q,i)=>`<div class="it ${i?'':'open'}"><button>${q[0]}${I('chev',14)}</button><div class="bd"><div><p>${q[1]}</p></div></div></div>`).join('')}</div></div>`,
 init(st){st.querySelectorAll('.m-acc button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));}},
{cat:'comp',ko:'텍스트 필드',en:'Text Field',alias:'입력창, 인풋, 입력 필드',
 desc:'라벨(Label), 입력 영역, 도움말(Helper text), 글자 수(Counter)로 구성돼요. 값이 있으면 지우기(Clear) 버튼이 나타나요.',
 dev:'TextField · clearButtonMode',hint:'입력',
 html:`<div class="app">${bar('프로필 수정','back','')}<div class="m-body"><div class="tf"><label>닉네임</label><div class="w"><input maxlength="20" value="디자이너"><button class="clr">×</button></div><div class="hp"><span>한글·영문 2~20자</span><span class="cnt">4/20</span></div></div><div class="tf"><label>소개</label><div class="w"><input maxlength="20" placeholder="한 줄 소개"><button class="clr">×</button></div><div class="hp"><span>선택 입력</span><span class="cnt">0/20</span></div></div></div></div>`,
 init(st){st.querySelectorAll('.tf').forEach(f=>{const i=f.querySelector('input'),c=f.querySelector('.cnt');const u=()=>{f.classList.toggle('has',!!i.value);c.textContent=`${i.value.length}/20`;};i.oninput=u;f.querySelector('.clr').onclick=()=>{i.value='';u();i.focus();};u();});}},
{cat:'comp',ko:'숫자 키패드',en:'Number Keypad',alias:'PIN 패드, 보안 키패드, 커스텀 키보드',
 desc:'앱이 직접 그리는 숫자 입력판이에요. 간편 비밀번호, 송금 금액 입력에 써요. 입력한 자리는 점으로 채워 보여줘요.',
 dev:'custom keypad · secure entry',hint:'숫자 4개 클릭',
 html:`<div class="app">${bar('','close','')}<div class="m-body"><div class="pin"><b>간편 비밀번호 입력</b><small>숫자 4자리를 눌러주세요</small><div class="pdts">${'<i></i>'.repeat(4)}</div><div class="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button>${n}</button>`).join('')}<button class="e"></button><button>0</button><button class="e del">⌫</button></div></div></div></div>`,
 init(st,c){let v='';const ds=[...st.querySelectorAll('.pdts i')],w=st.querySelector('.pdts'),sm=st.querySelector('.pin small');const draw=()=>ds.forEach((d,i)=>d.classList.toggle('f',i<v.length));st.querySelectorAll('.kp button').forEach(b=>b.onclick=()=>{if(b.classList.contains('del')){v=v.slice(0,-1);draw();return;}if(!b.textContent||v.length>=4)return;v+=b.textContent;draw();if(v.length===4){w.classList.add('ok');sm.textContent='✓ 확인됐어요';c.after(()=>{v='';w.classList.remove('ok');sm.textContent='숫자 4자리를 눌러주세요';draw();},1400);}});}},

/* ---------- GESTURE ---------- */
{cat:'gesture',ko:'스와이프 액션',en:'Swipe Actions',alias:'밀어서 삭제(Swipe to Delete), 스와이프 메뉴',
 desc:'목록을 옆으로 밀면 뒤에 숨은 버튼(보관·삭제)이 나타나요. 끝까지 밀면 바로 실행되는 방식(Full swipe)도 있어요.',
 dev:'swipeActions · ItemTouchHelper',hint:'행을 왼쪽으로 드래그',
 html:`<div class="app">${bar('메시지','','plus')}<div class="m-body">${Array.from({length:6},(_,i)=>`<div class="swr"><div class="acts"><button style="background:#ff9500">${I('archive',14)}보관</button><button class="del" style="background:#ff3b30">${I('trash',14)}삭제</button></div><div class="fg"><span class="av" style="background:${COL[i%6]}"></span><span class="tx"><b>대화 ${i+1}</b><small>왼쪽으로 밀어보세요</small></span></div></div>`).join('')}</div></div>`,
 init(st,c){const fgs=[];st.querySelectorAll('.swr').forEach(r=>{const fg=r.querySelector('.fg');fgs.push(fg);let x0=null,dx=0,base=0;fg.addEventListener('pointerdown',e=>{x0=e.clientX;fg.setPointerCapture(e.pointerId);fg.style.transition='none';fgs.forEach(o=>{if(o!==fg){o.style.transform='';o._b=0;}});base=fg._b||0;});fg.addEventListener('pointermove',e=>{if(x0===null)return;dx=Math.min(0,Math.max(-150,base+e.clientX-x0));fg.style.transform=`translateX(${dx}px)`;});const end=()=>{if(x0===null)return;x0=null;fg.style.transition='';fg._b=dx<-50?-120:0;fg.style.transform=`translateX(${fg._b}px)`;};fg.addEventListener('pointerup',end);fg.addEventListener('pointercancel',end);r.querySelectorAll('.acts button').forEach(b=>b.onclick=()=>{r.animate([{height:r.offsetHeight+'px',opacity:1},{height:'0px',opacity:0}],{duration:280,easing:'ease-in'}).onfinish=()=>r.remove();});});c.after(()=>{fgs[0].style.transform='translateX(-120px)';fgs[0]._b=-120;},700);c.after(()=>{fgs[0].style.transform='';fgs[0]._b=0;},2000);}},

 init(st,c){const L=st.querySelector('.ptr-list'),ind=st.querySelector('.ptr-ind');let y0=null,dy=0,busy=false,n=7;L.addEventListener('pointerdown',e=>{if(busy)return;y0=e.clientY;L.setPointerCapture(e.pointerId);L.style.transition='none';});L.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,(e.clientY-y0)*.5);dy=Math.min(dy,90);L.style.transform=`translateY(${dy}px)`;ind.style.opacity=Math.min(1,dy/50);ind.style.transform=`rotate(${dy*4}deg)`;});const end=()=>{if(y0===null)return;y0=null;L.style.transition='transform .35s cubic-bezier(.2,.9,.3,1)';if(dy>55){busy=true;L.style.transform='translateY(48px)';ind.classList.add('load');c.after(()=>{n++;L.insertAdjacentHTML('afterbegin',`<div class="m-row" style="background:#f3f5ff"><span class="av" style="background:#3d5afe"></span><span class="tx"><b>새 게시물 ${n}</b><small>방금 전</small></span></div>`);L.style.transform='';ind.classList.remove('load');ind.style.opacity=0;busy=false;},1100);}else{L.style.transform='';ind.style.opacity=0;}dy=0;};L.addEventListener('pointerup',end);L.addEventListener('pointercancel',end);}},

 init(st){const bl=st.querySelector('.lp-blur'),m=st.querySelector('.lp-menu');let cur=null,t=null;const close=()=>{bl.classList.remove('show');m.classList.remove('show');if(cur){cur.classList.remove('lift','raised');cur=null;}};st.querySelectorAll('.lp-it').forEach(it=>{it.addEventListener('pointerdown',()=>{it.classList.add('hold');t=setTimeout(()=>{it.classList.remove('hold');it.classList.add('lift','raised');cur=it;const sr=st.getBoundingClientRect(),r=it.getBoundingClientRect();let top=r.bottom-sr.top+8;if(top>st.clientHeight-130)top=r.top-sr.top-120;m.style.top=top+'px';bl.classList.add('show');m.classList.add('show');},500);});const cancel=()=>{clearTimeout(t);it.classList.remove('hold');};it.addEventListener('pointerup',cancel);it.addEventListener('pointerleave',cancel);it.addEventListener('contextmenu',e=>e.preventDefault());});bl.onclick=close;m.querySelectorAll('a').forEach(a=>a.onclick=close);}},

 init(st){const ph=st.querySelector('.dt-photo'),big=ph.querySelector('.big'),h=st.querySelector('.hrt'),lc=st.querySelector('.lc');let n=128,on=false;const set=v=>{if(on===v)return;on=v;n+=v?1:-1;h.classList.toggle('on',v);lc.textContent=`좋아요 ${n}개`;};ph.addEventListener('dblclick',()=>{set(true);big.animate([{opacity:0,transform:'scale(.3)'},{opacity:1,transform:'scale(1.15)',offset:.25},{opacity:1,transform:'scale(1)',offset:.6},{opacity:0,transform:'scale(1.3) translateY(-20px)'}],{duration:900,easing:'ease-out'});burst(h);});h.onclick=()=>{set(!on);if(on)burst(h);};}},
{cat:'gesture',ko:'드래그 투 디스미스',en:'Drag to Dismiss',alias:'끌어서 닫기, 스와이프 다운 닫기',

 init(st){const v=st.querySelector('.dd-view'),im=v.querySelector('.dd-img'),ph=st.parentElement;let y0=null,dy=0;const open=()=>{v.style.display='grid';v.style.background='#000';im.style.transform='';ph.classList.add('dark');v.animate([{opacity:0},{opacity:1}],{duration:250});};const close=()=>{im.style.transform=`translateY(${Math.max(dy,0)+300}px) scale(.6)`;v.animate([{background:v.style.background||'#000'},{background:'rgba(0,0,0,0)'}],{duration:300,fill:'forwards'}).onfinish=a=>{v.style.display='none';ph.classList.remove('dark');v.getAnimations().forEach(x=>x.cancel());};};im.addEventListener('pointerdown',e=>{y0=e.clientY;im.setPointerCapture(e.pointerId);im.style.transition='none';});im.addEventListener('pointermove',e=>{if(y0===null)return;dy=e.clientY-y0;const p=Math.min(1,Math.abs(dy)/300);im.style.transform=`translateY(${dy}px) scale(${1-p*.35})`;v.style.background=`rgba(0,0,0,${1-p})`;});const end=()=>{if(y0===null)return;y0=null;im.style.transition='';if(Math.abs(dy)>90)close();else{im.style.transform='';v.style.background='#000';}dy=0;};im.addEventListener('pointerup',end);im.addEventListener('pointercancel',end);v.querySelector('.dd-close').onclick=()=>{dy=0;close();};st.querySelector('.dd-re button').onclick=open;ph.classList.add('dark');}},

 init(st){const S=st.querySelector('.sc-stack');const D=[['서울 성수','카페 · 1.2km'],['부산 해운대','바다 · 340km'],['제주 애월','숙소 · 450km'],['강릉 안목','커피거리 · 160km']];let k=0;const make=()=>{const d=D[k%D.length],el=document.createElement('div');el.className='sc-card';el.style.background=GR[k%GR.length];el.innerHTML=`<span class="st like">LIKE</span><span class="st nope">NOPE</span><b>${d[0]}</b><small>${d[1]}</small>`;k++;S.prepend(el);bind(el);};const fly=(el,dir)=>{el.style.transition='transform .4s ease-in';el.style.transform=`translateX(${dir*320}px) rotate(${dir*30}deg)`;setTimeout(()=>{el.remove();make();},380);};const bind=el=>{let x0=null,dx=0;el.addEventListener('pointerdown',e=>{if(el!==S.lastElementChild)return;x0=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none';});el.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/12}deg)`;el.querySelector('.like').style.opacity=Math.max(0,dx/80);el.querySelector('.nope').style.opacity=Math.max(0,-dx/80);});const end=()=>{if(x0===null)return;x0=null;if(Math.abs(dx)>80)fly(el,Math.sign(dx));else{el.style.transition='';el.style.transform='';el.querySelectorAll('.st').forEach(s=>s.style.opacity=0);}dx=0;};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);};for(let i=0;i<3;i++)make();st.querySelector('.no').onclick=()=>fly(S.lastElementChild,-1);st.querySelector('.yes').onclick=()=>fly(S.lastElementChild,1);}},
{cat:'gesture',ko:'엣지 스와이프 백',en:'Edge Swipe Back',alias:'뒤로 가기 제스처, 가장자리 스와이프, 인터랙티브 팝',
 desc:'화면 왼쪽 가장자리에서 오른쪽으로 밀면 이전 화면이 드러나며 뒤로 가요. 손가락을 따라 실시간으로 움직이는 게 핵심이에요.',
 dev:'interactivePopGestureRecognizer · predictive back',hint:'왼쪽 끝(주황)에서 오른쪽으로 드래그',
 html:`<div class="esb"><div class="pa">${bar('목록','','')}<div class="m-body">${rows(7,{t:'항목'})}</div></div><div class="pb">${bar('상세','back','')}<div class="m-body"><div class="det-hero"></div><div class="det-tx"><b>상세 화면</b><span class="m-ln"></span><span class="m-ln" style="width:70%"></span></div></div></div><div class="edge"></div></div>`,
 init(st,c){const A=st.querySelector('.pa'),B=st.querySelector('.pb'),E=st.querySelector('.edge');const W=()=>st.clientWidth;let x0=null,dx=0;const put=x=>{B.style.transform=`translateX(${x}px)`;A.style.transform=`translateX(${-W()*.3+x*.3}px)`;A.style.filter=`brightness(${.7+.3*x/W()})`;};const anim=on=>{B.style.transition=A.style.transition='transform .35s cubic-bezier(.2,.9,.3,1),filter .35s';put(on?0:W());E.style.display=on?'':'none';};const reset=()=>{anim(true);};put(0);E.addEventListener('pointerdown',e=>{x0=e.clientX;E.setPointerCapture(e.pointerId);B.style.transition=A.style.transition='none';});E.addEventListener('pointermove',e=>{if(x0===null)return;dx=Math.max(0,e.clientX-x0);put(dx);});const end=()=>{if(x0===null)return;x0=null;if(dx>W()*.35){anim(false);c.after(reset,1200);}else anim(true);dx=0;};E.addEventListener('pointerup',end);E.addEventListener('pointercancel',end);A.querySelectorAll('.m-row').forEach(r=>r.onclick=reset);B.querySelector('.bi').onclick=()=>{anim(false);c.after(reset,1200);};}},
{cat:'gesture',ko:'핀치 줌',en:'Pinch to Zoom',alias:'두 손가락 확대, 핀치 아웃/인',
 desc:'두 손가락을 벌리면 확대(Pinch out), 모으면 축소(Pinch in)돼요. 사진·지도에서 써요. (데모는 손가락 위치를 자동으로 보여줘요)',

{cat:'gesture',ko:'드래그 정렬',en:'Drag to Reorder',alias:'순서 변경, 소터블 리스트, 재정렬',
 desc:'오른쪽 핸들(≡)을 잡고 위아래로 끌어 순서를 바꿔요. 잡은 항목은 살짝 떠오르며 그림자가 생겨요.',

 init(st){const L=st.querySelector('.ro-list');const num=()=>L.querySelectorAll('.ro-it').forEach((x,i)=>x.querySelector('.n').textContent=i+1);L.querySelectorAll('.hd').forEach(h=>{const it=h.parentElement;let act=false;h.addEventListener('pointerdown',e=>{act=true;h.setPointerCapture(e.pointerId);it.classList.add('drag');});h.addEventListener('pointermove',e=>{if(!act)return;const sib=[...L.querySelectorAll('.ro-it')].filter(x=>x!==it);const nxt=sib.find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2;});const before=L.querySelectorAll('.ro-it');const firstRects=new Map([...before].map(x=>[x,x.getBoundingClientRect().top]));if(nxt){if(nxt.previousElementSibling!==it)L.insertBefore(it,nxt);}else if(L.lastElementChild!==it)L.appendChild(it);[...L.querySelectorAll('.ro-it')].forEach(x=>{if(x===it)return;const d=firstRects.get(x)-x.getBoundingClientRect().top;if(d)x.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:180,easing:'ease-out'});});num();});const end=()=>{act=false;it.classList.remove('drag');};h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);});}},
{cat:'gesture',ko:'밀어서 확인',en:'Slide to Confirm',alias:'슬라이드 투 언락, 밀어서 결제, 스와이프 버튼',

 dev:'SlideToConfirm · drag threshold',hint:'원을 오른쪽 끝까지 드래그',
 html:`<div class="app">${bar('결제 확인','back','')}<div class="m-body"><div class="sumry" style="margin-top:20px"><div><span>상품 금액</span><span>45,000원</span></div><div><span>배송비</span><span>3,000원</span></div><div class="tt"><span>총 결제금액</span><span>48,000원</span></div></div></div></div><div class="stc"><i class="fill"></i><span class="tx">밀어서 결제하기  ›››</span><span class="kn">${I('chev',18)}</span></div>`,
 init(st,c){const T=st.querySelector('.stc'),k=T.querySelector('.kn'),f=T.querySelector('.fill'),tx=T.querySelector('.tx');let x0=null,dx=0;const max=()=>T.clientWidth-52;k.addEventListener('pointerdown',e=>{if(T.classList.contains('done'))return;x0=e.clientX;k.setPointerCapture(e.pointerId);k.style.transition=f.style.transition='none';});k.addEventListener('pointermove',e=>{if(x0===null)return;dx=Math.max(0,Math.min(max(),e.clientX-x0));k.style.transform=`translateX(${dx}px)`;f.style.width=(dx+48)+'px';});const end=()=>{if(x0===null)return;x0=null;k.style.transition=f.style.transition='transform .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)';if(dx>max()*.9){k.style.transform=`translateX(${max()}px)`;f.style.width='100%';T.classList.add('done');tx.textContent='✓ 결제 완료';k.innerHTML=I('check',18);c.after(()=>{T.classList.remove('done');tx.textContent='밀어서 결제하기  ›››';k.innerHTML=I('chev',18);k.style.transform='';f.style.width='0';},1800);}else{k.style.transform='';f.style.width='0';}dx=0;};k.addEventListener('pointerup',end);k.addEventListener('pointercancel',end);}},
{cat:'gesture',ko:'팬 (드래그 이동)',en:'Pan',alias:'지도 드래그, 화면 끌기, 패닝',
 desc:'화면을 손가락으로 끌어서 보이는 영역을 옮겨요. 지도, 큰 이미지, 캔버스 편집 화면에서 써요.',

 init(st){const p=st.querySelector('.pan'),m=p.querySelector('.mp');let x0,y0,bx=-200,by=-200,cx=bx,cy=by,act=false;p.addEventListener('pointerdown',e=>{act=true;x0=e.clientX;y0=e.clientY;p.setPointerCapture(e.pointerId);p.style.cursor='grabbing';});p.addEventListener('pointermove',e=>{if(!act)return;cx=Math.min(0,Math.max(-(620-p.clientWidth),bx+e.clientX-x0));cy=Math.min(0,Math.max(-(820-p.clientHeight),by+e.clientY-y0));m.style.left=cx+'px';m.style.top=cy+'px';});const end=()=>{act=false;bx=cx;by=cy;p.style.cursor='';};p.addEventListener('pointerup',end);p.addEventListener('pointercancel',end);}},

{cat:'trans',ko:'페이드 스루',en:'Fade Through',alias:'머티리얼 페이드, 크로스 페이드',

 dev:'MaterialFadeThrough',hint:'자동 재생 · 열기/← 클릭',html:MP(),init:mtrans('fadeThrough')},
{cat:'trans',ko:'공유 축 전환',en:'Shared Axis',alias:'머티리얼 X축 전환, 단계 이동 전환',
 desc:'두 화면이 같은 방향(X축)으로 조금씩 움직이며 교차해요. 온보딩 단계처럼 순서가 있는 화면에 써요(Material Motion).',

{cat:'trans',ko:'컨테이너 트랜스폼',en:'Container Transform',alias:'공유 요소 전환(Shared Element), 히어로 애니메이션, 카드 확장',
 desc:'목록의 카드가 그대로 커지며 상세 화면이 돼요. 두 화면을 같은 요소로 이어서 맥락이 끊기지 않아요.',
