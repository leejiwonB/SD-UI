{cat:'screen',ko:'상품 상세',en:'Product Detail (PDP)',alias:'PDP, 상세 페이지, 상품 페이지',
 desc:'이미지 슬라이드, 브랜드·상품명·가격, 상세 정보, 하단 고정 구매 버튼으로 구성돼요. 커머스에선 PDP(Product Detail Page)라고 불러요.',
 dev:'ProductDetailView',hint:'스크롤',
 html:`<div class="app">${bar('','back','share')}<div class="m-body"><div class="pdp-img" style="background:${GR[1]}"><span class="num">1 / 5</span></div><div class="pdp-in"><small>BRAND</small><b style="font-size:14px">오버핏 울 코트</b><div class="pr"><em>30%</em>139,000원</div><small>★ 4.8 (리뷰 1,204)</small></div>${cards(2,3)}<div style="height:80px"></div></div></div><div class="sbcta"><span class="hb">${I('heart',18)}</span><button class="m-cta">구매하기</button></div>`},
{cat:'screen',ko:'장바구니',en:'Cart',alias:'쇼핑백, 카트',
 desc:'담은 상품 목록, 선택 체크박스, 수량 조절, 결제 예정 금액 요약, 주문 버튼으로 구성돼요.',
 dev:'CartView',
 html:`<div class="app">${bar('장바구니','back','')}<div class="m-body"><div style="padding:8px 12px;font-size:11px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #f1f0eb"><span class="ck-box">${I('check',11)}</span>전체 선택 (2/2)</div>${[0,1].map(i=>`<div class="ck-row"><span class="ck-box">${I('check',11)}</span><span style="width:50px;height:50px;border-radius:10px;background:${GR[i]};flex:none"></span><span style="flex:1;display:flex;flex-direction:column;gap:5px;font-size:11.5px"><b>상품 이름 ${i+1}</b><small style="color:var(--muted)">옵션: 블랙 / M</small><b>${['24,000','18,000'][i]}원</b></span></div>`).join('')}<div class="sumry"><div><span>상품 금액</span><span>42,000원</span></div><div><span>배송비</span><span>무료</span></div><div class="tt"><span>결제 예정 금액</span><span>42,000원</span></div></div></div><div class="m-pad" style="padding-bottom:28px"><button class="m-cta">2개 · 42,000원 주문하기</button></div></div>`},
{cat:'screen',ko:'결제',en:'Checkout',alias:'주문서, 결제 화면, 오더 페이지',
 desc:'배송지, 결제 수단, 최종 금액을 확인하고 결제하는 화면이에요. 결제 수단은 카드형 라디오로 고르게 해요.',
 dev:'CheckoutView · PaymentSheet',hint:'결제 수단 클릭',
 html:`<div class="app">${bar('주문/결제','back','')}<div class="m-body"><div class="m-sec">배송지</div><div class="addr"><b>김디자인</b> · 010-1234-5678<br>서울시 성동구 성수이로 00, 101호</div><div class="m-sec">결제 수단</div><div class="paym"><span class="on">신용카드</span><span>간편결제</span><span>계좌이체</span><span>휴대폰</span></div><div class="sumry" style="margin-top:12px"><div><span>상품 금액</span><span>45,000원</span></div><div><span>배송비</span><span>3,000원</span></div><div class="tt"><span>최종 결제 금액</span><span>48,000원</span></div></div></div><div class="m-pad" style="padding-bottom:28px"><button class="m-cta">48,000원 결제하기</button></div></div>`,
 init(st){const ps=[...st.querySelectorAll('.paym span')];ps.forEach(p=>p.onclick=()=>ps.forEach(x=>x.classList.toggle('on',x===p)));}},
{cat:'screen',ko:'검색 결과',en:'Search Results',alias:'검색 목록, SRP(Search Result Page)',
 desc:'상단 검색어, 필터·정렬 칩, 결과 개수, 결과 목록으로 구성돼요. 결과가 없을 때의 빈 화면도 함께 디자인해 두세요.',
 dev:'SearchResultsView',
 html:`<div class="app"><div class="sbar" style="padding-top:6px"><span style="color:var(--ink)">${I('back')}</span><div class="fld">${I('search',14)}<input value="러닝화"></div></div><div class="fchips" style="padding-top:2px">${['정렬: 추천순','가격','브랜드','사이즈','무료배송'].map((t,i)=>`<span class="m-chip ${i?'':'on'}">${t}</span>`).join('')}</div><div class="fcount">검색 결과 1,204개</div><div class="m-body">${rows(7,{t:'러닝화 상품',s:'89,000원 · ★4.7'})}</div></div>`,
 init(st){dragScroll(st.querySelector('.fchips'),'x');}},
{cat:'screen',ko:'마이페이지',en:'My Page',alias:'MY, 프로필 탭, 내 정보',
 desc:'프로필, 주문·쿠폰·포인트 같은 요약 숫자, 메뉴 목록으로 구성돼요. 보통 탭 바의 맨 오른쪽 탭이에요.',
 dev:'ProfileView',
 html:`<div class="app">${bar('MY','','bell')}<div class="m-body"><div class="mp-prof"><span class="av"></span><span style="display:flex;flex-direction:column;gap:2px"><b>김디자인</b><small style="color:var(--muted);font-size:10.5px">GOLD 회원 ›</small></span></div><div class="mp-stat"><div><b>3</b>주문</div><div><b>5</b>쿠폰</div><div><b>2,400</b>포인트</div></div>${['주문/배송 조회','리뷰 관리','최근 본 상품','고객센터','설정'].map(t=>`<div class="m-row"><span class="tx"><b style="font-weight:500">${t}</b></span>${I('chev',14)}</div>`).join('')}</div>${tabbar(3)}</div>`},
{cat:'screen',ko:'설정',en:'Settings',alias:'환경설정, 앱 설정',
 desc:'항목을 성격별로 묶은 그룹 리스트예요. 스위치, 현재 값, 다음 화면 화살표가 섞여 있고, 맨 아래 로그아웃·탈퇴를 둬요.',
 dev:'Form · PreferenceScreen',hint:'스위치 클릭',
 html:`<div class="app ios-bg">${bar('설정','back','')}<div class="m-body"><div class="m-sec">계정</div><div class="grpl"><div class="r"><span class="l">이메일</span><span class="v">kim@mail.com</span></div><div class="r"><span class="l">비밀번호 변경</span>${I('chev',13)}</div></div><div class="m-sec">앱 설정</div><div class="grpl"><div class="r"><span class="l">다크 모드</span><label class="m-sw"><input type="checkbox"><span></span></label></div><div class="r"><span class="l">자동 재생</span><label class="m-sw"><input type="checkbox" checked><span></span></label></div><div class="r"><span class="l">언어</span><span class="v">한국어${I('chev',13)}</span></div></div><div class="grpl"><div class="r" style="color:#ff3b30;justify-content:center">로그아웃</div></div></div></div>`},
{cat:'screen',ko:'알림 목록',en:'Notifications',alias:'알림 센터, 알림함, 액티비티',
 desc:'받은 알림을 시간순으로 보여줘요. 오늘·이번 주처럼 구간을 나누고, 읽지 않은 알림은 배경색과 점으로 구분해요.',
 dev:'NotificationListView',hint:'알림 클릭',
 html:`<div class="app">${bar('알림','back','')}<div class="m-body"><div class="m-sec">오늘</div>${[['민지님이 회원님의 글을 좋아해요','방금'],['새 댓글: "멋져요!"','12분 전'],['주문하신 상품이 출발했어요','1시간 전']].map((n,i)=>`<div class="nt-row new"><span class="av" style="background:${GR[i]}"></span><span class="tx">${n[0]}<small>${n[1]}</small></span></div>`).join('')}<div class="m-sec">이번 주</div>${[['쿠폰이 곧 만료돼요','3일 전'],['팔로우한 브랜드의 신상품','5일 전']].map((n,i)=>`<div class="nt-row"><span class="av" style="background:${COL[i+2]}"></span><span class="tx">${n[0]}<small>${n[1]}</small></span></div>`).join('')}</div></div>`,
 init(st){st.querySelectorAll('.nt-row').forEach(r=>r.onclick=()=>r.classList.remove('new'));}},
{cat:'screen',ko:'채팅',en:'Chat',alias:'메신저, 대화방, 채팅방',
 desc:'상대 말풍선은 왼쪽, 내 말풍선은 오른쪽이에요. 아래엔 입력창(Composer)과 전송 버튼, 상대가 입력 중이면 점 세 개가 나타나요.',
 dev:'MessageList · Composer · typing indicator',hint:'메시지 입력 후 전송',
 html:`<div class="app">${bar('민지','back','more')}<div class="chat"><span class="ctime">오늘 오후 2:10</span><div class="bb l">시안 확인했어요! 👀</div><div class="bb l">모달 부분은 바텀 시트로 바꿔볼까요?</div><div class="bb r">좋아요, 드래그로 닫히게 할게요</div></div><div class="cin"><input placeholder="메시지 입력"><button>${I('send',15)}</button></div></div>`,
 init(st,c){const ch=st.querySelector('.chat'),inp=st.querySelector('.cin input');const R=['네 좋아요!','확인했습니다 🙌','그 방향으로 가요','멋지네요!'];let k=0;const send=()=>{const v=inp.value.trim()||'이 페이지 참고해 주세요';inp.value='';ch.insertAdjacentHTML('beforeend',`<div class="bb r"></div>`);ch.lastElementChild.textContent=v;ch.scrollTop=ch.scrollHeight;c.after(()=>{ch.insertAdjacentHTML('beforeend','<div class="bb l typing"><i></i><i></i><i></i></div>');ch.scrollTop=ch.scrollHeight;c.after(()=>{const t=ch.querySelector('.typing');if(t)t.remove();ch.insertAdjacentHTML('beforeend',`<div class="bb l">${R[k++%R.length]}</div>`);ch.scrollTop=ch.scrollHeight;},1200);},400);};st.querySelector('.cin button').onclick=send;inp.addEventListener('keydown',e=>{if(e.key==='Enter')send();});}},
{cat:'screen',ko:'지도 + 바텀 시트',en:'Map with Sheet',alias:'지도 화면, 장소 탐색, 맵 뷰',
 desc:'지도 위에 검색창, 핀(마커), 장소 목록 바텀 시트를 겹쳐 둬요. 핀을 누르면 강조되고 시트의 내용이 바뀌어요.',
 dev:'MapView + Annotation + BottomSheet',hint:'핀 클릭',
 html:`<div class="xs-map"></div><div class="mapsrch">${I('search',14)}카페 검색</div>${[[40,120],[120,170],[80,230],[150,110]].map(([x,y],i)=>`<span class="mpin ${i?'':'on'}" style="left:${x}px;top:${y}px"><i></i></span>`).join('')}<div class="xs" style="top:62%"><div class="xhd"><div class="grab"></div><b class="pn">카페 1</b><small style="display:block;color:var(--muted);font-size:10.5px">영업 중 · 120m · ★4.6</small></div><div class="m-body">${rows(4,{t:'근처 카페',s:'도보 3분'})}</div></div>`,
 init(st){const ps=[...st.querySelectorAll('.mpin')],n=st.querySelector('.pn');ps.forEach((p,i)=>p.onclick=()=>{ps.forEach(x=>x.classList.toggle('on',x===p));n.textContent=`카페 ${i+1}`;n.parentElement.animate([{opacity:.3},{opacity:1}],{duration:250});});}},

/* ---------- DEVICE ---------- */
{cat:'device',ko:'상태 표시줄',en:'Status Bar',alias:'스테이터스 바, 시스템 바',
 desc:'시간·신호·배터리가 표시되는 맨 위 영역이에요. 앱이 그리는 공간이 아니므로, 배경색에 따라 글자색을 밝게/어둡게 지정해요.',
 dev:'preferredStatusBarStyle · statusBarColor',
 html:`<div class="app">${bar('홈','','bell')}<div class="m-body">${cards(3)}</div></div><div class="dz blue" style="top:0;height:26px"></div><span class="lbl" style="left:50%;transform:translateX(-50%);top:32px">Status Bar · 약 54pt(iPhone)</span>`},
{cat:'device',ko:'다이나믹 아일랜드 · 노치',en:'Dynamic Island · Notch',alias:'펀치홀, 노치, 카메라 컷아웃',
 desc:'화면 위 카메라가 있는 검은 영역이에요. 아이폰의 다이나믹 아일랜드는 진행 중인 활동(타이머, 음악)에 따라 모양이 늘어나요. 이 자리엔 중요한 UI를 두지 마세요.',
 dev:'Live Activities · ActivityKit',hint:'버튼 클릭',
 html:`<div class="app">${bar('타이머','','')}<div class="m-body" style="display:flex;flex-direction:column;align-items:center;padding-top:60px;gap:16px"><b style="font-size:34px;font-variant-numeric:tabular-nums">05:00</b><button class="m-cta tgl" style="width:auto;padding:0 20px">타이머 시작</button></div></div><span class="lbl o" style="left:50%;transform:translateX(-50%);top:40px">Dynamic Island</span>`,
 init(st){const isl=st.parentElement.querySelector('.ph-island');isl.classList.remove('big');isl.innerHTML='<span>⏱ 타이머</span><span style="color:#ff9f0a">04:59</span>';const b=st.querySelector('.tgl');b.onclick=()=>{const on=isl.classList.toggle('big');b.textContent=on?'타이머 정지':'타이머 시작';};}},
{cat:'device',ko:'세이프 에어리어',en:'Safe Area',alias:'안전 영역, 인셋(Insets), 세이프 존',
 desc:'상태 표시줄·홈 인디케이터·둥근 모서리에 가리지 않는 안전한 영역이에요. 버튼·글자는 이 안에 두고, 배경만 바깥까지 채워요.',
 dev:'safeAreaInsets · WindowInsets',
 html:`<div class="app">${bar('홈','','bell')}<div class="m-body">${cards(4)}</div></div><div class="dz hatch" style="top:0;height:26px"></div><div class="dz hatch" style="bottom:0;height:24px"></div><span class="lbl o" style="left:8px;top:32px">Safe Area Inset · Top</span><span class="lbl o" style="left:8px;bottom:30px">Safe Area Inset · Bottom</span>`},
{cat:'device',ko:'홈 인디케이터',en:'Home Indicator',alias:'홈 바, 제스처 바',
 desc:'화면 맨 아래 가로 막대예요. 위로 쓸어 올리면 홈으로 가는 시스템 제스처 영역이라, 그 위에 버튼을 바짝 붙이지 않아요.',
 dev:'prefersHomeIndicatorAutoHidden',
 html:`<div class="app">${bar('홈','','bell')}<div class="m-body">${cards(3)}</div>${tabbar(0)}</div><div class="dz blue" style="bottom:0;height:22px"></div><span class="lbl" style="left:50%;transform:translateX(-50%);bottom:28px">Home Indicator 영역</span>`},
{cat:'device',ko:'키보드 영역',en:'Keyboard Area',alias:'소프트 키보드, 키보드 인셋, 키보드 회피',
 desc:'입력창을 누르면 키보드가 화면 아래를 덮어요. 하단 버튼은 키보드 바로 위로 따라 올라와야 가려지지 않아요(Keyboard avoidance).',
 dev:'keyboardLayoutGuide · adjustResize · imePadding',hint:'입력창 클릭',
 html:`<div class="app">${bar('메모','back','')}<div class="m-body"><div class="tf"><label>제목</label><div class="w"><input class="ki" placeholder="눌러서 입력"></div></div></div></div><div class="kbcta"><button class="m-cta">저장</button></div><div class="kb"><div>${'<i></i>'.repeat(10)}</div><div>${'<i></i>'.repeat(9)}</div><div><i class="s"></i>${'<i></i>'.repeat(7)}<i class="s"></i></div><div><i class="s"></i><i class="w"></i><i class="s"></i></div></div>`,
 init(st){const kb=st.querySelector('.kb'),cta=st.querySelector('.kbcta'),i=st.querySelector('.ki');const set=v=>{kb.classList.toggle('show',v);cta.classList.toggle('up',v);};i.addEventListener('focus',()=>set(true));st.querySelector('.m-bar').addEventListener('click',()=>{i.blur();set(false);});cta.onclick=()=>{i.blur();set(false);};}},
{cat:'device',ko:'터치 영역',en:'Touch Target',alias:'히트 영역(Hit area), 탭 영역, 최소 터치 크기',
 desc:'손가락으로 누를 수 있는 실제 영역이에요. 아이콘이 작아도 터치 영역은 최소 44×44pt(iOS)·48×48dp(Android)로 넓혀 주세요.',
 dev:'contentShape · minimumInteractiveComponentSize',
 html:`<div class="app">${bar('터치 영역','back','')}<div class="tt-demo"><div class="r"><div class="tt-box" style="width:44px;height:44px"><span class="hit" style="inset:0;border-color:#34c759;background:rgba(52,199,89,.1)"></span>${I('heart',20)}<small style="color:#16a34a">44×44 ✓</small></div><div class="tt-box" style="width:20px;height:20px"><span class="hit" style="inset:0;border-color:#ff3b30;background:rgba(255,59,48,.1)"></span>${I('heart',20)}<small style="color:#ff3b30">20×20 ✕</small></div></div><div class="r" style="margin-top:20px"><div class="tt-box" style="width:150px;height:44px"><span class="hit" style="inset:0;border-color:var(--accent);background:rgba(61,90,254,.08)"></span><span style="font-size:11px;color:var(--accent)">텍스트 링크 →</span><small style="color:var(--accent)">글자보다 넓은 터치 영역</small></div></div></div></div>`},
{cat:'device',ko:'시스템 내비게이션 바',en:'System Navigation Bar',alias:'안드로이드 내비게이션 바, 3버튼 / 제스처 내비게이션',
 desc:'Android 기기 하단의 시스템 영역이에요. 뒤로·홈·최근 앱 3버튼 방식과 얇은 제스처 바 방식이 있어 두 경우 모두 대응해야 해요.',
 dev:'WindowInsets.navigationBars · edge-to-edge',hint:'버튼으로 방식 전환',
 html:`<div class="app" style="padding-bottom:44px">${bar('홈','menu','')}<div class="m-body">${cards(2)}<div class="m-pad"><button class="m-cta dark tg">제스처 방식으로 보기</button></div></div></div><div class="andnav"><span>◁</span><span>○</span><span>□</span></div><span class="lbl" style="right:8px;bottom:48px">Navigation Bar</span>`,
 init(st){const n=st.querySelector('.andnav'),b=st.querySelector('.tg');st.parentElement.querySelector('.ph-hi').style.display='none';b.onclick=()=>{const g=n.classList.toggle('gest');b.textContent=g?'3버튼 방식으로 보기':'제스처 방식으로 보기';};}},
{cat:'device',ko:'엄지 영역',en:'Thumb Zone',alias:'썸 존, 한 손 조작 영역',
 desc:'한 손으로 폰을 쥐었을 때 엄지가 편하게 닿는 범위예요. 초록(쉬움)에 자주 쓰는 버튼을, 빨강(어려움)엔 덜 중요한 요소를 둬요.',
 dev:'reachability · bottom-first layout',
 html:`<div class="app">${bar('홈','','bell')}<div class="m-body">${cards(3)}</div>${tabbar(0)}</div><div class="thumb"></div><span class="lbl" style="right:30px;bottom:110px;background:#16a34a">쉬움</span><span class="lbl" style="left:20px;top:200px;background:#ca8a04">보통</span><span class="lbl" style="left:10px;top:70px;background:#dc2626">어려움</span>`},
];

const MODE='MO';
const ALL_DESC='모바일 앱에서 쓰는 UI·모션·화면 명칭을 한 번에 모았어요. 왼쪽 메뉴에서 카테고리를 골라 좁혀 보세요.';
const SB='<b>9:41</b><svg width="38" height="10" viewBox="0 0 38 10"><rect x="0" y="6" width="3" height="4" rx="1"/><rect x="4.5" y="4" width="3" height="6" rx="1"/><rect x="9" y="2" width="3" height="8" rx="1"/><rect x="13.5" y="0" width="3" height="10" rx="1"/><rect x="21" y="1" width="14" height="8" rx="2.5" fill="none" stroke="currentColor"/><rect x="22.5" y="2.5" width="9" height="5" rx="1"/><rect x="35.8" y="3.5" width="1.6" height="3" rx=".7"/></svg>';
const STAGE=it=>`<div class="ph ${it.dark?'dark':''}"><div class="ph-scr"></div><div class="ph-sb">${SB}</div><div class="ph-island"></div><div class="ph-hi"></div></div>`;
function MOUNT(a,it){const ph=a.querySelector('.ph'),st=a.querySelector('.ph-scr'),isl=a.querySelector('.ph-island');const c=ctx(st);ph.classList.toggle('dark',!!it.dark);ph.classList.remove('buzz');isl.className='ph-island';isl.innerHTML='';a.querySelector('.ph-hi').style.display='';st.innerHTML=it.html;try{it.init&&it.init(st,c);}catch(e){console.error(it.en,e);}}
/* ===== rendering (shared PC/MO shell) ===== */
const $=s=>document.querySelector(s);
const nav=$('#nav'),grid=$('#grid'),q=$('#q');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let current=CATS[0].id;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('show'),1600);}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true;}catch(e){}try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok;}catch(e){return false;}}
function makeCard(it,showCat){
  const a=document.createElement('article');a.className='card';const cat=CATS.find(c=>c.id===it.cat);
  a.innerHTML=`<div class="stage">${STAGE(it)}${it.hint?`<span class="hint">${it.hint}</span>`:''}<button class="replay" title="다시 재생" aria-label="다시 재생">↻</button></div>
  <div class="meta">${showCat?`<span class="cattag">${cat.ko}</span>`:''}<div class="names"><h3>${it.ko}</h3><span class="en">${it.en}</span></div>${it.alias?`<p class="alias">= ${it.alias}</p>`:''}<p class="desc">${it.desc}</p>
  <div class="foot">${it.dev?`<code class="dev" title="${esc(it.dev)}">${esc(it.dev)}</code>`:'<span style="flex:1"></span>'}<button class="copy">명칭 복사</button></div></div>`;
  const mount=()=>MOUNT(a,it);
  a.querySelector('.replay').onclick=mount;
  a.querySelector('.copy').onclick=async()=>{const t=`${it.ko} (${it.en})`;const ok=await copyText(t);toast(ok?`복사했어요 · ${t}`:t);};
  a._mount=mount;return a;
}
let io=null;
function renderCards(list,showCat){
  if(io)io.disconnect();grid.innerHTML='';
  if(!list.length){grid.innerHTML='<p class="empty-res">찾는 명칭이 없어요. 다른 단어(영문/한글)로 검색해 보세요.</p>';return;}
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&!e.target._done){e.target._done=true;e.target._mount();}}),{rootMargin:'400px 0px'});
  list.forEach(it=>{const c=makeCard(it,showCat);grid.appendChild(c);io.observe(c);});
}
function head(eb,t,d){$('#eyebrow').textContent=eb;$('#title').textContent=t;$('#desc').textContent=d;}
function setNav(id){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));const on=nav.querySelector('button.on');if(on&&getComputedStyle(nav).flexDirection==='row')nav.scrollTo({left:on.offsetLeft-12,behavior:'smooth'});}
function show(id){
  if(id==='all'){current='all';setNav('all');head(`${MODE} · 00 · All · ${ITEMS.length}개`,'전체 보기',ALL_DESC);renderCards(ITEMS,true);window.scrollTo(0,0);return;}
  const cat=CATS.find(c=>c.id===id)||CATS[0];current=cat.id;setNav(cat.id);
  const list=ITEMS.filter(x=>x.cat===cat.id);
  head(`${MODE} · ${String(CATS.indexOf(cat)+1).padStart(2,'0')} · ${cat.en} · ${list.length}개`,cat.ko,cat.desc);
  renderCards(list,false);window.scrollTo(0,0);
}
function search(v){
  const k=v.trim().toLowerCase();if(!k){show(current);return;}
  const list=ITEMS.filter(it=>[it.ko,it.en,it.alias||'',it.desc,it.dev||''].join(' ').toLowerCase().includes(k));
  setNav('__none');head(`${MODE} · Search · ${list.length}개`,`“${v.trim()}” 검색 결과`,'모든 카테고리에서 한글명 · 영문명 · 별칭 · 설명을 함께 찾았어요.');
  renderCards(list,true);
}
nav.innerHTML=`<button data-id="all"><span class="n">00</span><span class="k">전체<small>All</small></span><span class="c">${ITEMS.length}</span></button>`+CATS.map((c,i)=>`<button data-id="${c.id}"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="k">${c.ko}<small>${c.en}</small></span><span class="c">${ITEMS.filter(x=>x.cat===c.id).length}</span></button>`).join('');
const valid=id=>id==='all'||CATS.some(c=>c.id===id);
nav.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;q.value='';if(location.hash==='#'+b.dataset.id)show(b.dataset.id);else location.hash=b.dataset.id;});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(valid(id)){q.value='';show(id);}});
let qt;q.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>search(q.value),180);});
const md=$('.mode');md.addEventListener('click',()=>{md.classList.add('go');setTimeout(()=>md.classList.remove('go'),900);});
const sid=location.hash.slice(1);show(valid(sid)?sid:CATS[0].id);
</script>
</body>
</html>
